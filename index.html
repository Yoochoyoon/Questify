<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questify</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 w-screen h-[100dvh] overflow-hidden flex justify-center items-center font-sans select-none md:p-0">

    <!-- 전체 앱 화면: 좌측 게임 화면과 우측 메뉴 패널을 한 화면 안에 배치하는 최상위 레이아웃 -->
    <div class="flex flex-col md:flex-row w-full h-full md:max-h-[99%] md:max-w-[calc(100vh*1.6666)] md:aspect-[5/3] bg-white md:p-1 gap-1 md:gap-1.5 md:shadow-2xl overflow-hidden relative border-[3px] border-black">

        <!-- 좌측 영역: 실제 플레이/진행 화면. 모바일에서는 상단, PC에서는 왼쪽에 위치 -->
        <div id="left-panel" class="h-[45%] md:h-full w-full md:w-[60%] relative overflow-hidden shrink-0 border-[4px] border-black bg-white transition-all duration-300">
            <!-- 좌측 패널 상단: 모바일에서 우측 메뉴를 숨기면 이 영역이 전체 높이로 확장됨 -->
            <button id="mobile-toggle-btn" class="md:hidden absolute top-2 right-2 px-3 py-1.5 bg-white border-[2px] border-black rounded-lg z-40 shadow-sm font-bold text-xs hover:bg-gray-100 active:scale-95 transition-all">
                메뉴 숨기기
            </button>

            <div id="game-screen" class="absolute inset-0 bg-white w-full h-full z-10 overflow-hidden relative">
                <!-- 기본 메인 화면: 오늘의 목표, 유저 정보, 캐릭터 표시가 보이는 시작 상태 -->
                <div class="absolute top-0 left-0 w-full z-30 flex flex-col p-2 md:p-3 lg:p-4 gap-2 md:gap-3 pointer-events-none">
                    <div class="pointer-events-auto">
                        <h2 class="text-black font-bold text-sm md:text-lg lg:text-xl ml-[2.5%]">오늘의 목표</h2>
                        <div class="w-full mx-auto md:w-[95%] max-w-full h-6 md:h-8 bg-white border-[2px] border-black relative mt-1">
                            <div class="w-2/3 h-full bg-gray-300"></div>
                            <span class="absolute inset-0 flex justify-center items-center text-black text-[10px] lg:text-sm font-bold">2/3</span>
                        </div>
                    </div>
                    
                    <div class="pointer-events-auto ml-[2.5%] bg-white rounded-md p-1.5 md:p-2 lg:p-3 border-[2px] border-black w-[120px] md:w-[160px] lg:w-[200px]">
                        <div class="text-black text-[10px] md:text-sm lg:text-base font-bold tracking-wide truncate">내이름은여덟글자</div>
                        <div class="text-gray-600 text-[9px] md:text-xs lg:text-sm font-bold mt-0.5 md:mt-1">Lv.999</div>
                        <div class="w-full h-1.5 md:h-2 lg:h-3 bg-gray-300 border border-black mt-1"></div>
                    </div>
                </div>

                <div id="draggable-character" class="absolute bottom-[8%] md:bottom-[10%] left-1/2 transform -translate-x-1/2 w-[40%] max-w-[140px] md:max-w-[180px] flex flex-col items-center justify-end z-20 cursor-grab active:cursor-grabbing touch-none pointer-events-auto shrink-0">
                    <div class="w-[70%] aspect-square bg-white border-[3px] md:border-[4px] border-black rounded-full mb-[-10px] z-10 shrink-0 pointer-events-none"></div> 
                    <div class="w-full aspect-[5/6] bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none"></div> 
                </div>
            </div>

            <div id="timer-screen" class="absolute inset-0 bg-white w-full h-full z-30 hidden overflow-hidden">
                <!-- 타이머 전용 화면: 메인 화면 위에 겹쳐지는 전체 오버레이. 타이머 조작에만 집중하는 화면 -->
                <button id="close-timer-btn" class="absolute top-2 left-2 md:top-4 md:left-4 w-8 h-8 md:w-10 md:h-10 bg-white rounded-full border-[2px] md:border-[3px] border-black flex justify-center items-center z-40 hover:bg-gray-100 active:scale-95 transition-all shadow-sm cursor-pointer">
                    <span class="text-black font-bold text-sm md:text-base mb-0.5">X</span>
                </button>

                <div class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none pt-12 pb-4 md:pt-16 md:pb-10">
                    
                    <div class="flex flex-col items-center justify-center w-full min-h-0 max-h-full">
                        
                        <div class="flex items-end justify-center gap-2 md:gap-6 w-full max-w-[800px] px-2 pointer-events-auto z-10 shrink min-h-[100px] h-[35vh] max-h-[220px] md:max-h-[320px]">
                            
                            <div id="speech-bubble" class="hidden md:flex flex-col justify-start h-full w-[45%] md:w-[50%] max-w-[420px]">
                                <div class="relative w-full h-[80px] md:h-[110px] lg:h-[130px] shrink-0 bg-white border-[3px] md:border-[4px] border-black rounded-[2rem] md:rounded-[3rem] shadow-sm flex items-center justify-center mt-2 md:mt-4">
                                    <div class="absolute top-1/2 -translate-y-1/2 -right-[11px] md:-right-[15px] w-5 h-5 md:w-8 md:h-8 bg-white border-t-[3px] md:border-t-[4px] border-r-[3px] md:border-r-[4px] border-black transform rotate-45 z-10"></div>
                                </div>
                            </div>
                            
                            <div class="w-[30%] max-w-[140px] md:max-w-[180px] h-full flex flex-col items-center pointer-events-auto shrink min-h-[60px]">
                                <div class="w-[70%] max-w-[120px] aspect-square bg-white border-[3px] md:border-[4px] border-black rounded-full mb-[-10px] z-10 shrink-0"></div>
                                <div class="w-full flex-1 bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink min-h-[20px]"></div>
                            </div>
                        </div>

                        <div class="w-[95%] md:w-[85%] max-w-[700px] bg-gray-100 border-[4px] md:border-[5px] border-black rounded-xl p-4 md:p-6 lg:p-8 shadow-sm z-20 pointer-events-auto flex flex-col gap-3 md:gap-5 shrink-0 -mt-10 md:-mt-16 relative">
                            
                            <div class="w-full bg-white border-[3px] md:border-[4px] border-black rounded-lg py-4 md:py-6 lg:py-8 min-h-[80px] md:min-h-[120px] flex justify-center items-center shadow-sm relative overflow-hidden">
                                <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8" class="text-black text-[12vw] sm:text-5xl md:text-7xl lg:text-[6rem] font-black tracking-normal sm:tracking-wider leading-none text-center bg-transparent outline-none w-full z-10">
                            </div>
                            
                            <div class="w-full flex justify-center gap-4 md:gap-8 px-1 md:px-8">
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="3600">+ 1h</button>
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="1800">+ 30m</button>
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="300">+ 5m</button>
                            </div>
                            
                            <div class="w-full flex justify-center gap-3 mt-1 md:mt-2">
                                <button id="reset-timer-btn" class="bg-white border-[3px] md:border-[4px] border-black rounded-lg w-[25%] md:w-[20%] py-2 md:py-3 lg:py-4 text-black font-black text-sm md:text-lg lg:text-xl shadow-sm hover:bg-gray-100 active:scale-95 transition-all">초기화</button>
                                <button id="start-timer-btn" class="bg-gray-200 border-[3px] md:border-[4px] border-black rounded-lg w-[50%] md:w-[40%] py-2 md:py-3 lg:py-4 text-black font-black text-lg md:text-xl lg:text-2xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all">시작</button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div id="modal-overlay" class="absolute inset-0 bg-gray-900/60 z-50 hidden justify-center items-center p-4 md:p-6">
                <!-- 문제 생성/풀이 팝업 오버레이: 배경을 어둡게 덮고 중앙 모달만 띄우는 영역 -->
                <div id="create-modal" class="bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-3 md:p-5 flex flex-col gap-3 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <input type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner" placeholder="문제제목을입력해주세요. 스물일곱자까지입력해주세요.">
                    <textarea class="w-full flex-1 bg-gray-50 border-[2.5px] border-gray-400 rounded-xl px-4 py-3 text-sm md:text-base font-bold text-black outline-none resize-none placeholder-gray-500 shadow-inner" placeholder="문제를 적어주세요."></textarea>
                    <input type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner mt-1" placeholder="정답을 적어주세요.">
                    <button id="btn-submit-create" class="bg-gray-200 border-[3px] border-black rounded-lg py-1.5 md:py-2 px-10 text-black font-black text-base md:text-xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all self-center mt-2">제작</button>
                </div>
                
                <div id="solve-modal" class="bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-3 md:p-5 flex flex-col gap-3 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <div class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black shadow-inner flex items-center">문제제목을입력해주세요. 스물일곱자까지입력해주세요.</div>
                    <div class="w-full flex-1 bg-gray-50 border-[2.5px] border-gray-400 rounded-xl px-4 py-3 text-sm md:text-base font-bold text-black overflow-y-auto shadow-inner">문제 내용이 여기에 표시됩니다.</div>
                    
                    <div class="w-full flex flex-col items-center mt-1">
                        <div id="solve-input-state" class="w-full flex flex-col gap-3">
                            <input type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner" placeholder="정답을 적어주세요.">
                            <button id="btn-grade-problem" class="bg-gray-200 border-[3px] border-black rounded-lg py-1.5 md:py-2 px-10 text-black font-black text-base md:text-xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all self-center mt-1">채점</button>
                        </div>
                        <div id="solve-result-state" class="w-full hidden bg-gray-100 border-[2px] border-gray-300 rounded-xl px-2 py-1 text-center text-xs md:text-sm font-bold text-black leading-relaxed overflow-y-auto h-24 md:h-28 break-all">정답이 적어질 공간입니다.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 메뉴 영역: 일일퀘스트와 문제저장소를 탭으로 전환하는 보조 패널 -->
        <div id="right-panel-wrapper" class="flex-1 md:h-full w-full md:w-[40%] flex flex-col relative overflow-hidden border-[4px] border-black bg-gray-100 transition-colors duration-200">
            <div id="panel-quest" class="flex-1 flex flex-col overflow-hidden">
            <!-- 우측 패널 기본 탭: 오늘 처리할 일일퀘스트 목록이 표시되는 화면 -->
                <div class="pt-3 md:pt-[4%] pb-2 md:pb-[3%] shrink-0">
                    <h1 class="text-black text-xl md:text-3xl lg:text-4xl font-black text-center tracking-widest">일일퀘스트</h1>
                </div>
                <div class="flex-1 px-2 md:px-[4%] flex flex-col gap-2 md:gap-[3%] overflow-y-auto pb-16 md:pb-[20%]">
                    <div class="bg-white border-[2.5px] border-black rounded shadow-sm flex justify-between items-center p-1.5 lg:p-2 min-h-[44px] md:min-h-[48px] shrink-0">
                        <input type="text" placeholder="퀘스트이름을 입력해주세요." class="bg-transparent text-black placeholder-gray-400 text-xs md:text-sm lg:text-base w-full outline-none px-1" readonly>
                        <div class="flex gap-1 shrink-0">
                            <button class="bg-gray-200 text-black text-[10px] md:text-xs lg:text-sm px-2 lg:px-3 py-1 border border-black rounded-sm shadow-sm active:translate-y-px transition-transform">실패</button>
                            <button class="bg-gray-200 text-black font-bold text-[10px] md:text-xs lg:text-sm px-2 lg:px-3 py-1 border border-black rounded-sm shadow-sm active:translate-y-px transition-transform">수락</button>
                        </div>
                    </div>
                    
                    <div class="bg-gray-200 border-[2.5px] border-black rounded shadow-sm flex items-center p-1.5 lg:p-2 min-h-[44px] md:min-h-[48px] relative overflow-hidden shrink-0">
                        <input type="text" placeholder="퀘스트이름을 입력해주세요." class="bg-transparent text-gray-500 placeholder-gray-500 text-xs md:text-sm lg:text-base w-full outline-none px-1" readonly disabled>
                        <span class="absolute right-3 text-gray-600 opacity-50 text-xl md:text-3xl lg:text-4xl font-black tracking-widest pointer-events-none">클리어</span>
                    </div>

                    <button class="bg-white border-[2.5px] border-black border-dashed rounded min-h-[44px] md:min-h-[48px] flex justify-center items-center hover:bg-gray-50 transition-colors shrink-0">
                        <span class="text-black opacity-30 text-3xl lg:text-5xl font-bold leading-none mb-1">+</span>
                    </button>
                </div>
            </div>

            <div id="panel-storage" class="flex-1 flex flex-col overflow-hidden hidden">
            <!-- 우측 패널 보조 탭: 저장해둔 문제를 다시 꺼내 풀 수 있는 목록 화면 -->
                <div class="pt-3 md:pt-[4%] pb-2 md:pb-[3%] shrink-0">
                    <h1 class="text-black text-xl md:text-3xl lg:text-4xl font-black text-center tracking-widest">문제저장소</h1>
                </div>
                <div class="flex-1 px-2 md:px-[4%] flex flex-col gap-2 md:gap-[3%] overflow-y-auto pb-16 md:pb-[20%]">
                    <div class="bg-white border-[2.5px] border-black rounded shadow-sm flex flex-col p-2 min-h-[60px] md:min-h-[72px] shrink-0 relative gap-2">
                        <div class="text-black text-xs md:text-sm font-bold truncate pr-6">문제제목을입력해주세요. 스물일곱자까지입력해주세요.</div>
                        <div class="flex justify-between items-end mt-auto">
                            <span class="bg-gray-200 border border-black text-black text-[9px] md:text-[10px] px-2 py-0.5 rounded-full">프론트엔드 프로그래밍</span>
                            <button id="btn-open-solve" class="bg-gray-200 border-[2px] border-black rounded px-3 py-1 text-black font-bold text-[10px] md:text-xs shadow hover:bg-gray-300 active:scale-95 transition-all">다시풀기</button>
                        </div>
                    </div>

                    <button id="btn-open-create" class="bg-white border-[2.5px] border-black border-dashed rounded min-h-[44px] md:min-h-[48px] flex justify-center items-center hover:bg-gray-50 transition-colors shrink-0">
                        <span class="text-black opacity-40 text-3xl md:text-4xl font-bold leading-none mb-1">+</span>
                    </button>
                </div>
            </div>

            <div id="open-timer-btn" class="absolute bottom-12 md:bottom-[15%] right-3 md:right-[5%] w-10 h-10 md:w-[12%] md:aspect-square md:h-auto max-h-[64px] max-w-[64px] min-w-[40px] min-h-[40px] bg-white rounded-full border-[2.5px] md:border-[3px] border-black shadow-sm flex justify-center items-center cursor-pointer hover:scale-105 transition-all z-10">
                <!-- 우측 패널 위에 떠 있는 원형 버튼: 타이머 화면을 열기 위한 빠른 진입 버튼 -->
                <div class="w-[10%] h-[20%] bg-black absolute top-[15%] rounded-full"></div>
                <div class="w-[20%] h-[10%] bg-black absolute right-[15%] rounded-full"></div>
                <div class="absolute -top-[15%] w-[20%] h-[20%] bg-black rounded-sm"></div>
            </div>

            <div class="h-10 md:h-[10%] min-h-[40px] md:min-h-[48px] flex border-t-[3px] border-black w-full mt-auto shrink-0 bg-gray-200">
                <!-- 우측 하단 탭 바: 일일퀘스트와 문제저장소를 전환하는 고정 내비게이션 -->
                <div id="tab-quest" class="flex-1 bg-white border-r-[3px] border-black flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all">
                    <span id="tab-quest-text" class="text-black font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2">📜 일일퀘스트</span>
                </div>
                <div id="tab-storage" class="flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors">
                    <span id="tab-storage-text" class="text-gray-500 font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2">💡 문제저장소</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 인터랙션 스크립트: 버튼 클릭에 따라 화면 전환, 탭 전환, 모달 열기/닫기를 처리
        const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
        const leftPanel = document.getElementById('left-panel');
        const rightPanelWrapper = document.getElementById('right-panel-wrapper');
        
        // 1. 모바일에서만 보이는 메뉴 숨김 버튼: 오른쪽 패널을 접고 펼쳐서 좌측 화면을 넓히는 기능
        mobileToggleBtn.addEventListener('click', () => {
            const isHidden = rightPanelWrapper.classList.toggle('hidden');
            const speechBubble = document.getElementById('speech-bubble'); // 말풍선 제어용 객체
            
            if (isHidden) {
                // 우측 메뉴를 숨기면 좌측 게임 화면이 세로 전체를 차지하도록 높이를 늘림
                leftPanel.classList.replace('h-[45%]', 'h-full');
                mobileToggleBtn.innerText = '메뉴 보기';
                // 메뉴를 숨긴 상태에서는 공간이 넉넉해지므로 말풍선을 다시 보여줌
                if(speechBubble) {
                    speechBubble.classList.remove('hidden');
                    speechBubble.classList.add('flex');
                }
            } else {
                // 우측 메뉴를 다시 켜면 모바일 분할 레이아웃 높이로 되돌림
                leftPanel.classList.replace('h-full', 'h-[45%]');
                mobileToggleBtn.innerText = '메뉴 숨기기';
                // 메뉴가 보이는 상태에서는 공간이 좁아 말풍선을 숨겨 화면을 정리함
                if(speechBubble) {
                    speechBubble.classList.add('hidden');
                    speechBubble.classList.remove('flex');
                }
            }
        });

        // 2. 화면 크기가 PC 기준으로 바뀔 때: 모바일에서 숨겨둔 패널과 높이 값을 원래 상태로 복구
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) { 
                rightPanelWrapper.classList.remove('hidden');
                leftPanel.classList.remove('h-full');
                leftPanel.classList.add('h-[45%]'); 
                mobileToggleBtn.innerText = '메뉴 숨기기';
            }
        });

        const gameScreen = document.getElementById('game-screen');
        const timerScreen = document.getElementById('timer-screen');
        const openTimerBtn = document.getElementById('open-timer-btn');
        const closeTimerBtn = document.getElementById('close-timer-btn');
        
        // 3. 좌측 화면 위에 타이머 오버레이를 띄우거나 닫는 전환 로직
        function toggleTimerScreen() {
            if (timerScreen.classList.contains('hidden')) {
                // 타이머 화면 표시: 메인 게임 화면을 숨기고 타이머 전용 화면을 보여줌
                gameScreen.classList.add('hidden');
                timerScreen.classList.remove('hidden');
                timerScreen.classList.add('block'); 
                openTimerBtn.classList.replace('bg-white', 'bg-gray-300'); // 원형 버튼 색을 바꿔서 현재 타이머 화면이 열려 있다는 상태를 시각적으로 알려줌 
            } else {
                // 타이머 화면 닫기: 오버레이를 숨기고 다시 메인 게임 화면으로 복귀
                timerScreen.classList.add('hidden');
                timerScreen.classList.remove('block');
                gameScreen.classList.remove('hidden');
                openTimerBtn.classList.replace('bg-gray-300', 'bg-white');

                const draggableCharacter = document.getElementById('draggable-character');
                if (draggableCharacter) {
                    draggableCharacter.style.bottom = '';
                    draggableCharacter.style.transform = '';
                    draggableCharacter.style.left = '';
                    draggableCharacter.style.top = '';
                }
            }
        }
        openTimerBtn.addEventListener('click', toggleTimerScreen);
        closeTimerBtn.addEventListener('click', toggleTimerScreen);

        // 4. 우측 하단 탭 전환: 일일퀘스트 화면과 문제저장소 화면을 서로 교체하는 로직
        const tabQuest = document.getElementById('tab-quest');
        const tabQuestText = document.getElementById('tab-quest-text');
        const panelQuest = document.getElementById('panel-quest');
        const tabStorage = document.getElementById('tab-storage');
        const tabStorageText = document.getElementById('tab-storage-text');
        const panelStorage = document.getElementById('panel-storage');
        
        tabStorage.addEventListener('click', () => {
            panelQuest.classList.add('hidden');
            panelStorage.classList.remove('hidden');
            tabStorage.className = "flex-1 bg-white border-black border-l-[3px] flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all";
            tabStorageText.className = "text-black font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
            tabQuest.className = "flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors";
            tabQuestText.className = "text-gray-500 font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
        });
        
        tabQuest.addEventListener('click', () => {
            panelStorage.classList.add('hidden');
            panelQuest.classList.remove('hidden');
            tabQuest.className = "flex-1 bg-white border-black border-r-[3px] flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all";
            tabQuestText.className = "text-black font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
            tabStorage.className = "flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors";
            tabStorageText.className = "text-gray-500 font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
        });

        // 5. 문제 생성 및 풀기 모달(팝업) 제어 로직
        const modalOverlay = document.getElementById('modal-overlay');
        const createModal = document.getElementById('create-modal');
        const solveModal = document.getElementById('solve-modal');
        const btnOpenCreate = document.getElementById('btn-open-create'); // '+' 버튼: 문제저장소에서 새 문제를 만드는 작성 모달을 여는 버튼 
        const btnOpenSolve = document.getElementById('btn-open-solve');   // '다시풀기' 버튼: 저장된 문제를 다시 풀 수 있도록 풀이 모달을 여는 버튼 
        const btnSubmitCreate = document.getElementById('btn-submit-create'); // 문제 작성 완료 버튼: 입력한 문제를 저장하고 모달을 닫는 역할 
        const btnGradeProblem = document.getElementById('btn-grade-problem'); // 정답 입력 후 채점 버튼: 사용자의 답안을 검사하고 결과 영역으로 전환 
        const solveInputState = document.getElementById('solve-input-state'); // 채점 전에 보이는 입력 영역 묶음: 정답 입력칸과 채점 버튼을 포함 
        const solveResultState = document.getElementById('solve-result-state'); // 채점 후에 보이는 결과 영역 묶음: 정답/오답 안내 또는 피드백을 표시 
        
        btnOpenCreate.addEventListener('click', () => {
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            createModal.classList.remove('hidden');
            solveModal.classList.add('hidden');
        });
        
        btnSubmitCreate.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            modalOverlay.classList.remove('flex');
        });
        
        btnOpenSolve.addEventListener('click', () => {
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            solveModal.classList.remove('hidden');
            createModal.classList.add('hidden');
            solveInputState.classList.remove('hidden');
            solveResultState.classList.add('hidden');
        });
        
        btnGradeProblem.addEventListener('click', () => {
            solveInputState.classList.add('hidden');
            solveResultState.classList.remove('hidden');
        });
        
        document.querySelectorAll('.close-modal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('flex');
            });
        });

        // ------------------------------------------------------------------
        // [새로 추가된 기능] 타이머 코어 로직 및 마스킹 입력(Masked Input) 제어
        // ------------------------------------------------------------------
        const timerDisplay = document.getElementById('timer-display');
        const startTimerBtn = document.getElementById('start-timer-btn');
        const resetTimerBtn = document.getElementById('reset-timer-btn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        
        // [새로 추가된 기능] 타이머 상태 관리용 변수 모음
        let totalSeconds = 0;
        let timerInterval = null;
        let timerRunning = false;
        let timerPaused = false;
        
        // [새로 추가된 기능] HH:MM:SS 포맷에서 콜론(:)을 제외한 순수 숫자가 위치하는 문자열 인덱스 매핑 상수
        const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

        // [새로 추가된 기능] 초(Seconds)를 입력받아 HH:MM:SS 문자열로 포맷팅하는 함수
        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        // [새로 추가된 기능] 사용자가 입력한 6자리 숫자 배열을 초(Seconds)로 역산하는 함수
        function totalSecondsFromDigits(digits) {
            const h = Number(`${digits[0]}${digits[1]}`) || 0;
            const m = Number(`${digits[2]}${digits[3]}`) || 0;
            const s = Number(`${digits[4]}${digits[5]}`) || 0;
            return (h * 3600) + (m * 60) + s;
        }

        // [새로 추가된 기능] 계산된 시간을 Input UI에 반영
        function updateDisplays() {
            timerDisplay.value = formatTime(totalSeconds);
        }

        // [새로 추가된 기능] 타이머 실행 코어 로직
        function startTimer() {
            if (totalSeconds <= 0) return;
            
            timerRunning = true;
            timerPaused = false;
            startTimerBtn.innerText = '일시정지';
            timerDisplay.disabled = true; // 타이머 진행 중에는 수동 입력 방지 
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (timerPaused) return; // 일시정지 상태면 초 차감 무시 
                
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplays();
                }
                
                if (totalSeconds <= 0) {
                    totalSeconds = 0;
                    updateDisplays();
                    stopTimer();
                    alert('타이머가 종료되었습니다!'); // 실제 구현시에는 모달이나 알림으로 변경 권장 
                }
            }, 1000);
        }

        // [새로 추가된 기능] 타이머 중지 및 권한 복구 로직
        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            timerRunning = false;
            timerPaused = false;
            startTimerBtn.innerText = '시작';
            timerDisplay.disabled = false; // 수동 입력 권한 복구 
        }

        // [새로 추가된 기능] 타이머 시작 및 일시정지 버튼 이벤트
        startTimerBtn.addEventListener('click', () => {
            if (timerRunning) {
                timerPaused = !timerPaused;
                startTimerBtn.innerText = timerPaused ? '계속' : '일시정지';
            } else {
                startTimer();
            }
        });

        // [새로 추가된 기능] 타이머 완전 초기화 버튼 이벤트
        resetTimerBtn.addEventListener('click', () => {
            stopTimer();
            totalSeconds = 0;
            updateDisplays();
        });

        // [새로 추가된 기능] 프리셋 버튼(시간 빠른 추가) 클릭 이벤트 (+1h, +30m, +5m)
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (timerRunning && !timerPaused) return; // 타이머 실행 중에는 추가 막기 
                const addTime = parseInt(btn.getAttribute('data-time'));
                totalSeconds += addTime;
                if(totalSeconds > 359999) totalSeconds = 359999; // 99:59:59 초과 방지 
                updateDisplays();
            });
        });

        // [새로 추가된 기능] 사용자 직접 입력을 위한 마스킹(Masked Input) 방향키 및 숫자 치환 로직
        timerDisplay.addEventListener('keydown', (e) => {
            if (timerRunning) {
                e.preventDefault();
                return;
            }

            // 방향키 및 특수 이동키는 허용
            if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return;

            e.preventDefault(); // 브라우저의 기본 타이핑 동작 강제 차단 

            let digits = timerDisplay.value.replace(/:/g, '').split('');
            const start = timerDisplay.selectionStart;
            
            // 현재 마우스/키보드 커서 위치와 가장 가까운 순수 숫자 인덱스를 추적
            let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start);
            if (digitIndex === -1) digitIndex = 5;

            if (/\d/.test(e.key)) {
                // 일반 숫자 입력 시 덮어쓰기 로직
                digits[digitIndex] = e.key;
                totalSeconds = totalSecondsFromDigits(digits);
                updateDisplays();
                
                // 입력 직후 다음 숫자 위치로 커서를 자동 이동
                let nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1;
                timerDisplay.setSelectionRange(nextPos, nextPos);
                
            } else if (e.key === 'Backspace') {
                // 뒤로가기(백스페이스) 시 앞자리 숫자를 0으로 치환하고 커서를 당김
                let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1;
                if (start === timerDisplay.value.length) targetIdx = 5;
                
                if (targetIdx >= 0) {
                    digits[targetIdx] = '0';
                    totalSeconds = totalSecondsFromDigits(digits);
                    updateDisplays();
                    
                    let nextPos = DIGIT_POSITIONS[targetIdx];
                    timerDisplay.setSelectionRange(nextPos, nextPos);
                }
            } else if (e.key === 'Delete') {
                // Delete 키 사용 시 현재 커서 위치의 숫자를 0으로 치환하고 커서 위치 고정
                 let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start);
                 if(targetIdx !== -1) {
                    digits[targetIdx] = '0';
                    totalSeconds = totalSecondsFromDigits(digits);
                    updateDisplays();
                    timerDisplay.setSelectionRange(start, start);
                 }
            }
        });
        
        // [새로 추가된 기능] Input UI 클릭 시 콜론(:) 문자 위에서 커서가 깜빡이지 않도록 바로 옆 숫자로 강제 보정
        timerDisplay.addEventListener('click', (e) => {
            const start = timerDisplay.selectionStart;
            if (!DIGIT_POSITIONS.includes(start) && start !== 8) {
                const nextPos = DIGIT_POSITIONS.find(pos => pos > start) || 8;
                timerDisplay.setSelectionRange(nextPos-1, nextPos-1);
            }
        });

        // ------------------------------------------------------------------
        // [새로 추가된 기능] 게임 화면 캐릭터 드래그 이동 및 리사이즈 보정
        // ------------------------------------------------------------------
        const draggableCharacter = document.getElementById('draggable-character');
        const gameScreenBox = document.getElementById('game-screen');

        // 드래그 상태와 시작 위치를 저장하는 내부 상태값
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        // 캐릭터를 끌기 시작할 때 현재 좌표를 기준점으로 저장
        function startDrag(e) {
            if (gameScreenBox.classList.contains('hidden')) return;

            isDragging = true;
            draggableCharacter.classList.replace('cursor-grab', 'cursor-grabbing');

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            startX = clientX;
            startY = clientY;

            const rect = draggableCharacter.getBoundingClientRect();
            const parentRect = gameScreenBox.getBoundingClientRect();

            initialLeft = rect.left - parentRect.left;
            initialTop = rect.top - parentRect.top;

            draggableCharacter.style.bottom = 'auto';
            draggableCharacter.style.transform = 'none';
            draggableCharacter.style.left = `${initialLeft}px`;
            draggableCharacter.style.top = `${initialTop}px`;
        }

        // 마우스/터치 이동값을 반영해 화면 안에서만 캐릭터 위치를 갱신
        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            const parentRect = gameScreenBox.getBoundingClientRect();
            const rect = draggableCharacter.getBoundingClientRect();

            if (newLeft < 0) newLeft = 0;
            if (newTop < 0) newTop = 0;
            if (newLeft + rect.width > parentRect.width) newLeft = parentRect.width - rect.width;
            if (newTop + rect.height > parentRect.height) newTop = parentRect.height - rect.height;

            draggableCharacter.style.left = `${newLeft}px`;
            draggableCharacter.style.top = `${newTop}px`;
        }

        // 드래그 종료 시 커서 상태를 원래대로 복귀
        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            draggableCharacter.classList.replace('cursor-grabbing', 'cursor-grab');
        }

        // 데스크톱과 터치 기기 모두에서 드래그 가능하도록 이벤트를 분기 등록
        draggableCharacter.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);

        draggableCharacter.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);

        // 화면 크기가 바뀌어도 캐릭터가 영역 밖으로 밀려나지 않도록 위치를 보정
        const resizeObserver = new ResizeObserver(() => {
            if (draggableCharacter.style.transform === 'none') {
                const parentRect = gameScreenBox.getBoundingClientRect();
                // 현재 위치가 화면 경계를 벗어났는지 검사한 뒤 범위 내로 되돌림
                const rect = draggableCharacter.getBoundingClientRect();
                
                let currentLeft = draggableCharacter.offsetLeft;
                let currentTop = draggableCharacter.offsetTop;

                if (currentLeft + rect.width > parentRect.width) currentLeft = parentRect.width - rect.width;
                if (currentTop + rect.height > parentRect.height) currentTop = parentRect.height - rect.height;
                if (currentLeft < 0) currentLeft = 0;
                if (currentTop < 0) currentTop = 0;

                draggableCharacter.style.left = `${currentLeft}px`;
                draggableCharacter.style.top = `${currentTop}px`;
            }
        });
        resizeObserver.observe(gameScreenBox);
    </script>
</body>
