<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- [문서 메타데이터] 인코딩 및 모바일 기기 화면 배율 고정 (사용자 임의 확대 방지) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Questify</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- [앱 루트 영역] -->
  <div class="app">

    <!-- [좌측 영역] -->
    <div id="left-panel" class="panel">
      <!-- 1. 메인 게임 화면 -->
      <div id="game-screen" class="screen">
        <div class="top-hud">
          <div>
            <h2 class="goal-title">오늘의 목표</h2>
            <div class="progress-wrap">
              <div id="progress-bar-fill"></div>
              <span id="progress-text">0/0</span>
            </div>
          </div>
          <div id="user-profile-card">
            <div class="profile-name">유니온(전체) 현황</div>
            <div class="profile-level" id="union-level-hud">유니온 Lv.1</div>
          </div>
        </div>

        <!-- 로비 캐릭터 컨테이너 -->
        <div id="lobby-container"></div>
      </div>

      <!-- 2. 집중 타이머 화면 -->
      <div id="timer-screen" class="screen hidden">
        <button id="close-timer-btn" class="round-close">X</button>
        <div class="timer-layout">
          <div class="timer-top">
            <div id="speech-bubble">
              <div class="bubble">
                <p style="margin:0;">타이머로 공부 시간을 설정하자!</p>
              </div>
            </div>
            <!-- 타이머 캐릭터 -->
            <div class="timer-character">
              <div class="char-body">
                <img src="./Character/chrLD.png" alt="캐릭터LD" onerror="this.src='chrLD.png'" draggable="false">
              </div>
            </div>
          </div>
          <div class="timer-card">
            <div class="timer-display-wrap">
              <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8">
            </div>
            <div class="row">
              <button class="preset-btn" data-time="3600">+ 1h</button>
              <button class="preset-btn" data-time="1800">+ 30m</button>
              <button class="preset-btn" data-time="5">+ 5s</button>
            </div>
            <div class="row">
              <button id="reset-timer-btn">초기화</button>
              <button id="start-timer-btn">시작</button>
            </div>
          </div>
        </div>
      </div>
    </div> <!-- left-panel end -->

    <!-- ==========================================================================
         [우측 영역] 일일 퀘스트(할 일) & 문제 저장소(인벤토리)
         ========================================================================== -->
    <div id="right-panel-wrapper" class="panel">
      <button id="mobile-toggle-btn">☰</button>

      <!-- 일일퀘스트 탭 뷰 -->
      <div id="panel-quest" class="panel-view">
        <div style="position: relative;">
          <button id="btn-toggle-log" class="mini-btn" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: #555; z-index: 10;">로그</button>
          <h1 class="panel-title" id="quest-panel-title">일일퀘스트</h1>
        </div>
        
        <div id="quest-list-container" class="list"></div>
      </div>

      <!-- 퀴즈 퀘스트(기존 문제저장소) 탭 뷰 -->
      <div id="panel-storage" class="panel-view hidden">
        <h1 class="panel-title">퀴즈퀘스트</h1>
        <div id="storage-list-container" class="list"></div>
      </div>

      <div id="open-timer-btn">
        <img src="타이머.png" alt="timer-icon" style="width: 50px;">
      </div>

      <div id="bottom-tab-bar">
        <div id="tab-quest" class="tab active">
          <div class="tab-ui-highlight"></div>
          일일퀘스트
        </div>
        <div id="tab-storage" class="tab">
          <div class="tab-ui-highlight"></div>
          퀴즈퀘스트
        </div>
      </div>
    </div> <!-- right-panel end -->

    <!-- 
      ========================================================================== 
      [3] 메인 모달 & 다이얼로그 오버레이 배경 
      ========================================================================== 
    -->
    <div id="modal-overlay" class="hidden">
      <!-- 캐릭터 메모 모달 -->
      <div id="char-memo-modal" class="modal-content hidden">
        <button class="close-modal-btn">X</button>
        <h2 id="char-memo-title" style="text-align:center; margin-top:0;">학습 메모</h2>
        <div id="char-memo-list" style="flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding: 2px;"></div>
        <button id="btn-open-notepad" class="submit-btn" style="width:100%; margin-top:auto;">+ 새 메모 작성</button>
      </div>

      <!-- 새 메모 작성 모달 -->
      <div id="notepad-modal" class="modal-content hidden">
        <button class="close-modal-btn">X</button>
        <h2 style="text-align:center; margin-top:0;">학습 메모장</h2>
        <div style="font-size:12px; color:#4b5563; margin-bottom:8px; text-align:center;" id="notepad-target-char-label"></div>
        <textarea id="input-notepad-content" class="area" placeholder="공부한 내용을 이곳에 메모하세요!"></textarea>
        <button id="btn-submit-notepad" class="submit-btn" style="background:#59A3F8; margin-top:auto;">저장</button>
      </div>

      <!-- 퀴즈 풀이 모달 -->
      <div id="solve-modal" class="modal-content hidden">
  <button class="close-modal-btn" onclick="closeModal('solve-modal')">X</button>
  
  <!-- 문제 제목 -->
  <div id="solve-quiz-title" class="fake-field" style="text-align: center; font-size: 16px;">문제 제목</div>
  
  <!-- 문제 내용 (질문 텍스트가 길어질 수 있으므로 area 클래스 권장) -->
  <div id="solve-quiz-content" class="area" style="font-weight: 800; min-height: 80px; display: flex; align-items: center; justify-content: center; text-align: center;">
    문제 내용
  </div>
  
  <!-- 정답 입력/선택 영역 -->
  <div id="solve-input-state" style="display:flex; flex-direction:column; gap:12px;">
    
    <!-- 동적으로 객관식(radio) 또는 주관식(input)이 렌더링될 영역 -->
    <div id="solve-dynamic-inputs" style="display:flex; flex-direction:column; gap:8px;"></div>
    
    <button id="btn-grade-problem" class="submit-btn">채점</button>
  </div>
  
  <!-- 결과창 -->
  <div id="solve-result-state" class="hidden" style="margin-top: 8px; padding: 12px; border-radius: 8px; font-weight: 800; text-align: center;"></div>
</div>


      <!-- 슬롯 관리 모달 -->
      <div id="slot-modal" class="modal-content hidden">
        <button class="close-modal-btn">X</button>
        <h2 id="union-level-display">전체 유니온 Lv.0</h2>
        <div id="slot-manager-container"></div>
        <div class="row" style="margin-top:auto; width:100%;">
          <button id="btn-reset-all-data" class="danger-btn">전체 데이터 삭제</button>
          <button id="btn-add-new-character">새 캐릭터 추가</button>
        </div>
      </div>
    </div> <!-- modal-overlay end -->

    <!-- 공용 다이얼로그 오버레이 -->
    <div id="dialog-overlay" class="hidden">
      <!-- 알림 Alert -->
      <div id="custom-alert" class="modal-content modal-mini hidden">
        <h3 style="text-align:center; margin-top:0;">알림</h3>
        <p id="custom-alert-msg" style="text-align:center; margin-bottom: 20px; font-size: 14px; white-space: pre-line; word-break: keep-all;"></p>
        <button id="custom-alert-btn" class="submit-btn" style="width: 100%; margin-top:auto;">확인</button>
      </div>

      <!-- 확인 Confirm -->
      <div id="custom-confirm" class="modal-content modal-mini hidden">
        <h3 style="text-align:center; margin-top:0;">확인</h3>
        <p id="custom-confirm-msg" style="text-align:center; margin-bottom: 20px; font-size: 14px; white-space: pre-line; word-break: keep-all;"></p>
        <div style="display:flex; gap:10px; margin-top:auto;">
          <button id="custom-confirm-cancel" class="danger-btn" style="flex:1;">취소</button>
          <button id="custom-confirm-ok" class="submit-btn" style="flex:1;">확인</button>
        </div>
      </div>

      <!-- 입력 Prompt -->
      <div id="custom-prompt" class="modal-content modal-mini hidden">
        <h3 id="custom-prompt-title" style="text-align:center; margin-top:0;">입력</h3>
        <input type="text" id="custom-prompt-input" class="field" style="margin-bottom: 20px;">
        <div style="display:flex; gap:10px; margin-top:auto;">
          <button id="custom-prompt-cancel" class="danger-btn" style="flex:1;">취소</button>
          <button id="custom-prompt-ok" class="submit-btn" style="flex:1;">확인</button>
        </div>
      </div>

      <!-- 선택 Select -->
      <div id="custom-select" class="modal-content modal-mini hidden">
        <h3 id="custom-select-title" style="text-align:center; margin-top:0;">선택</h3>
        <p id="custom-select-msg" style="text-align:center; margin-bottom: 12px; font-size: 14px; white-space: pre-line;"></p>
        <select id="custom-select-input" class="field" style="margin-bottom: 20px;"></select>
        <button id="custom-select-ok" class="submit-btn" style="width: 100%; margin-top:auto;">확인</button>
      </div>
    </div> <!-- dialog-overlay end -->

  </div> <!-- app container end -->

  <!-- 
    ========================================================================== 
    [시스템 스크립트 파트 1] 데이터 상태 관리 (캐릭터 유니온 및 경험치)
    ========================================================================== 
  -->
  <script>
    (function () {
      'use strict';

      const MAX_LEVEL = 50;
      const STORAGE_KEY = 'questify_player_v3';

      let state = {
        characters: [{ name: '기본 목표', level: 1, xp: 0, x: 50, y: 80, showExclamation: false }]
      };

      function initCharParts(char) {
        if (char.headType === undefined) char.headType = Math.floor(Math.random() * 5) + 1; 
        if (char.bottomType === undefined) char.bottomType = Math.floor(Math.random() * 2) + 1; 
        if (char.headColor === undefined) char.headColor = Math.floor(Math.random() * 360); 
        if (char.bottomColor === undefined) char.bottomColor = Math.floor(Math.random() * 360); 
      }

      const DOM = {};

      function getXpRequired(level) { return level >= MAX_LEVEL ? Infinity : 100; }
      function getUnionLevel() { return state.characters.reduce((sum, char) => sum + char.level, 0); }

      function createFloatLayer() {
        const gameScreen = document.getElementById('game-screen');
        DOM.floatLayer = document.createElement('div');
        DOM.floatLayer.style.cssText = 'position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden;';
        gameScreen.appendChild(DOM.floatLayer);
      }

      function updateUI() {
        const unionElHUD = document.getElementById('union-level-hud');
        if (unionElHUD) unionElHUD.textContent = '유니온 Lv.' + getUnionLevel();
        if (typeof renderLobbyCharacters === 'function') renderLobbyCharacters();
      }

      function gainXP(amount, charIdx = 0) {
        if (charIdx >= state.characters.length) charIdx = 0;
        const char = state.characters[charIdx];

        if (char.level >= MAX_LEVEL) { showFloat('만렙 달성!', false, charIdx); return; }

        showFloat('+' + amount + ' XP', false, charIdx);
        char.xp += amount;

        while (char.level < MAX_LEVEL && char.xp >= getXpRequired(char.level)) {
          char.xp -= getXpRequired(char.level);
          char.level++;
          showFloat('Lv.' + char.level + ' 달성!', true, charIdx);
        }

        if (char.level >= MAX_LEVEL) char.xp = 0;
        updateUI();
        save();
      }

      function showFloat(text, isLevelUp, charIdx = 0) {
        if (!DOM.floatLayer) return;
        const charEl = document.querySelector(`.lobby-char[data-idx="${charIdx}"]`);
        let left = '50%', top = '50%';
        if (charEl) {
          left = charEl.style.left;
          top = charEl.style.top;
        }

        const el = document.createElement('div');
        el.textContent = text;
        el.style.cssText = `position:absolute; left:${left}; top:${top}; transform:translate(-50%,-100%); font-size:${isLevelUp ? '24px' : '16px'}; font-weight:900; color:${isLevelUp ? '#2563eb' : '#111'}; text-shadow:1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff; white-space:nowrap; animation:xpFloatUp 1.4s ease-out forwards;`;
        DOM.floatLayer.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }

      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          let needsSave = false; // [수정됨] 캐릭터 정보 누락 시 새로 저장하도록 플래그 추가
          if (raw) {
            const loadedState = JSON.parse(raw);
            if (loadedState.characters && loadedState.characters.length > 0) {
              state.characters = loadedState.characters;
              state.characters.forEach(c => {
                if (typeof c.x !== 'number' || isNaN(c.x)) { c.x = 50; needsSave = true; }
                if (typeof c.y !== 'number' || isNaN(c.y)) { c.y = 80; needsSave = true; }
                if (c.headType === undefined) needsSave = true; 
                initCharParts(c); 
              });
            } else { needsSave = true; }
          } else {
             state.characters.forEach(c => initCharParts(c)); 
             needsSave = true;
          }
          if (needsSave) save(); // 처음 접속할 때 생성된 색상과 외형을 즉시 저장하여 고정시킵니다.
        } catch (e) { console.warn('Init error', e); }
      }

      window.Questify = {
        gainXP, getUnionLevel, getXpRequired, getCharacters: () => state.characters, saveState: save,
        updateUI: updateUI, initCharParts: initCharParts,
        reset() {
          localStorage.removeItem(STORAGE_KEY);
          state = { characters: [{ name: '기본 목표', level: 1, xp: 0, x: 50, y: 80, showExclamation: false }] };
          state.characters.forEach(c => initCharParts(c));
          save(); // 초기화 시에도 저장
          updateUI();
        }
      };

      createFloatLayer();
      load();
      setTimeout(updateUI, 50);
    })();
  </script>

  <!-- 
    ========================================================================== 
    [시스템 스크립트 파트 2] 앱 메인 인터페이스 및 DOM 조작 로직
    ========================================================================== 
  -->
  <script>
    /* --------------------------------------------------------------------------
       [2-1] 커스텀 다이얼로그 (브라우저 Alert/Confirm/Prompt 등 우회 기능)
       -------------------------------------------------------------------------- */
    let customAlertCb, customConfirmCb, customPromptCb, customSelectCb;
    const dialogOverlay = document.getElementById('dialog-overlay');

    function closeAllDialogs() { document.querySelectorAll('#dialog-overlay .modal-content').forEach(m => m.classList.add('hidden')); }
    function openSpecificDialog(dialogId) { dialogOverlay.classList.remove('hidden'); closeAllDialogs(); document.getElementById(dialogId).classList.remove('hidden'); }

    window.showCustomAlert = function (msg, callback) { document.getElementById('custom-alert-msg').innerText = msg; customAlertCb = callback; openSpecificDialog('custom-alert'); }
    document.getElementById('custom-alert-btn').onclick = () => { dialogOverlay.classList.add('hidden'); if (customAlertCb) customAlertCb(); }

    window.showCustomConfirm = function (msg, onConfirm) { document.getElementById('custom-confirm-msg').innerText = msg; customConfirmCb = onConfirm; openSpecificDialog('custom-confirm'); }
    document.getElementById('custom-confirm-cancel').onclick = () => dialogOverlay.classList.add('hidden');
    document.getElementById('custom-confirm-ok').onclick = () => { dialogOverlay.classList.add('hidden'); if (customConfirmCb) customConfirmCb(); }

    window.showCustomPrompt = function (title, defaultVal, onConfirm) {
      document.getElementById('custom-prompt-title').innerText = title;
      const input = document.getElementById('custom-prompt-input'); 
      input.value = defaultVal || ''; 
      customPromptCb = onConfirm;
      openSpecificDialog('custom-prompt'); 
      
      // 포커스를 주고 커서를 맨 마지막으로 이동
      setTimeout(() => { 
        input.focus(); 
        const val = input.value;
        input.value = '';
        input.value = val;
        input.setSelectionRange(val.length, val.length);
      }, 50);
    }
    
    document.getElementById('custom-prompt-cancel').onclick = () => dialogOverlay.classList.add('hidden');
    document.getElementById('custom-prompt-ok').onclick = () => {
      const val = document.getElementById('custom-prompt-input').value; dialogOverlay.classList.add('hidden'); if (customPromptCb) customPromptCb(val);
    }

    window.showCustomSelect = function (title, msg, options, onConfirm) {
      document.getElementById('custom-select-title').innerText = title; document.getElementById('custom-select-msg').innerText = msg;
      const select = document.getElementById('custom-select-input'); select.innerHTML = '';
      options.forEach(opt => { const el = document.createElement('option'); el.value = opt.value; el.innerText = opt.text; select.appendChild(el); });
      customSelectCb = onConfirm; openSpecificDialog('custom-select');
    }
    document.getElementById('custom-select-ok').onclick = () => {
      const val = document.getElementById('custom-select-input').value; dialogOverlay.classList.add('hidden'); if (customSelectCb) customSelectCb(val);
    }

    dialogOverlay.addEventListener('click', (e) => { if (e.target === dialogOverlay) dialogOverlay.classList.add('hidden'); });

    /* --------------------------------------------------------------------------
       [2-2] 메인 모달 (학습, 퀴즈, 슬롯 관리) 오버레이 제어
       -------------------------------------------------------------------------- */
    const modalOverlay = document.getElementById('modal-overlay');

    function closeAllCustomModals() { document.querySelectorAll('#modal-overlay .modal-content').forEach(m => m.classList.add('hidden')); }
    function openSpecificModal(modalId) { modalOverlay.classList.remove('hidden'); closeAllCustomModals(); document.getElementById(modalId).classList.remove('hidden'); }

    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => { modalOverlay.classList.add('hidden'); currentActiveQuiz = null; editingMemoId = null; });
    });
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) { modalOverlay.classList.add('hidden'); currentActiveQuiz = null; editingMemoId = null; }
    });

    /* --------------------------------------------------------------------------
       [2-3] 핵심 앱 콘텐츠 데이터 (할 일/메모/문제 저장소) 선언 및 로드
       -------------------------------------------------------------------------- */
    const APP_DATA_KEY = 'questify_app_data_v5';

    let todoList = [];       
    let memoStorage = [];    
    let quizStorage = [];    

    let currentActiveQuiz = null;   
    let targetCharIdxForMemo = 0;   
    let editingMemoId = null;       
    let isDraggingTodoItem = false;
    let isLogView = false;

    function escapeHTML(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }

    function loadAppData() {
      try {
        const data = localStorage.getItem(APP_DATA_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          todoList = parsed.todoList || [];
          quizStorage = parsed.quizStorage || [];
          memoStorage = parsed.memoStorage || [];
        }
      } catch (e) { }
    }

    function saveAppData() { localStorage.setItem(APP_DATA_KEY, JSON.stringify({ todoList, quizStorage, memoStorage })); }

    function renderAll() {
      renderTodoList();
      renderStorageList();
      updateProgressBar();
      saveAppData();
      syncExclamations(); 
      if (window.Questify) window.Questify.updateUI(); 
    }

    /* --------------------------------------------------------------------------
       [2-4] 일일 퀘스트 & 폴더(하위 퀘스트) & 로그(기록) 렌더링
       -------------------------------------------------------------------------- */
    document.getElementById('btn-toggle-log').addEventListener('click', () => {
      isLogView = !isLogView;
      document.getElementById('quest-panel-title').innerText = isLogView ? '완료 기록' : '일일퀘스트';
      const btn = document.getElementById('btn-toggle-log');
      btn.innerText = isLogView ? '목록' : '로그';
      btn.style.background = isLogView ? '#2563eb' : '#555';
      renderTodoList();
    });

    function renderTodoList() {
      const container = document.getElementById('quest-list-container');
      container.innerHTML = '';

      const todos = todoList.filter(item => item.type === 'todo');
      let displayTodos = [];

      if (isLogView) {
        displayTodos = todos.filter(item => item.status === 'clear');
      } else {
        displayTodos = todos.filter(item => item.status !== 'clear');
        
        const addBtn = document.createElement('button');
        addBtn.className = 'add-card';
        addBtn.innerHTML = '<span>+</span>';
        addBtn.style.position = 'sticky';
        addBtn.style.top = '0';
        addBtn.style.zIndex = '10';
        addBtn.style.marginBottom = '8px';
        addBtn.style.backdropFilter = 'blur(8px)'; 
        addBtn.style.WebkitBackdropFilter = 'blur(8px)';
        addBtn.onclick = () => {
          const newId = Date.now();
          todoList.push({ id: newId, type: 'todo', title: '', status: 'ready', isEditing: true });
          renderAll();
        };
        container.appendChild(addBtn);
      }

      displayTodos.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'todo-item-wrapper draggable-todo-item';
        wrapper.dataset.id = item.id;
        wrapper.style.display = 'flex';
        wrapper.style.flexDirection = 'column';
        wrapper.style.gap = '4px';
        wrapper.style.marginBottom = '4px';

        const isEditing = item.isEditing ? true : false;
        
        if (!isLogView && !isEditing && item.status !== 'clear') {
          wrapper.setAttribute('draggable', 'true');
          wrapper.addEventListener('dragstart', handleDragStart);
          wrapper.addEventListener('dragover', handleDragOver);
          wrapper.addEventListener('drop', handleDrop);
          wrapper.addEventListener('dragend', handleDragEnd);
        }

        const card = document.createElement('div');
        card.className = 'todo-card' + (item.status === 'clear' ? ' clear' : '');
        card.dataset.id = item.id;
        card.dataset.status = item.status;

        if (!isLogView) {
          card.onclick = (e) => onCardClick(e, item.id);

    window.onCardClick = function(e, id) {
      if (isDraggingTodoItem) return;
      const item = todoList.find(t => t.id === id);
      if (!item) return;
      
      if (item.isEditing) return; 

      if (item.subtasks && item.subtasks.length > 0) {
        item.isExpanded = !item.isExpanded;
        renderAll();
      }
    };

    // [수정됨] 더블 클릭 시 브라우저 기본 텍스트 선택을 방지하고 편집 모드로 전환
    window.onCardDblClick = function(e, id) {
      e.preventDefault(); 
      if (window.getSelection) window.getSelection().removeAllRanges();

      if (isDraggingTodoItem) return;
      const item = todoList.find(t => t.id === id);
      if (!item || item.status === 'clear') return;
      
      if (!item.isEditing) window.makeTodoEditable(id);
    };

    window.onLogCardClick = function(e, id) {
       const item = todoList.find(t => t.id === id);
       if (!item) return;
       if (item.subtasks && item.subtasks.length > 0) {
          item.isExpanded = !item.isExpanded;
          renderAll();
       }
    };

    window.handleAddSubtask = function(e, parentId) {
      e.stopPropagation(); 
      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      
      if (!item.subtasks) item.subtasks = [];
      
      const newSubId = Date.now();
      item.subtasks.push({ id: newSubId, title: '', status: 'ready', isEditing: true });
      item.isExpanded = true;
      
      renderAll();
    };

    // [수정됨] 하위 퀘스트 더블 클릭 시 동일하게 텍스트 선택 방지
    window.onSubCardDblClick = function(e, parentId, subId) {
      e.preventDefault();
      if (window.getSelection) window.getSelection().removeAllRanges();

      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      const sub = item.subtasks.find(s => s.id === subId);
      if (!sub || sub.status === 'clear') return;
      if (!sub.isEditing) {
        sub.isEditing = true;
        renderAll();
      }
    };

    window.saveSubtaskTitle = function(parentId, subId, newTitle) {
      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      const subIdx = item.subtasks.findIndex(s => s.id === subId);
      if (subIdx === -1) return;
      
      if (newTitle.trim() === '') {
        item.subtasks.splice(subIdx, 1);
      } else {
        item.subtasks[subIdx].title = newTitle.trim();
        delete item.subtasks[subIdx].isEditing;
      }
      renderAll();
    };

    window.handleSubtaskAction = function(parentId, subId, action) {
      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      const subIdx = item.subtasks.findIndex(s => s.id === subId);
      if (subIdx === -1) return;
      
      if (action === 'clear') {
        item.subtasks[subIdx].status = 'clear';
        const chars = window.Questify.getCharacters();
        chars.forEach((c, i) => { window.Questify.gainXP(5, i); });
        
        const allClear = item.subtasks.every(s => s.status === 'clear');
        if (allClear) {
          item.status = 'clear';
          chars.forEach((c, i) => { window.Questify.gainXP(20, i); }); 
        }
      } else if (action === 'delete') {
        item.subtasks.splice(subIdx, 1);
      }
      renderAll();
    };

    window.saveTodoTitle = function (id, newTitle) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;
      if (newTitle.trim() === '') todoList.splice(idx, 1);
      else {
        todoList[idx].title = newTitle.trim();
        delete todoList[idx].isEditing;
      }
      renderAll();
    };

    window.makeTodoEditable = function (id) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx !== -1 && todoList[idx].status !== 'clear') {
        todoList[idx].isEditing = true;
        renderAll();
      }
    };

    function updateProgressBar() {
      const todos = todoList.filter(item => item.type === 'todo');
      const total = todos.length;
      const clears = todos.filter(item => item.status === 'clear').length;
      const percent = total > 0 ? (clears / total) * 100 : 0;
      document.getElementById('progress-bar-fill').style.width = percent + '%';
      document.getElementById('progress-text').innerText = clears + '/' + total;
    }

    window.handleTodoAction = function (id, action) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;

      if (action === 'clear') {
        todoList[idx].status = 'clear';
        if (todoList[idx].subtasks) {
           todoList[idx].subtasks.forEach(sub => sub.status = 'clear');
        }
        const chars = window.Questify.getCharacters();
        chars.forEach((c, i) => {
          window.Questify.gainXP(20, i);
        });
      }

      if (action === 'delete') {
        todoList.splice(idx, 1);
      }
      renderAll();
    };

function cleanAndParseJSON(rawText) {
    let cleanText = rawText.trim();
    if (cleanText.startsWith("```")) {
        cleanText = cleanText.replace(/^```[a-zA-Z]*\n/, "");
        cleanText = cleanText.replace(/\n```$/, "");
    }
    return JSON.parse(cleanText.trim());
}

// 2. 모크 데이터 생성기
function generateMockQuiz(type, count) {
    const numCount = parseInt(count);
    let pool = [];
    if (type === 'multiple') {
        pool = [{ question: "유희왕 OCG에서 프레임 색상이 '의식 청색'인 몬스터 부류는?", choices: ["일반", "의식 몬스터", "융합", "엑시즈"], answer: "의식 몬스터" }];
    } else if (type === 'tf') {
        pool = [{ question: "융합 몬스터 카드는 보라색 테두리를 가진다.", choices: ["O", "X"], answer: "O" }];
    } else {
        pool = [{ question: "튜너 몬스터와 레벨을 맞춰 소환하는 하얀색 몬스터는?", choices: [], answer: "싱크로" }];
    }
    
    return pool.slice(0, numCount).map((item, idx) => ({
        id: idx + 1,
        question: item.question,
        choices: item.choices,
        answer: item.answer
    }));
}

// 3. AI 기반 퀴즈 생성 핵심 로직
async function fetchQuizFromGemini(text, type = 'multiple', count = 1, diff = '중 (보통)') {
    const apiKey = localStorage.getItem('gemini_api_key') || '';
    
    if (!apiKey) {
        return new Promise(resolve => {
            setTimeout(() => { resolve(generateMockQuiz(type, count)); }, 1200);
        });
    }

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    const systemInstruction = `너는 입력받은 학습 노트를 바탕으로 학습 퀴즈를 생성하는 AI다.
[지시사항]
1. 문제 유형: ${type === 'multiple' ? '객관식 4지선다형' : type === 'tf' ? '진위형 (O/X)' : '주관식 단답형'}
2. 난이도: ${diff}, 생성 문항 수: ${count}
3. 순수 JSON 배열만 반환하라. 예: [{"id": 1, "question": "내용", "choices": ["A","B"], "answer": "정답(무조건 보기 중 하나 또는 주관식 정답)"}]`;

    try {
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `다음 노트를 기반으로 문제를 만들어줘:\n\n${text}` }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: { responseMimeType: "application/json" }
            })
        });

        if (!response.ok) throw new Error('API 통신 에러');
        const resData = await response.json();
        const rawText = resData.candidates[0].content.parts[0].text;
        return cleanAndParseJSON(rawText);
    } catch (error) {
        console.error("Gemini 연동 실패, 모크 데이터로 대체:", error);
        return generateMockQuiz(type, count);
    }
}

let isGeneratingQuiz = false;

setInterval(async () => {
    if (typeof memoStorage === 'undefined' || memoStorage.length === 0 || isGeneratingQuiz) return;
    
    if (Math.random() < 0.5) {
        const randomMemo = memoStorage[Math.floor(Math.random() * memoStorage.length)];
        const chars = window.Questify.getCharacters();
        const targetChar = chars[randomMemo.charIdx];
        
        const alreadyHasQuiz = typeof quizStorage !== 'undefined' && quizStorage.some(q => q.charIdx === randomMemo.charIdx);

        if (targetChar && !targetChar.showExclamation && !alreadyHasQuiz) {
            isGeneratingQuiz = true;
            
            try {
                const types = ['multiple', 'tf', 'subjective'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                
                const generated = await fetchQuizFromGemini(randomMemo.content, randomType, 1, '중 (보통)');
                
                if (generated && generated.length > 0) {
                    const aiQuiz = generated[0];
                    let titleText = randomType === 'multiple' ? "객관식 문제" : randomType === 'tf' ? "O/X 퀴즈" : "주관식 문제";

                    quizStorage.push({ 
                        id: Date.now(), 
                        title: `[AI 퀴즈] ${titleText}`, 
                        content: aiQuiz.question,
                        originalQuestion: aiQuiz.question,
                        choices: aiQuiz.choices || [],
                        answer: aiQuiz.answer,
                        explanation: aiQuiz.explanation || "",
                        charIdx: randomMemo.charIdx
                    });

                    targetChar.showExclamation = true; 
                    if (typeof saveAppData === 'function') saveAppData(); 
                    if (window.Questify && typeof window.Questify.saveState === 'function') window.Questify.saveState(); 
                    if (window.Questify && typeof window.Questify.updateUI === 'function') window.Questify.updateUI(); 
                    if (typeof renderStorageList === 'function') renderStorageList();
                }
            } catch (error) {
                console.error("AI 퀴즈 자동 생성 중 오류 발생:", error);
            } finally {
                isGeneratingQuiz = false;
            }
        }
    }
}, 15000);




    window.deleteQuizFromStorage = function (quizId) { showCustomConfirm('이 문제(AI 생성)를 삭제하시겠습니까?', () => { quizStorage = quizStorage.filter(q => q.id !== quizId); syncExclamations(); renderAll(); }); };
    window.openSolveModalFromStorage = function (quizId) { const quiz = quizStorage.find(q => q.id === quizId); if (quiz) setupSolveModal(quiz, false); };
    window.handleExclamationClick = function (e, charIdx) {
      e.stopPropagation(); const charQuizzes = quizStorage.filter(q => q.charIdx === charIdx);
      if (charQuizzes.length === 0) { syncExclamations(); return; }
      const randomQuiz = charQuizzes[Math.floor(Math.random() * charQuizzes.length)]; setupSolveModal(randomQuiz, true); currentActiveQuiz.isLobbySurprise = true;
    };

    // --- 퀴즈 모달 렌더링 (대소문자 escapeHTML 수정 완료) ---
function setupSolveModal(quiz, isSurprise) {
    currentActiveQuiz = { ...quiz, isSurprise }; 
    
    document.getElementById('solve-quiz-title').innerText = quiz.title;
    document.getElementById('solve-quiz-content').innerText = quiz.originalQuestion || quiz.content;

    const dynamicInputs = document.getElementById('solve-dynamic-inputs');
    dynamicInputs.innerHTML = ''; 

    if (quiz.choices && Array.isArray(quiz.choices) && quiz.choices.length > 0) {
        quiz.choices.forEach(choice => {
            // escapeHTML 로 통일
            dynamicInputs.innerHTML += `
                <label style="display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; background:#F0E3D3; padding:10px 16px; border-radius:12px; border:3px solid #9A8978; box-shadow: inset 0px -3px 2px 2px rgba(255, 255, 255, 0.4);">
                    <input type="radio" name="modal_quiz_answer" value="${escapeHTML(choice)}" style="accent-color: #E45154;">
                    <span>${escapeHTML(choice)}</span>
                </label>
            `;
        });
    } else {
        dynamicInputs.innerHTML = `
            <input id="input-solve-answer" class="field" type="text" placeholder="정답을 적어주세요.">
        `;
    }

    document.getElementById('solve-input-state').classList.remove('hidden'); 
    const resultBox = document.getElementById('solve-result-state');
    resultBox.className = 'hidden';
    resultBox.innerHTML = '';
    
    openSpecificModal('solve-modal');
    
    setTimeout(() => {
        const textInput = document.getElementById('input-solve-answer');
        if (textInput) textInput.focus();
    }, 50);
}

// --- 채점 버튼 클릭 이벤트 (대소문자 escapeHTML 수정 완료) ---
document.getElementById('btn-grade-problem').addEventListener('click', () => {
    if (!currentActiveQuiz) return;
    
    let userAnswer = "";
    
    if (currentActiveQuiz.choices && Array.isArray(currentActiveQuiz.choices) && currentActiveQuiz.choices.length > 0) {
        const checked = document.querySelector('input[name="modal_quiz_answer"]:checked');
        if (checked) {
            userAnswer = checked.value;
        } else {
            showCustomAlert ? showCustomAlert("정답을 선택해주세요.") : alert("정답을 선택해주세요.");
            return;
        }
    } else {
        const textInput = document.getElementById('input-solve-answer');
        if (textInput) userAnswer = textInput.value;
    }

    const correctAnswer = (currentActiveQuiz.answer || "").trim().toUpperCase();
    const isCorrect = userAnswer.trim().toUpperCase() === correctAnswer;

    document.getElementById('solve-input-state').classList.add('hidden'); 
    const resultBox = document.getElementById('solve-result-state'); 
    resultBox.classList.remove('hidden');

    if (isCorrect) {
        resultBox.style.border = '2.5px solid #22c55e';
        resultBox.style.background = '#dcfce7';
        resultBox.style.color = '#15803d';
        // escapeHTML 적용
        resultBox.innerHTML = `✅ 정답입니다! (제출: ${escapeHTML(userAnswer)})<br>경험치를 획득했습니다!`;
        
        if (window.Questify) {
            window.Questify.gainXP(currentActiveQuiz.isSurprise ? 30 : 20, currentActiveQuiz.charIdx);
        }
    } else {
        resultBox.style.border = '2.5px solid #ef4444';
        resultBox.style.background = '#fee2e2';
        resultBox.style.color = '#b91c1c';
        // escapeHTML 적용
        resultBox.innerHTML = `❌ 오답입니다. (제출: ${escapeHTML(userAnswer || '미입력')})<br>정답: ${escapeHTML(currentActiveQuiz.answer)}`;
    }

    quizStorage = quizStorage.filter(q => q.id !== currentActiveQuiz.id); 
    
    if (typeof syncExclamations === 'function') syncExclamations(); 
    if (typeof renderAll === 'function') renderAll();
});


    /* --------------------------------------------------------------------------
       [2-7] 로비 캐릭터의 렌더링 및 드래그 제어 로직 
       -------------------------------------------------------------------------- */
    const lobbyContainer = document.getElementById('lobby-container'); const gameScreenBox = document.getElementById('game-screen');
    let isCharDragging = false, dragTargetChar = null, charStartX = 0, charStartY = 0, charInitialLeft = 0, charInitialTop = 0, dragMoved = false;

    function getPartFilter(hueRotateDeg) { return `hue-rotate(${hueRotateDeg}deg)`; }

    function renderLobbyCharacters() {
      lobbyContainer.innerHTML = ''; const chars = window.Questify.getCharacters(); if (!chars || chars.length === 0) return;
      chars.forEach((char, idx) => {
        const charWrapper = document.createElement('div'); charWrapper.className = 'lobby-char'; charWrapper.dataset.idx = idx; charWrapper.style.left = char.x + '%'; charWrapper.style.top = char.y + '%';
        let exclamationHTML = ''; if (char.showExclamation) exclamationHTML = `<div class="char-exclamation" onclick="handleExclamationClick(event, ${idx})">!</div>`;
        const requiredXP = window.Questify.getXpRequired(char.level); const xpPercent = requiredXP === Infinity ? 100 : Math.min(100, (char.xp / requiredXP) * 100);
        charWrapper.innerHTML = `
          ${exclamationHTML} <div class="char-bubble hidden"></div>
          <div class="char-nameplate"><div class="char-name-text">${escapeHTML(char.name)}</div><div class="char-level-text">Lv.${char.level}</div></div>
          <div class="char-body">
             <img class="char-part-base" src="./Character/chrSD.png" alt="몸" draggable="false">
             <img class="char-part-bottom" src="./Character/chrbottom${char.bottomType}.png" alt="하의" style="filter: ${getPartFilter(char.bottomColor)};" draggable="false">
             <img class="char-part-head" src="./Character/chrhair${char.headType}.png" alt="머리" style="filter: ${getPartFilter(char.headColor)};" draggable="false">
          </div>
          <div class="char-xp-bar-container"><div class="char-xp-bar-fill" style="width: ${xpPercent}%;"></div></div>`;
        charWrapper.addEventListener('mousedown', startCharDrag); charWrapper.addEventListener('touchstart', startCharDrag, { passive: false }); lobbyContainer.appendChild(charWrapper);
      });
    }

    function startCharDrag(e) {
      if (gameScreenBox.classList.contains('hidden') || e.target.classList.contains('char-exclamation')) return; 
      isCharDragging = true; dragMoved = false; dragTargetChar = e.currentTarget;
      const point = e.type.includes('mouse') ? e : e.touches[0]; charStartX = point.clientX; charStartY = point.clientY;
      charInitialLeft = dragTargetChar.offsetLeft; charInitialTop = dragTargetChar.offsetTop;
    }

    function dragChar(e) {
      if (!isCharDragging || !dragTargetChar) return; const point = e.type.includes('mouse') ? e : e.touches[0];
      if (Math.abs(point.clientX - charStartX) > 5 || Math.abs(point.clientY - charStartY) > 5) dragMoved = true;
      if (dragMoved) {
        e.preventDefault(); let newLeft = charInitialLeft + (point.clientX - charStartX); let newTop = charInitialTop + (point.clientY - charStartY);
        const parentRect = gameScreenBox.getBoundingClientRect(); const rect = dragTargetChar.getBoundingClientRect();
        let halfW = rect.width / 2; let halfH = rect.height / 2;
        if (newLeft - halfW < 0) newLeft = halfW; if (newTop - halfH < 0) newTop = halfH;
        if (newLeft + halfW > parentRect.width) newLeft = parentRect.width - halfW; if (newTop + halfH > parentRect.height) newTop = parentRect.height - halfH;
        dragTargetChar.style.left = newLeft + 'px'; dragTargetChar.style.top = newTop + 'px';
      }
    }

    function endCharDrag(e) {
      if (!isCharDragging || !dragTargetChar) return; isCharDragging = false; 
      if (!dragMoved) {
        const clickedIdx = parseInt(dragTargetChar.dataset.idx); targetCharIdxForMemo = clickedIdx; renderCharMemos(clickedIdx); openSpecificModal('char-memo-modal'); dragTargetChar = null; return;
      }
      const parentRect = gameScreenBox.getBoundingClientRect(); if (parentRect.width === 0 || parentRect.height === 0) { dragTargetChar = null; return; }
      let currentLeft = parseFloat(dragTargetChar.style.left); let currentTop = parseFloat(dragTargetChar.style.top);
      const others = Array.from(document.querySelectorAll('.lobby-char')).filter(el => el !== dragTargetChar);
      others.forEach(other => {
        const oLeft = other.offsetLeft; const oTop = other.offsetTop; const dist = Math.hypot(currentLeft - oLeft, currentTop - oTop);
        if (dist < 50) { currentLeft += 50; currentTop += 50; }
      });
      let pctX = (currentLeft / parentRect.width) * 100; let pctY = (currentTop / parentRect.height) * 100;
      if (isNaN(pctX) || pctX < 0) pctX = 50; if (isNaN(pctY) || pctY < 0) pctY = 80;
      dragTargetChar.style.left = pctX + '%'; dragTargetChar.style.top = pctY + '%';
      const idx = parseInt(dragTargetChar.dataset.idx); const chars = window.Questify.getCharacters();
      if (chars[idx]) { chars[idx].x = pctX; chars[idx].y = pctY; window.Questify.saveState(); } dragTargetChar = null;
    }

    document.addEventListener('mousemove', dragChar); document.addEventListener('mouseup', endCharDrag);
    document.addEventListener('touchmove', dragChar, { passive: false }); document.addEventListener('touchend', endCharDrag);
    document.addEventListener('touchcancel', endCharDrag); window.addEventListener('blur', endCharDrag); 

    setInterval(() => {
      const chars = document.querySelectorAll('.lobby-char'); if (chars.length === 0 || gameScreenBox.classList.contains('hidden')) return;
      const randomChar = chars[Math.floor(Math.random() * chars.length)]; const idx = parseInt(randomChar.dataset.idx); const charData = window.Questify.getCharacters()[idx];
      if (charData && charData.showExclamation) return;
      const bubble = randomChar.querySelector('.char-bubble'); if (!bubble) return;
      const lines = ["오늘도 화이팅!", "퀘스트 잊지 않았지?", "메모를 남겨볼까?", "성장하고 있어!"];
      bubble.innerText = lines[Math.floor(Math.random() * lines.length)]; bubble.classList.remove('hidden');
      setTimeout(() => { bubble.classList.add('hidden'); }, 3000);
    }, 6000);

    /* --------------------------------------------------------------------------
       [2-8] 집중 타이머 계산 및 디스플레이 제어
       -------------------------------------------------------------------------- */
    const timerDisplay = document.getElementById('timer-display'); const startTimerBtn = document.getElementById('start-timer-btn'); const resetTimerBtn = document.getElementById('reset-timer-btn'); const presetBtns = document.querySelectorAll('.preset-btn');
    let totalSeconds = 0, timerInterval = null, timerRunning = false, timerPaused = false;
    const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

    function formatTime(seconds) {
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0'); const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0'); const secs = String(seconds % 60).padStart(2, '0'); return `${hrs}:${mins}:${secs}`;
    }
    function totalSecondsFromDigits(digits) { const h = Number(`${digits[0]}${digits[1]}`) || 0; const m = Number(`${digits[2]}${digits[3]}`) || 0; const s = Number(`${digits[4]}${digits[5]}`) || 0; return (h * 3600) + (m * 60) + s; }
    function updateDisplays() { timerDisplay.value = formatTime(totalSeconds); }

    timerDisplay.addEventListener('keydown', e => {
      if (timerRunning) { e.preventDefault(); return; } if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return; e.preventDefault();
      let digits = timerDisplay.value.replace(/:/g, '').split(''); const start = timerDisplay.selectionStart;
      if (/\d/.test(e.key)) {
        let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start); if (digitIndex === -1) digitIndex = 5;
        digits[digitIndex] = e.key; totalSeconds = totalSecondsFromDigits(digits); updateDisplays();
        const nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1; timerDisplay.setSelectionRange(nextPos, nextPos);
      } else if (e.key === 'Backspace') {
        let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1; if (start === timerDisplay.value.length) targetIdx = 5;
        if (targetIdx >= 0) { digits[targetIdx] = '0'; totalSeconds = totalSecondsFromDigits(digits); updateDisplays(); timerDisplay.setSelectionRange(DIGIT_POSITIONS[targetIdx], DIGIT_POSITIONS[targetIdx]); }
      } else if (e.key === 'Delete') {
        const targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start);
        if (targetIdx !== -1) { digits[targetIdx] = '0'; totalSeconds = totalSecondsFromDigits(digits); updateDisplays(); timerDisplay.setSelectionRange(start, start); }
      }
    });

    function startTimer() {
      if (totalSeconds <= 0) return; timerRunning = true; timerPaused = false; startTimerBtn.innerText = '일시정지'; timerDisplay.disabled = true; if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timerPaused) return; if (totalSeconds > 0) { totalSeconds--; updateDisplays(); }
        if (totalSeconds <= 0) {
          totalSeconds = 0; updateDisplays(); stopTimer();
          showCustomAlert('집중 시간이 끝났습니다!\n\n저장할 캐릭터를 선택하여 메모를 남겨주세요.', () => {
            const options = window.Questify.getCharacters().map((c, i) => ({ value: i, text: c.name }));
            showCustomSelect('캐릭터 선택', '어떤 캐릭터에게 메모를 추가하시겠습니까?', options, (selectedIdx) => {
              targetCharIdxForMemo = parseInt(selectedIdx); const charName = window.Questify.getCharacters()[targetCharIdxForMemo].name;
              document.getElementById('notepad-target-char-label').innerText = `[${charName}] 캐릭터에게 메모를 추가합니다.`;
              document.getElementById('input-notepad-content').value = ''; openSpecificModal('notepad-modal');
            });
          });
        }
      }, 1000);
    }
    function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; timerRunning = false; timerPaused = false; startTimerBtn.innerText = '시작'; timerDisplay.disabled = false; }

    startTimerBtn.addEventListener('click', () => { if (timerRunning) { timerPaused = !timerPaused; startTimerBtn.innerText = timerPaused ? '계속' : '일시정지'; } else { startTimer(); } });
    resetTimerBtn.addEventListener('click', () => { stopTimer(); totalSeconds = 0; updateDisplays(); });
    presetBtns.forEach(btn => { btn.addEventListener('click', () => { if (timerRunning && !timerPaused) return; totalSeconds += parseInt(btn.dataset.time, 10); updateDisplays(); }); });

    /* --------------------------------------------------------------------------
       [2-9] UI 부가 기능 (일일 퀘스트 드래그 및 패널 전환 로직)
       -------------------------------------------------------------------------- */
    let dragSrcEl = null;

    function handleDragStart(e) {
      isDraggingTodoItem = true; dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', this.dataset.id);
      setTimeout(() => { this.style.opacity = '0'; }, 0);
    }

    function handleDragOver(e) {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move'; 
      if (dragSrcEl && this !== dragSrcEl && this.classList.contains('draggable-todo-item')) {
        const children = Array.from(this.parentNode.querySelectorAll('.draggable-todo-item'));
        if (children.indexOf(dragSrcEl) < children.indexOf(this)) { this.after(dragSrcEl); } else { this.before(dragSrcEl); }
      } return false;
    }

    function handleDrop(e) { e.stopPropagation(); e.preventDefault(); return false; }

    function handleDragEnd(e) {
      this.style.opacity = '1'; dragSrcEl = null;
      const container = document.getElementById('quest-list-container');
      const wrappers = Array.from(container.querySelectorAll('.draggable-todo-item'));
      
      const domOrderIds = [];
      wrappers.forEach(w => {
        const id = parseInt(w.dataset.id);
        if (!domOrderIds.includes(id)) domOrderIds.push(id);
      });

      todoList.sort((a, b) => {
        const idxA = domOrderIds.indexOf(a.id);
        const idxB = domOrderIds.indexOf(b.id);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1 && idxB === -1) return -1;
        if (idxA === -1 && idxB !== -1) return 1;
        return 0;
      });

      saveAppData(); renderAll(); 
      setTimeout(() => { isDraggingTodoItem = false; }, 100);
    }

    const mobileToggleBtn = document.getElementById('mobile-toggle-btn'); const appContainer = document.querySelector('.app');
    mobileToggleBtn.addEventListener('click', () => { appContainer.classList.toggle('mobile-menu-open'); });

    const gameScreen = document.getElementById('game-screen'); const timerScreen = document.getElementById('timer-screen'); const openTimerBtn = document.getElementById('open-timer-btn'); const closeTimerBtn = document.getElementById('close-timer-btn');
    function toggleTimerScreen() {
      if (timerScreen.classList.contains('hidden')) { gameScreen.classList.add('hidden'); timerScreen.classList.remove('hidden'); openTimerBtn.style.background = '#d1d5db'; }
      else { timerScreen.classList.add('hidden'); gameScreen.classList.remove('hidden'); openTimerBtn.style.background = '#fff'; }
    }
    openTimerBtn.addEventListener('click', toggleTimerScreen); closeTimerBtn.addEventListener('click', toggleTimerScreen);

    const tabQuest = document.getElementById('tab-quest'); const panelQuest = document.getElementById('panel-quest'); const tabStorage = document.getElementById('tab-storage'); const panelStorage = document.getElementById('panel-storage');
    tabStorage.addEventListener('click', () => { panelQuest.classList.add('hidden'); panelStorage.classList.remove('hidden'); tabStorage.classList.add('active'); tabQuest.classList.remove('active'); });
    tabQuest.addEventListener('click', () => { panelStorage.classList.add('hidden'); panelQuest.classList.remove('hidden'); tabQuest.classList.add('active'); tabStorage.classList.remove('active'); });

    /* --------------------------------------------------------------------------
       [2-10] 슬롯(유니온 전체 캐릭터) 관리 창 및 데이터 컨트롤 
       -------------------------------------------------------------------------- */
    document.getElementById('user-profile-card').addEventListener('click', () => { renderSlotInventory(); openSpecificModal('slot-modal'); });

    function renderSlotInventory() {
      const chars = window.Questify.getCharacters(); const container = document.getElementById('slot-manager-container'); const unionLevelDisplay = document.getElementById('union-level-display');
      if (unionLevelDisplay) unionLevelDisplay.innerText = '전체 유니온 Lv.' + window.Questify.getUnionLevel(); container.innerHTML = '';
      chars.forEach((char, index) => {
        const slotCard = document.createElement('div'); slotCard.className = 'slot-card';
        const maxXP = window.Questify.getXpRequired(char.level); const xpText = maxXP === Infinity ? 'MAX' : maxXP; const xpPercent = maxXP === Infinity ? 100 : Math.min(100, (char.xp / maxXP) * 100);
        slotCard.innerHTML = `
          <div class="slot-head"><span style="font-weight:900;">${escapeHTML(char.name)}</span>${char.level >= 50 ? '<span class="badge gold">졸업</span>' : ''}</div>
          <div style="font-size:13px; color:#374151; font-weight:800; margin-top:4px;">레벨: Lv.${char.level}</div>
          <div style="font-size:13px; color:#374151; font-weight:800; margin-top:4px;">경험치: ${char.xp} / ${xpText} XP</div>
          <div style="width: 100%; height: 8px; background: rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; margin-top: 4px; overflow: hidden;"><div style="width: ${xpPercent}%; height: 100%; background: #3b82f6; transition: width 0.3s;"></div></div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <button class="plain-btn" style="flex:1; padding:6px; font-size:12px; border-radius:5px;" onclick="window.renameChar(${index})">이름 변경</button>
            <button class="plain-btn" style="flex:1; padding:6px; font-size:12px; border-radius:5px; background:#ef4444; color:#fff;" onclick="window.deleteChar(${index})">삭제</button>
          </div>
        `; container.appendChild(slotCard);
      });
      document.getElementById('btn-add-new-character').onclick = () => {
        showCustomPrompt('새로운 카테고리(캐릭터) 이름을 입력하세요:', '새 목표', (newName) => {
          if (!newName || !newName.trim()) newName = '캐릭터 ' + (chars.length + 1);
          const randomX = Math.floor(Math.random() * 60) + 20; const randomY = Math.floor(Math.random() * 40) + 40;
          const newChar = { name: newName.trim().substring(0, 10), level: 1, xp: 0, x: randomX, y: randomY, showExclamation: false };
          window.Questify.initCharParts(newChar); chars.push(newChar);
          window.Questify.saveState(); window.Questify.updateUI(); renderSlotInventory();
        });
      };
    }

    document.getElementById('btn-reset-all-data').addEventListener('click', () => { showCustomConfirm('경고: 모든 데이터가 삭제됩니다.\n정말 삭제하시겠습니까?', () => { localStorage.clear(); location.reload(); }); });

    window.renameChar = function (idx) {
      const currentName = window.Questify.getCharacters()[idx].name; showCustomPrompt('새로운 캐릭터 이름을 입력하세요:', currentName, (newName) => {
        if (newName && newName.trim()) { window.Questify.getCharacters()[idx].name = newName.trim().substring(0, 10); window.Questify.saveState(); window.Questify.updateUI(); renderSlotInventory(); }
      });
    }

    window.deleteChar = function (idx) {
      const chars = window.Questify.getCharacters(); if (chars.length <= 1) { showCustomAlert('캐릭터는 반드시 1명 이상 존재해야 합니다.'); return; }
      showCustomConfirm('이 캐릭터를 정말 삭제하시겠습니까? (메모와 퀘스트는 보존됩니다)', () => {
        chars.splice(idx, 1); quizStorage.forEach(q => { if (q.charIdx === idx) q.charIdx = 0; else if (q.charIdx > idx) q.charIdx--; }); memoStorage.forEach(m => { if (m.charIdx === idx) m.charIdx = 0; else if (m.charIdx > idx) m.charIdx--; });
        window.Questify.saveState(); window.Questify.updateUI(); renderSlotInventory(); renderAll();
      });
    }

    loadAppData(); renderAll();
  </script>
