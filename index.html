<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Timer UI</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.530/neodgm/style.css" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['NeoDunggeunmo', 'monospace']
          },
          boxShadow: {
            'neon-main': '0 0 15px rgba(88, 28, 135, 0.6), inset 0 0 10px rgba(88, 28, 135, 0.4)',
            'neon-menu': '0 0 15px rgba(21, 94, 117, 0.6), inset 0 0 10px rgba(21, 94, 117, 0.4)',
            'neon-dialogue': '0 0 10px rgba(245, 158, 11, 0.5)',
            'neon-btn': '0 0 10px rgba(6, 182, 212, 0.8)',
            'neon-danger': '0 0 15px rgba(220, 38, 38, 0.65)'
          },
          animation: {
            glitch: 'vhs-glitch .65s cubic-bezier(.25,.46,.45,.94) forwards',
            tracking: 'tracking-band .18s linear infinite',
            flicker: 'screen-flicker 3s linear infinite',
            noSignal: 'no-signal-flicker 1.05s steps(2, end) infinite'
          },
          keyframes: {
            'screen-flicker': {
              '0%,100%': { opacity: '1' },
              '50%': { opacity: '.985' }
            },
            'tracking-band': {
              '0%': { top: '-20%', opacity: '0', transform: 'scaleY(1)' },
              '10%': { opacity: '1' },
              '50%': { opacity: '.85', transform: 'scaleY(4)' },
              '100%': { top: '120%', opacity: '0', transform: 'scaleY(1)' }
            },
            'vhs-glitch': {
              '0%': { transform: 'skewX(0deg) scale(1)', filter: 'brightness(1)' },
              '10%': { transform: 'skewX(-12deg) scaleX(1.05)', filter: 'brightness(1.5) hue-rotate(-10deg)' },
              '20%': { transform: 'skewX(20deg) scaleX(1.15) translateX(14px)', filter: 'contrast(1.5)' },
              '30%': { transform: 'skewX(-20deg) scaleX(1.22)', filter: 'drop-shadow(-10px 0 0 cyan)' },
              '40%': { transform: 'skewX(10deg) scaleX(1.05)', filter: 'invert(.15)' },
              '50%': { transform: 'skewX(-28deg) scaleX(1.3) translateX(-18px)', filter: 'brightness(2) hue-rotate(90deg)' },
              '60%': { transform: 'skewX(18deg) scaleX(1.1)', filter: 'drop-shadow(6px 6px 0 magenta)' },
              '70%': { transform: 'skewX(-8deg) scale(1.12)', filter: 'brightness(.55)' },
              '80%': { transform: 'skewX(15deg) scaleX(1.08)', filter: 'invert(.08)' },
              '100%': { transform: 'skewX(0deg) scale(1)', filter: 'brightness(1)' }
            },
            'no-signal-flicker': {
              '0%, 100%': { opacity: '1', filter: 'none' },
              '20%': { opacity: '.55', filter: 'blur(.2px) brightness(1.5)' },
              '40%': { opacity: '1', filter: 'none' },
              '60%': { opacity: '.7', filter: 'contrast(1.4)' },
              '80%': { opacity: '1', filter: 'none' }
            }
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(88, 28, 135, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(8, 145, 178, 0.10), transparent 30%),
        linear-gradient(to bottom, #05040a, #060b17 52%, #030206);
      color: #e2e8f0;
      font-family: 'NeoDunggeunmo', monospace;
      image-rendering: pixelated;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%);
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #090b14;
      border-left: 2px solid #155e75;
    }

    ::-webkit-scrollbar-thumb {
      background: #0891b2;
      border: 1px solid #000;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .vhs-band {
      display: none;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 4vh;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(4px) contrast(180%) grayscale(100%);
      mix-blend-mode: overlay;
      z-index: 60;
      pointer-events: none;
    }

    .vhs-band.active {
      display: block;
    }
  </style>

  <link href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.530/neodgm/style.css" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['NeoDunggeunmo', 'monospace'],
          },
          boxShadow: {
            'neon-main': '0 0 15px rgba(88, 28, 135, 0.6), inset 0 0 10px rgba(88, 28, 135, 0.4)',
            'neon-menu': '0 0 15px rgba(21, 94, 117, 0.6), inset 0 0 10px rgba(21, 94, 117, 0.4)',
            'neon-dialogue': '0 0 10px rgba(245, 158, 11, 0.5)',
            'neon-btn': '0 0 10px rgba(6, 182, 212, 0.8)',
          },
          keyframes: {
            'vhs-glitch': {
              '0%': { transform: 'skewX(0deg) scale(1)', filter: 'brightness(1)' },
              '10%': { transform: 'skewX(-12deg) scaleX(1.05)', filter: 'brightness(1.5) hue-rotate(-10deg)' },
              '20%': { transform: 'skewX(20deg) scaleX(1.15) translateX(14px)', filter: 'contrast(1.5)' },
              '30%': { transform: 'skewX(-20deg) scaleX(1.22)', filter: 'drop-shadow(-10px 0 0 cyan)' },
              '40%': { transform: 'skewX(10deg) scaleX(1.05)', filter: 'invert(.15)' },
              '50%': { transform: 'skewX(-28deg) scaleX(1.3) translateX(-18px)', filter: 'brightness(2) hue-rotate(90deg)' },
              '60%': { transform: 'skewX(18deg) scaleX(1.1)', filter: 'drop-shadow(6px 6px 0 magenta)' },
              '70%': { transform: 'skewX(-8deg) scale(1.12)', filter: 'brightness(.55)' },
              '80%': { transform: 'skewX(15deg) scaleX(1.08)', filter: 'invert(.08)' },
              '100%': { transform: 'skewX(0deg) scale(1)', filter: 'brightness(1)' },
            },
            'tracking-band': {
              '0%': { top: '-20%', opacity: '0', transform: 'scaleY(1)' },
              '10%': { opacity: '1' },
              '50%': { opacity: '.85', transform: 'scaleY(4)' },
              '100%': { top: '120%', opacity: '0', transform: 'scaleY(1)' },
            },
            'screen-flicker': {
              '0%,100%': { opacity: '1' },
              '50%': { opacity: '.985' },
            },
          },
          animation: {
            glitch: 'vhs-glitch .65s cubic-bezier(.25,.46,.45,.94) forwards',
            tracking: 'tracking-band .18s linear infinite',
            flicker: 'screen-flicker 3s linear infinite',
          },
        },
      },
    }
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(88, 28, 135, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(8, 145, 178, 0.10), transparent 30%),
        linear-gradient(to bottom, #05040a, #060b17 52%, #030206);
      color: #e2e8f0;
      font-family: 'NeoDunggeunmo', monospace;
      image-rendering: pixelated;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%);
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #090b14;
      border-left: 2px solid #155e75;
    }

    ::-webkit-scrollbar-thumb {
      background: #0891b2;
      border: 1px solid #000;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .vhs-band {
      display: none;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 4vh;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(4px) contrast(180%) grayscale(100%);
      mix-blend-mode: overlay;
      z-index: 60;
      pointer-events: none;
    }

    .vhs-band.active {
      display: block;
    }
  </style>
</head>

<body class="text-white h-screen w-screen overflow-hidden flex p-2 md:p-4 lg:p-6 box-border relative font-pixel">

  <div class="crt-overlay animate-flicker"></div>

  <main class="relative z-10 flex flex-row gap-3 lg:gap-5 w-full h-full max-h-full overflow-hidden">

    <!-- LEFT -->
    <section id="leftFrame" class="border-[4px] border-purple-900/80 shadow-neon-main flex flex-col flex-grow relative bg-gradient-to-b from-[#060b17] to-[#120a1f] p-3 lg:p-5 overflow-hidden w-full h-full">

      <!-- 왼쪽 상단 화면 영역 -->
      <div id="leftViewport" class="relative flex-grow min-h-0 overflow-hidden flex flex-col">

        <div id="glitchBand" class="vhs-band"></div>

        <!-- 기본 게임 화면 -->
        <div id="gameWorld"
        class="flex-grow flex flex-col items-center justify-center border border-cyan-400/20 relative overflow-hidden bg-[radial-gradient(circle_at_center,rgba(45,212,191,0.05)_0%,transparent_60%)]">

          <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.03)_0%,transparent_55%)]"></div>

          <span class="text-xl lg:text-3xl tracking-widest text-purple-300/50 z-10">
            [ GAME WORLD VIEW ]
          </span>

        </div>

        <!-- 타이머 패널 -->
        <div id="timerPanel"
        class="hidden flex-col flex-grow overflow-hidden bg-[#0c0714]/95 rounded-md border-[4px] border-[#f59e0b] shadow-neon-dialogue p-4">

          <!-- 상단 -->
          <div class="flex gap-4 items-start shrink-0">

            <!-- 말풍선 -->
            <div class="relative flex-1 min-h-[110px] bg-[#f2eedf] rounded-[50px] flex items-center justify-center text-black text-lg lg:text-2xl px-8 py-6 shadow-[0_0_0_2px_rgba(88,28,135,0.15)_inset]">
              <div class="text-center leading-relaxed">
                타이머가 진행 되는 동안
                <br>
                밖에 나가면 실패
              </div>
            </div>

            <!-- 캐릭터 -->
            <div class="w-[120px] lg:w-[170px] aspect-square bg-[#120a1f] border-2 border-cyan-700/40 shadow-neon-menu shrink-0 flex items-center justify-center text-cyan-200">
              CHARACTER
            </div>

          </div>

          <!-- 메인 -->
          <div class="flex-1 mt-4 bg-[#070912] rounded-2xl p-5 flex flex-col items-center justify-center gap-6 border-[3px] border-cyan-900/40 shadow-neon-menu">

            <!-- 타이머 -->
            <div class="relative w-full bg-[#f3de98] rounded-3xl flex items-center justify-center py-6 border-[3px] border-amber-500/70 shadow-neon-dialogue">

              <input
              id="timerDisplay"
              type="text"
              value="00:01:00"
              inputmode="numeric"
              maxlength="8"
              class="bg-transparent text-center outline-none w-full text-black text-5xl lg:text-8xl leading-none px-12" />

              <button
              id="resetTimeBtn"
              type="button"
              class="absolute left-3 bottom-2 text-[10px] lg:text-xs bg-black/20 hover:bg-black/35 text-black px-2 py-1 rounded">

                00:00:00

              </button>

            </div>

            <!-- 프리셋 -->
            <div class="flex flex-wrap justify-center gap-4 w-full">

              <button class="presetBtn bg-[#f3de98] rounded-2xl px-10 py-4 text-black text-2xl lg:text-4xl border-[3px] border-amber-500/60 shadow-neon-dialogue" data-time="1800">
                30m
              </button>

              <button class="presetBtn bg-[#f3de98] rounded-2xl px-10 py-4 text-black text-2xl lg:text-4xl border-[3px] border-amber-500/60 shadow-neon-dialogue" data-time="3600">
                1h
              </button>

              <button class="presetBtn bg-[#f3de98] rounded-2xl px-10 py-4 text-black text-2xl lg:text-4xl border-[3px] border-amber-500/60 shadow-neon-dialogue" data-time="10800">
                3h
              </button>

            </div>

            <!-- 시작 -->
            <button
            id="startTimerBtn"
            class="bg-cyan-950 border-[3px] border-cyan-500 shadow-neon-btn hover:bg-cyan-800 rounded-2xl px-14 py-4 text-cyan-300 text-2xl lg:text-4xl transition-colors">
              시작
            </button>

          </div>

        </div>

        <!-- 어두워지는 오버레이 -->
        <div
        id="dimOverlay"
        class="hidden absolute top-0 left-0 right-0 bottom-[160px] bg-black/70 z-40 pointer-events-auto backdrop-blur-[1px]">
        </div>

        <!-- 실패 -->
        <div
        id="failScreen"
        class="hidden absolute top-0 left-0 right-0 bottom-[160px] z-50 flex items-center justify-center cursor-pointer bg-black/10 backdrop-blur-[1px]">

          <div class="border-[4px] border-red-500 p-12 bg-[#0c0714] text-red-500 text-4xl lg:text-6xl shadow-[0_0_18px_rgba(239,68,68,0.25)]">
            챌린지 실패
          </div>

        </div>

        <!-- 성공 -->
        <div
        id="successScreen"
        class="hidden absolute top-0 left-0 right-0 bottom-[160px] z-50 flex items-center justify-center cursor-pointer bg-black/10 backdrop-blur-[1px]">

          <div class="border-[4px] border-lime-400 p-12 bg-[#0c0714] text-lime-400 text-4xl lg:text-6xl shadow-[0_0_18px_rgba(163,230,53,0.22)]">
            챌린지 성공
          </div>

        </div>

      </div>

      <!-- 대화창 -->
      <div class="border-[4px] border-[#f59e0b] bg-[#0c0714] p-4 lg:p-5 flex items-center gap-4 lg:gap-6 shrink-0 z-20 mt-4 h-[140px] min-h-[140px] max-h-[140px] shadow-neon-dialogue">

        <!-- 초상화 -->
        <div id="dialogPortrait"
        class="w-20 h-20 lg:w-28 lg:h-28 border-2 border-[#f59e0b]/60 bg-[#120a1f] shrink-0 self-center flex flex-col items-center justify-center shadow-[0_0_10px_rgba(245,158,11,0.18)]">

          <span class="text-[#f59e0b]/70 text-xs lg:text-sm">
            PORTRAIT
          </span>

        </div>

        <!-- 텍스트 -->
        <div id="dialogContainer"
        class="flex-col flex-grow flex justify-between items-center relative h-full">

          <p id="dialogText"
          class="text-[#e5e7eb] text-sm lg:text-base ml-[1vw] leading-relaxed">

            대화 내용이 들어가는 자리입니다.<br>
            초상화는 좌측에, 화살표는 우측 하단에 위치합니다.

          </p>

          <div class="mt-2 self-end lg:mr-2 text-[#f59e0b] animate-bounce">
            ▼
          </div>

        </div>

      </div>

      <!-- 모바일 메뉴 -->
      <button onclick="toggleMenu()"
      class="lg:hidden absolute top-4 right-4 z-40 bg-cyan-950/90 border-[3px] border-cyan-500 text-cyan-300 shadow-neon-btn px-4 py-2 text-sm hover:bg-cyan-800 transition-colors">

        SYSTEM MENU ☰

      </button>

    </section>

    <!-- RIGHT -->
    <aside id="systemMenu"
    class="fixed lg:relative inset-x-0 bottom-0 h-[85vh] lg:h-full lg:w-[420px] shrink-0 border-t-[4px] lg:border-[4px] border-cyan-800/80 shadow-neon-menu bg-[#070912]/95 lg:bg-[#070912] p-4 lg:p-5 flex flex-col gap-4 lg:gap-5 overflow-y-auto transform translate-y-full lg:translate-y-0 transition-transform duration-300 ease-in-out z-50">

      <!-- 헤더 -->
      <div class="flex justify-between items-center border-b-[3px] border-cyan-900 pb-2 lg:pb-3">
        <h2 class="text-lg lg:text-xl w-full lg:text-center font-bold text-cyan-500 tracking-widest">
          SYSTEM MENU
        </h2>

        <button onclick="toggleMenu()"
        class="lg:hidden border border-cyan-700 bg-cyan-900/50 px-3 py-1 text-sm text-cyan-300">
          닫기 ▼
        </button>
      </div>

      <!-- Play Time -->
      <div class="bg-black/60 border-[3px] border-cyan-900/60 p-4 flex justify-between items-center shadow-[0_0_12px_rgba(8,145,178,0.08)]">
        <div>
          <h3 class="text-sm mb-2 text-cyan-700 tracking-widest">
            타이머 챌린지
          </h3>

          <div id="playTimeDisplay"
          class="text-2xl lg:text-3xl mb-1 text-cyan-50 tracking-wider">
            00:01:00
          </div>
        </div>

        <button id="toggleTimerBtn"
        class="w-12 h-12 lg:w-14 lg:h-14 bg-cyan-950 border-[3px] border-cyan-500 shadow-neon-btn flex items-center justify-center text-cyan-400 text-xl hover:bg-cyan-800 transition-colors">
          ▶
        </button>
      </div>

      <!-- Quests -->
      <div class="bg-black/60 border-[3px] border-cyan-900/60 p-4">
        <div class="flex justify-between border-b-[3px] border-cyan-900/50 pb-3 mb-3 lg:mb-4">
          <span class="text-base lg:text-lg text-cyan-300 tracking-widest">
            오늘의 퀘스트
          </span>
          <span class="text-base lg:text-lg text-cyan-500 tracking-widest">
            2 / 3
          </span>
        </div>

        <label class="flex items-center justify-between cursor-pointer p-2 hover:bg-cyan-900/30">
          <span class="text-sm lg:text-md text-cyan-100">
            30분 이상 집중하기
          </span>
          <div class="w-5 h-5 lg:w-6 lg:h-6 border-2 border-cyan-600 bg-black"></div>
        </label>
      </div>

      <!-- Character Info -->
      <div class="bg-black/60 border-[3px] border-purple-900/60 p-4 flex-grow flex flex-col shadow-[0_0_12px_rgba(88,28,135,0.08)]">
        <h3 class="text-sm lg:text-md mb-3 lg:mb-4 border-b-[3px] border-purple-900/50 pb-2 text-purple-500 tracking-widest">
          캐릭터 상태
        </h3>

        <div class="flex gap-4 mb-5 lg:mb-6 mt-2">
          <div class="w-16 h-16 lg:w-20 lg:h-20 border-2 border-purple-700 bg-[#120a1f] shrink-0 shadow-[0_0_10px_rgba(126,34,206,0.12)]"></div>
          <div class="flex-grow flex flex-col justify-center">
            <span class="text-xs lg:text-sm mb-1 text-purple-400 tracking-widest">
              LEVEL
            </span>
            <span class="text-2xl lg:text-3xl mb-3 lg:mb-4 text-white tracking-wider">
              Lv.12
            </span>

            <div class="w-full relative">
              <div class="flex justify-between text-[10px] lg:text-xs mb-1 text-purple-300">
                <span>EXP</span><span>640 / 1200</span>
              </div>
              <div class="h-2 lg:h-3 w-full bg-[#110c1a] border-2 border-purple-800">
                <div class="h-full bg-cyan-500" style="width: 53%;"></div>
              </div>
            </div>
          </div>
        </div>

        <ul class="text-sm lg:text-md space-y-3 lg:space-y-4 mt-auto text-gray-300">
          <li class="flex justify-between"><span class="text-purple-400">🕒 총 집중 시간</span><span class="text-purple-100">18h 42m</span></li>
          <li class="flex justify-between"><span class="text-purple-400">◎ 완료한 퀘스트</span><span class="text-purple-100">24</span></li>
          <li class="flex justify-between"><span class="text-purple-400">★ 연속 집중일</span><span class="text-purple-100">7 일</span></li>
        </ul>
      </div>

      <!-- Navigation -->
      <div class="flex justify-around bg-black/60 border-[3px] border-cyan-900/60 p-3 text-xl lg:text-2xl mt-auto">
        <button class="text-cyan-400 hover:text-cyan-300 transition-colors">🏠</button>
        <button class="hover:text-purple-400 transition-colors">📊</button>
        <button class="hover:text-purple-400 transition-colors">🏆</button>
        <button class="hover:text-purple-400 transition-colors">⚙️</button>
      </div>

    </aside>

  </main>

  <script src="./script.js"></script>

</body>
</html>
