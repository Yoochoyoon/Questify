<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questify</title>
</head>

<body class="min-h-[104vh] flex flex-col relative">
    <div id="main-page" class="bg-stone-900 p-5 flex-1 relative">
        <header class="main-header
                   px-6 py-3 
                   flex flex-wrap flex-col justify-center items-center
                   bg-stone-600
                   md:flex-row md:justify-start md:items-end md:w-[40vw] lg:w-[30vw] relative z-10 rounded-xl">
            <h1 class="project-name text-3xl text-yellow-500 font-bold">Questify</h1>
            <p class="text-stone-300 mx-2 mt-1">Today's Work</p>
            <section id="questCoinHide"
                class="w-full font-bold flex flex-col items-stretch text-center mt-5 gap-1 max-h-70">
                <button id="questTimer" class="bg-stone-400 hover:bg-stone-800 hover:text-stone-300 mb-1
                 py-1 min-w-[65vw] md:min-w-[25vw] mx-auto rounded-xl">공부 챌린지 시작!</button>
                <button class="add-btn bg-stone-500 hover:bg-stone-800 hover:text-stone-300 mb-1
                 py-1 min-w-[65vw] md:min-w-[25vw] mx-auto rounded-xl">퀘스트+</button>
                <p id="coin" class="text-yellow-500 text-5xl">500</p>
            </section>
            <button id="questFold-btn" class="
                   bg-stone-500 absolute
                   rounded-[50%] w-5 h-5 right-3 bottom-3 font-bold leading-none text-stone-800">▲</button>
            <section id="progresBarOut" class="absolute bg-yellow-300 w-[90vw] h-5 rounded-md -bottom-12
            md:fixed md:top-[3vh] md:w-[46vw] md:left-[43vw] lg:md:left-[32vw] lg:w-[57vw] hidden rounded-lg">
                <div id="progresBarIn" class="h-full w-0 bg-yellow-600 transition-all rounded-lg">
                </div>
            </section>
        </header>

        <main id="charAndBack"
            class="w-[80vw] h-[80vh] bg-stone-800 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[44vh]">
        </main>

        <nav
            class="nav-btn grid grid-row-4 gap-2 absolute bottom-10 left-0 right-0 px-8 md:grid-cols-4 md:gap-5 font-bold">
            <button
                class="bg-stone-500 border-4 border-stone-400 py-2 hover:scale-105 md:py-5 hover:border-stone-300">상점</button>
            <button
                class="bg-stone-500 border-4 border-stone-400 py-2 hover:scale-105 md:py-5 hover:border-stone-300">배경</button>
            <button
                class="bg-stone-500 border-4 border-stone-400 py-2 hover:scale-105 md:py-5 hover:border-stone-300">캐릭터</button>
            <button
                class="bg-stone-500 border-4 border-stone-400 py-2 hover:scale-105 md:py-5 hover:border-stone-300">설정</button>
        </nav>

        <div class="alart">
            <section id="computerLimit" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 grid grid-cols-2 gap-5 border-4 border-stone-400">
                    <p class="col-span-2">컴퓨터 사용 제한을 켜시겠습니까?<br>마우스가 화면 밖으로 나가지 못하게 됩니다.</p>
                    <button id="computerLimitY" class="bg-stone-600 hover:bg-stone-300">예</button>
                    <button id="computerLimitN" class="bg-stone-600 hover:bg-stone-300">아니오</button>
                </div>
            </section>
            <section id="challengeAsk" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 grid grid-cols-2 gap-5 border-4 border-stone-400">
                    <p class="col-span-2">시작하시겠습니까?<br><span class="text-yellow-500">100G</span>가 소모됩니다.</p>
                    <button id="challengeAskY" class="bg-stone-600 hover:bg-stone-300">예</button>
                    <button id="challengeAskN" class="bg-stone-600 hover:bg-stone-300">아니오</button>
                </div>
            </section>
            <section id="challengeStopAsk" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 grid grid-cols-2 gap-5 border-4 border-stone-400">
                    <p class="col-span-2">포기하시겠습니까?</p>
                    <button id="challengeStopAskY" class="bg-stone-600 hover:bg-stone-300">예</button>
                    <button id="challengeStopAskN" class="bg-stone-600 hover:bg-stone-300">아니오</button>
                </div>
            </section>
            <section id="minitAsk" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 flex flex-col gap-5 border-4 border-stone-400">
                    <label for="minitAnswer">몇분동안 공부할것인지 입력하세요.</label>
                    <input id="minitAnswer" min="1" type="number" class="bg-stone-600 hover:bg-stone-300 text-center">
                    <button id="minitAnswerY" class="bg-stone-600 hover:bg-stone-300">확인</button>
                </div>
            </section>
            <section id="challengeFail" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 flex flex-col border-4 border-red-700">
                    <button id="challengeFailBtn" class="text-red-700 font-bold text-3xl">챌린지 실패!</button>
                </div>
            </section>
            <section id="challengeS" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 flex flex-col border-4 border-green-500">
                    <button id="challengeSBtn" class="text-green-500 font-bold text-3xl">챌린지 성공!</button>
                </div>
            </section>
            <section id="notEnoughC" class="fixed inset-0 bg-black/50 z-10 font-bold hidden">
                <div
                    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[30vh] text-center bg-stone-500 p-6 flex flex-col border-4 border-green-500">
                    <button id="notEnoughCBtn" class="text-orenge-500 font-bold text-3xl">코인이 부족해요!</button>
                </div>
            </section>
        </div>
    </div>
    <footer class="bg-stone-700 text-center text-stone-900">
        <p>만든사람:2026109615신찬영 기말프로젝트 테스트파일</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
