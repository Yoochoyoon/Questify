<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Questify</title>
  <style>
    /* ==========================================================================
       [1] 전역 초기화 및 기본 박스 모델 (style.css 오리지널 스타일 완전 이식)
       ========================================================================== */
    * {
      box-sizing: border-box; /* 패딩과 테두리를 요소의 크기에 포함 */
    }

    html, body {
      margin: 0; /* 기본 여백 제거 */
      width: 100%;
      height: 100%;
    }

    body {
      width: 100vw;
      height: 100dvh; /* 모바일 브라우저 툴바를 고려한 동적 뷰포트 높이 설정 */
      overflow: hidden; /* 스크롤바 숨김 */
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('bg.png'); /* 배경 이미지 */
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover; /* 배경 이미지 화면에 맞춤 */
      backdrop-filter: blur(3px) brightness(0.7); /* 배경 흐림 및 밝기 조절 효과 */
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; /* 기본 폰트 설정 */
      user-select: none; /* 텍스트 선택 방지 */
    }

    button, input, textarea, select {
      font: inherit; /* 부모 요소의 폰트 상속 */
    }

    button {
      cursor: pointer; /* 마우스 오버 시 포인터 변경 */
    }

    /* ==========================================================================
       [2] 앱 전체 레이아웃 (App Container)
       ========================================================================== */
    .app {
      position: relative;
      display: flex;
      flex-direction: column; /* 세로 방향으로 요소 배치 */
      width: 100%;
      height: 100%;
      overflow: hidden;
      gap: 4px; /* 요소 간격 설정 */
      padding: 0;
      background: #fff;
      border: 3px solid #000;
    }

    /* 공통 패널 스타일 */
    .panel {
      position: relative;
      overflow: hidden;
      border: 4px solid #000;
      transition: all .3s ease; /* 부드러운 전환 효과 */
    }

    /* 좌측 메인 패널 (게임 화면, 타이머) */
    #left-panel {
      width: 100%;
      height: 45%;
      flex-shrink: 0;
      background: #fff;
      transition: height 0.3s ease;
    }

    /* 우측 퀘스트/저장소 패널 래퍼 */
    #right-panel-wrapper {
      flex: 1; /* 남은 공간 모두 차지 */
      width: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(#92785E, #91775D); /* 그라데이션 배경 */
      border: 4px solid black;
    }

    /* 저장소(퀴즈) 패널 특화 배경 */
    #panel-storage {
      background: radial-gradient(#7387bb, #5D6C91);
    }

    /* 화면 전환용 공통 스크린 클래스 */
    .screen {
      position: relative;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-image: url('https://i.pinimg.com/736x/c0/2d/62/c02d62b2913dd06ae163add8da0e0b7f.jpg'); /* 게임 화면 배경 */
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* 요소 숨김 클래스 */
    .hidden {
      display: none !important;
    }

    /* ==========================================================================
       [3] 좌측 패널 내부 요소 (HUD & 로비 캐릭터)
       ========================================================================== */
    /* 최상단 HUD 영역 (목표, 프로필 등) */
    .top-hud {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 30; /* 캐릭터나 배경보다 위에 표시 */
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      pointer-events: none; /* 클릭 이벤트 통과 (하위 요소에만 개별 적용) */
    }

    /* HUD 내부 상호작용 가능 요소 */
    .top-hud > * {
      pointer-events: auto;
    }

    .goal-title {
      margin: 0 0 0 2.5%;
      font-size: 14px;
      font-weight: 800;
    }

    /* 진행도 바 래퍼 */
    .progress-wrap {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 24px;
      margin: 4px auto 0;
      overflow: hidden;
      border: 2px solid #000;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      box-shadow: inset 0px 1px 1px 20px rgba(0, 0, 0, 0.318);
    }

    /* 실제 채워지는 진행도 게이지 */
    #progress-bar-fill {
      width: 0;
      height: 100%;
      transition: width .3s; /* 부드럽게 차오르는 애니메이션 */
      background: #2EADE3;
      box-shadow: 0px 0px 1px 2px rgba(0, 0, 0, 0.4), inset 0px 0px 4.5px 3px rgba(97, 202, 219, 0.2), inset 1px 13px rgba(255, 255, 255, 0.177);
      border-radius: 5px;
    }

    /* 진행도 퍼센트/수치 텍스트 */
    #progress-text {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      color: white;
      text-shadow: -1.2px 0 black, 0 1.2px black, 1.2px 0 black, 0 -1.2px black; /* 글자 검은 테두리 */
    }

    /* 전체 유니온 상태 카드 */
    #user-profile-card {
      width: 120px;
      margin-left: 2.5%;
      padding: 6px;
      background: rgba(0, 0, 0, 0.46);
      box-shadow: 0px 0px 9.1px -1px rgba(255, 255, 255, 0.3), inset 0px 0px 15.3px -5px rgba(0, 0, 0, 0.39);
      border-radius: 10px;
      transition: transform .15s;
      cursor: pointer;
    }

    #user-profile-card:hover {
      transform: scale(1.05); /* 마우스 호버 시 살짝 커짐 */
    }

    .profile-name {
      overflow: hidden;
      text-overflow: ellipsis; /* 글자가 길면 ... 처리 */
      white-space: nowrap;
      font-size: 10px;
      font-weight: 800;
      color: white;
      text-shadow: -1.2px 0 black, 0 1.2px black, 1.2px 0 black, 0 -1.2px black;
    }

    .profile-level {
      margin-top: 2px;
      color: rgb(0, 255, 0);
      font-size: 11px;
      font-weight: 900;
      text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    /* 로비 캐릭터 배치 컨테이너 */
    #lobby-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* 개별 로비 캐릭터 컴포넌트 */
    .lobby-char {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto; /* 상호작용 허용 */
      touch-action: none; /* 브라우저 기본 터치 액션 방지 (커스텀 드래그 위해) */
      cursor: pointer;
      width: 27px;
      transform: translate(-50%, -50%); /* 중앙 정렬 기준점 맞춤 */
      z-index: 20;
    }

    .lobby-char:active {
      cursor: grabbing; /* 드래그 중 커서 변경 */
    }

    /* 캐릭터 머리 위 퀴즈 알림 느낌표 */
    .char-exclamation {
      position: absolute;
      top: -20px; 
      font-size: 14px; 
      font-weight: 900;
      color: #fff;
      background: #FF2E56;
      border: 2px solid #000;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0px 3px 0px #000, 0px 0px 10px rgba(255,0,0,0.6); 
      cursor: pointer;
      z-index: 30;
      animation: bounceExclamation 0.5s infinite alternate ease-in-out;  /* 통통 튀는 애니메이션 */
    }
    
    .char-exclamation:active {
      transform: scale(0.9);
    }

    @keyframes bounceExclamation {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    /* 캐릭터 이름표 영역 */
    .char-nameplate {
      margin-bottom: 4px;
      font-weight: 800;
      color: white;
      text-align: center;
      background: transparent;
      padding: 0;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
    }

    .char-name-text {
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin-bottom: 2px;
      text-shadow: -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black, 1px 1px 2px black;
    }

    .char-level-text {
      color: #a3e635;
      font-size: 10px;
      line-height: 1;
      text-shadow: -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black, 1px 1px 2px black;
    }

    /* 캐릭터 아바타(이미지) 파츠 합성 영역 */
    .char-body {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .char-body img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none; /* 이미지 드래그 방지 */
      pointer-events: none;
    }

    /* 파츠별 Z-index 계층 설정 */
    .char-part-base { z-index: 1; position: relative; } /* 맨 몸 */
    .char-part-bottom { position: absolute; bottom: 0; left: 0; z-index: 2; } /* 바지 */
    .char-part-head { position: absolute; top: 0; left: 0; z-index: 3; } /* 머리/모자 */

    /* 캐릭터 개별 경험치 바 */
    .char-xp-bar-container {
      width: 30px;
      height: 4px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #000;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .char-xp-bar-fill {
      height: 100%;
      background: #a3e635;
      transition: width 0.3s ease;
    }

    /* 가끔씩 튀어나오는 말풍선 */
    .char-bubble {
      position: absolute;
      top: -45px; 
      background: white;
      border: 3px solid black; 
      border-radius: 20px; 
      padding: 8px 16px; 
      font-size: 10px; 
      font-weight: 900;
      color: black;
      white-space: nowrap;
      animation: bounceUpDown 1s infinite;
      z-index: 25;
    }
    
    /* 말풍선 꼬리 */
    .char-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px; 
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: white;
      border-right: 3px solid black;
      border-bottom: 3px solid black;
    }

    /* ==========================================================================
       [4] 타이머 화면 레이아웃 및 컴팩트 HUD 스타일
       ========================================================================== */
    #timer-screen { z-index: 30; background: #F9E9C8; display: flex; flex-direction: column; }

    /* 타이머 닫기(X) 버튼 */
    .round-close {
      position: absolute; top: 8px; left: 8px; z-index: 40; width: 32px; height: 32px;
      display: flex; justify-content: center; align-items: center; border-radius: 50%;
      font-weight: 1000; background: #F02C2C; border: 2px solid #000000;
      box-shadow: inset 0px 0px 2px 2px rgba(255, 255, 255, 0.384);
      color: white; text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    #timer-main {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }

    .timer-layout {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px 10px; 
      pointer-events: none; overflow-y: auto; overflow-x: hidden;
    }

    /* 타이머 캐릭터 + 말풍선 컨테이너 */
    .timer-top {
      z-index: 10; display: flex; flex-direction: row; justify-content: center;
      align-items: center; gap: 10px; width: 100%; max-width: 600px;
      margin-bottom: -5px; pointer-events: auto;
    }

    #speech-bubble { flex: 0 1 auto; position: relative; z-index: 15; margin-bottom: 20px; }

    .bubble {
      position: relative; background: #F8EEDF; border: 3px solid #000; border-radius: 20px;
      padding: 12px 16px; font-size: 13px; font-weight: 800; text-align: center;
      word-break: keep-all; color: #000; box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
    }

    .bubble::after {
      content: ""; position: absolute; top: 50%; right: -8px; transform: translateY(-50%) rotate(45deg);
      width: 14px; height: 14px; background: #F8EEDF; border-top: 3px solid #000; border-right: 3px solid #000;
    }

    /* 타이머 화면 캐릭터 래퍼 */
    .timer-character { width: 50px; flex-shrink: 0; position: relative; z-index: 10; }
    .timer-character img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }

    .timer-char-img-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 타이머 화면 캐릭터 머리 위 HUD */
    .timer-char-hud {
      position: absolute;
      bottom: 100%; /* 캐릭터 머리 위에 배치하기 위한 속성 */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100px;
      margin-bottom: 4px;
      z-index: 20;
    }

    .timer-char-hud-name {
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
      margin-bottom: 2px;
      text-shadow: -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black, 1px 1px 2px black; /* 그림자 효과 */
    }

    .timer-char-hud-level {
      color: #a3e635;
      font-size: 10px;
      font-weight: 900;
      margin-bottom: 3px;
      text-shadow: -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black, 1px 1px 2px black; /* 그림자 효과 */
    }

    .timer-char-hud-xpbar {
      width: 40px;
      height: 4px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #000;
      border-radius: 2px;
      overflow: hidden;
    }

    .timer-char-hud-xpfill {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      transition: width 0.3s;
    }

    /* 타이머 시간/버튼을 감싸는 박스 */
    .timer-card {
      z-index: 20; width: 100%; max-width: 600px; display: flex; flex-direction: column;
      gap: 8px; flex-shrink: 0; margin-top: 0; padding: 12px; pointer-events: auto;
      background: #B37E6C; border: 6px solid #000000; box-shadow: inset 0px 5px 3px rgba(255, 211, 182, 0.288); border-radius: 15px;
    }

    .timer-display-wrap {
      position: relative; min-height: 50px; display: flex; justify-content: center; align-items: center;
      overflow: hidden; padding: 8px 0; border: 3px solid #000; border-radius: 8px; background: #624236; 
    }

    /* 00:00:00 표시 인풋 */
    #timer-display {
      z-index: 10; width: 100%; border: 0; outline: 0; background: transparent;
      color: #ffffff; text-align: center; font-size: 40px; font-weight: 900;
      line-height: 1; text-shadow: -3px 0 black, 0 3px black, 3px 0 black, 0 -3px black;
    }

    /* 타이머 버튼용 레이아웃 래퍼 */
    .row { display: flex; gap: 8px; justify-content: center; }

    /* 타이머 제어 공통 버튼 스타일 */
    .preset-btn, #reset-timer-btn, #start-timer-btn, .plain-btn {
      border: 2px solid #000000; border-radius: 8px; background: #e79a52; color: #000; font-weight: 900;
      box-shadow: inset 0px -4px 0.5px -1px rgba(0, 0, 0, 0.308), inset 0px -5px 1px 2px rgba(255, 255, 255, 0.123);
      transition: transform .1s, background .15s; width: 30%; font-size: 14px;
    }
    
    .preset-btn { flex: 1; padding: 8px 0; }
    .preset-btn:hover, .plain-btn:hover { background: #d86c2d; }
    .preset-btn:active, #reset-timer-btn:active, #start-timer-btn:active, .plain-btn:active { transform: scale(.95); } /* 클릭시 꾹 눌리는 효과 */
    
    #reset-timer-btn { background: #b3ff00; padding: 12px 0; font-size: 16px; width: 25%; }
    #start-timer-btn { background: #FFBB00; padding: 12px 0; font-size: 16px; width: 35%; }
    #start-timer-btn:hover { background: #ffe449; }

    /* 타이머 캐릭터 선택창 모달 오버레이 */
    .timer-char-select-overlay {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex; justify-content: center; align-items: center;
      z-index: 50; padding: 16px;
    }

    .timer-char-select-box {
      width: 100%; max-width: 500px;
      background: #F8EFE6; border: 4px solid #000; border-radius: 12px;
      padding: 20px; display: flex; flex-direction: column; gap: 16px;
      max-height: 90%;
    }

    .timer-char-select-title {
      margin: 0; text-align: center; font-size: 18px; font-weight: 900; color: #000;
    }

    /* 선택창 캐릭터 목록 그리드 */
    .timer-char-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px; overflow-y: auto; padding: 4px 4px 24px 4px;
    }

    .timer-char-card {
      background: #fff; border: 3px solid #000; border-radius: 8px;
      padding: 12px 12px 20px 12px; margin-bottom: 4px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
    }

    .timer-char-card:hover {
      transform: scale(1.05); box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .timer-char-card:active {
      transform: scale(0.95);
    }

    .timer-char-card .card-name {
      font-size: 14px; font-weight: 900; margin-bottom: 4px; color: #000; text-align: center;
    }

    .timer-char-card .card-level {
      font-size: 12px; color: #374151; font-weight: 800; margin-bottom: 8px;
    }

    /* 타이머 결과창(보상 지급 팝업) 오버레이 */
    #timer-result-overlay {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 60; padding: 16px;
    }

    .timer-result-box {
      width: 100%; max-width: 320px;
      background: #fff; border: 4px solid #000; border-radius: 12px;
      padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.6); text-align: center;
    }

    .timer-result-char-name { font-size: 18px; font-weight: 900; color: #000; }

    .timer-result-xp-badge {
      background: #FFBB00; color: #000; padding: 8px 16px; border-radius: 20px;
      border: 3px solid #000; font-size: 18px; font-weight: 900;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), 0 4px 0 #000;
    }

    .timer-result-lv { font-size: 14px; font-weight: 800; color: #2563eb; }
    .timer-result-msg { font-size: 14px; font-weight: 800; color: #374151; margin: 0; }
    
    .timer-result-btns { display: flex; gap: 10px; width: 100%; margin-top: 8px; }
    
    .timer-result-btn {
      flex: 1; padding: 10px 0; border: 3px solid #000; border-radius: 8px;
      font-size: 14px; font-weight: 900; box-shadow: 0 4px 0 #000; transition: transform 0.1s, box-shadow 0.1s;
    }

    .timer-result-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }
    .timer-result-btn.memo { background: #3b82f6; color: #fff; }
    .timer-result-btn.skip { background: #e5e7eb; color: #000; }

    /* ==========================================================================
       [5] 커스텀 모달 & 알림 대화상자 (Dialog)
       ========================================================================== */
    /* 모달의 배경 처리 (화면을 덮는 흐릿한 오버레이) */
    #modal-overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; padding: 16px; z-index: 999; background: rgba(20, 22, 14, 0.733); }
    #dialog-overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; padding: 16px; z-index: 1000; background: rgba(0, 0, 0, 0.5); }

    /* 컨텐츠 팝업 공통 박스 스타일 */
    .modal-content {
      position: relative; width: 100%; max-width: 95%; height: 90%; display: flex; flex-direction: column;
      gap: 12px; padding: 16px; border: 4px solid #000; border-radius: 12px; background: #F8EFE6;
      box-shadow: inset 0px 0px 8.9px 14px rgba(154, 91, 20, 0.11), inset 0px 0px 3px 8px #FFFFFF;
    }

    /* 알림창 등 작은 팝업용 클래스 */
    .modal-mini { height: auto !important; max-width: 320px !important; padding: 24px !important; box-shadow: 0px 10px 25px rgba(0,0,0,0.6) !important; }

    /* 팝업 모서리의 X 버튼 */
    .close-modal-btn {
      position: absolute; top: -12px; left: -12px; z-index: 50; width: 28px; height: 28px; display: flex;
      justify-content: center; align-items: center; border-radius: 50%; background: #F02C2C; border: 2px solid #000000;
      box-shadow: inset 0px 0px 2px 2px rgba(255, 255, 255, 0.384); color: white; font-weight: 1000; text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    /* 입력 필드 (input, textarea 등) 공통 테마 */
    .field, .area, .fake-field {
      width: 100%; border: 3px solid #9A8978; color: #000; font-size: 14px; font-weight: 800; outline: 0; background: #F0E3D3;
      box-shadow: inset 0px -3px 2px 2px rgba(255, 255, 255, 0.4), inset 0px 3px 2px 1px rgba(78, 18, 18, 0.363);
    }

    .field, .fake-field { min-height: 42px; border-radius: 999px; padding: 8px 16px; }
    .area, #solve-quiz-content { flex: 1; resize: none; border-radius: 12px; padding: 12px 16px; overflow-y: auto; }

    /* 모달 내부 확인/제출 기능 버튼 */
    .submit-btn {
      align-self: center; padding: 12px 40px; font-size: 16px; font-weight: 900; background: #E45154; color: white;
      border: 3px solid #000000; box-shadow: inset 0px -5px 0.5px -1px rgba(0, 0, 0, 0.4), inset 0px -4px 2px 4px rgba(255, 255, 255, 0.2); border-radius: 10px;
    }
    #btn-submit-notepad { background: #59A3F8; }

    /* 정답 제출 후 결과 피드백 상자 */
    #solve-result-state {
      width: 100%; min-height: 96px; height: auto; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto;
      padding: 16px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 800; line-height: 1.5; word-break: break-all;
    }

    .result-good { border: 2.5px solid #22c55e; background: #dcfce7; color: #15803d; }
    .result-bad { flex-direction: column; border: 2.5px solid #ef4444; background: #fee2e2; color: #b91c1c; }

    /* ==========================================================================
       [6] 캐릭터(슬롯) 관리 모달 UI
       ========================================================================== */
    #union-level-display { margin: 0; padding-bottom: 8px; border-bottom: 2px solid #000; text-align: center; font-size: 20px; font-weight: 900; }
    
    /* 캐릭터 목록 렌더링 컨테이너 */
    #slot-manager-container { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 0 4px 16px; }
    
    /* 개별 슬롯 카드 */
    .slot-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 3px solid #000; border-radius: 8px; background: #f9fafb; }
    .slot-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 900; }
    
    /* 레벨업 뱃지 아이콘 */
    .badge { padding: 2px 8px; border-radius: 999px; background: #3b82f6; color: #fff; font-size: 12px; }
    .badge.gold { background: #facc15; color: #000; }
    
    /* 모달 내부 경고(데이터 삭제 등) 버튼 */
    .danger-btn { flex-shrink: 0; padding: 12px 16px; border: 3px solid #000; border-radius: 8px; background: #ef4444; color: #fff; font-size: 16px; font-weight: 900; box-shadow: inset 0px -5px 0.5px -1px rgba(0, 0, 0, 0.4), inset 0px -4px 2px 4px rgba(255, 255, 255, 0.2); }
    
    /* ==========================================================================
       [7] 우측 패널 및 일일 퀘스트 / 하위 퀘스트 (폴더) UI
       ========================================================================== */
    /* 모바일에서 우측 패널 껐다 켰다 하는 토글 햄버거 버튼 */
    #mobile-toggle-btn {
      position: absolute; top: 12px; right: 12px; z-index: 40; width: 32px; height: 32px;
      display: flex; justify-content: center; align-items: center; font-size: 23px; font-weight: 1000; color: #000; border: none; background: none;
    }

    /* 패널 공통 영역 (일일퀘스트, 퀴즈퀘스트) */
    .panel-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* 타이틀 텍스트 디자인 */
    .panel-title { margin: 0; padding-top: 12px; padding-bottom: 8px; color: #000; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: .12em; }
    
    /* 퀘스트/퀴즈 리스트 스크롤 영역 */
    .list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 0 8px 64px; }

    /* 드래그 가능 아이템 */
    .draggable-todo-item { cursor: grab; user-select: none; }
    .draggable-todo-item:active { cursor: grabbing; }

    /* 리스트 내부 공통 카드 뷰 스타일 */
    .todo-card, .quiz-card, .storage-card {
      flex-shrink: 0; padding: 8px; border: 3px solid black; border-radius: 5px;
      box-shadow: 0 2px 1px 3px rgba(44, 9, 9, 0.15), inset 0 0.3px 1px 2px rgba(133, 98, 76, 0.68), inset 0 3dvb 1px 1px rgba(27, 23, 23, 0.1);
    }

    /* 할일 전용 카드 (갈색) */
    .todo-card { min-height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 6px; border: 2.5px solid #000; background: #725949; }
    
    /* 성공/완료 상태의 어두운 카드 배경 */
    .todo-card.clear { background: #241a13; box-shadow: 0 2px 1px 3px rgba(44, 9, 9, 0.15), inset 0 0.3px 1px 2px rgba(133, 98, 76, 0.344), inset 0 3dvb 1px 1px rgba(27, 23, 23, 0.1); cursor: default; }

    /* 텍스트 입력창 투명 처리 */
    .todo-card input, .quiz-card input { width: 100%; border: 0; outline: 0; background: transparent; color: #000; font-size: 12px; font-weight: 800; }
    
    /* 수정 가능한 텍스트 입력창 상태 변경 시 제어 */
    .inline-todo-input[readonly] { pointer-events: none; user-select: none; -webkit-user-select: none; }
    .inline-todo-input:not([readonly]) { pointer-events: auto; cursor: text; user-select: text; -webkit-user-select: text; }

    /* 완료(클리어) 카드 안 텍스트 스타일: 희미하게 (취소선 제외) */
    .todo-card.clear input { color: rgba(255, 255, 255, 0.7); text-decoration: none !important; }
    .todo-card input::placeholder { color: rgba(255,255,255,0.6); font-weight: normal; }

    /* 드래그 핸들 기호 (≡) */
    .drag-handle { margin-right: 8px; color: #000000d5; font-size: 30px; font-weight: 900; line-height: 1; pointer-events: none; flex-shrink: 0;}

    /* 하위 폴더 생성용 + 초록색 버튼 */
    .folder-add-btn {
      background: #4caf50; color: white; border: 2px solid #000; border-radius: 4px;
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; margin-right: 6px; cursor: pointer; flex-shrink: 0; font-size: 16px; padding: 0; line-height: 1;
    }
    .folder-add-btn:active { transform: scale(0.9); }

    /* 하위 퀘스트 계층 컨테이너 (여백 띄우기) */
    .subtasks-container { display: flex; flex-direction: column; gap: 4px; padding-left: 24px; margin-top: 2px; }
    .subtask-card { min-height: 36px !important; padding: 4px 6px !important; background: #8a705e !important; border: 2px solid #000 !important; }
    .subtask-card input { font-size: 11px !important; }

    /* 카드 내부에 배치되는 미니 상호작용 버튼들 */
    .mini-btn, .quiz-card button {
      flex-shrink: 0; position: relative; overflow: hidden; padding: 0.8dvh 1dvh; border: 2px solid black; border-radius: 10px;
      font-size: 1.1rem; font-weight: 700; color: white; line-height: 1; text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
      white-space: nowrap; 
    }
    
    /* 버튼 내부 하이라이트/빛 반사 이펙트 */
    .mini-btn::before { content: ""; position: absolute; left: 4px; right: 20px; top: 2px; width: 7px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.304); pointer-events: none; }
    
    /* 기능별 버튼 색상 */
    #Pdel { background: #31447c; } #Bstorage { background: #2eabe0; }
    #del { background: #c10707; box-shadow: inset 0 -1.5px 1px 1px rgba(0, 0, 0, 0.4), inset 0 0 1px 3px rgba(255, 129, 129, 0.323); }
    #suc { background: #FFBB00; box-shadow: inset 0 -1.5px 1px 1px rgba(0, 0, 0, 0.4), inset 0 0 1px 3px rgba(255, 200, 129, 0.45); }
    #Pdel:hover { background: #4169a9; } #Bstorage:hover { background: #26c5f5; } #del:hover { background: #dd0707; } #suc:hover { background: #ffe656; }

    /* 퀴즈 문제 전용 테마 스타일 (핑크색) */
    .quiz-card { position: relative; min-height: 44px; display: flex; flex-direction: column; padding: 6px; border: 2.5px solid #770b38; background: #ff5590; box-shadow: 0px 2px 1px 3px rgba(0, 0, 0, 0.25), inset 0px 0.3px 1px 2px rgba(10, 52, 8, 0.127); }
    .quiz-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .quiz-label { color: #a0052e; font-size: 12px; font-weight: 900; }
    .quiz-card button { position: absolute; background: #ff89b7; width: auto; height: 40px; right: 5px; top: 6px; box-shadow: inset 0 -1.5px 1px 1px rgba(215, 10, 103, 0.4), inset 0 0 1px 3px rgba(255, 156, 156, 0.323); }

    /* AI 자동생성 퀴즈 저장소 전용 테마 스타일 (파란색) */
    .storage-card { position: relative; min-height: 60px; display: flex; flex-direction: column; gap: 8px; padding: 8px; cursor: pointer; border: 3px solid #000000; background: #4e7ca1; box-shadow: 0px 2px 1px 3px rgba(0, 0, 0, 0.25), inset 0px 0.3px 1px 3px rgba(255, 255, 255, 0.111); }
    .storage-card:hover { background: #5589bd; }
    .storage-title { overflow: hidden; padding-right: 24px; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 800; color: white; text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black; }
    .storage-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; background: #84e0ff13; border-radius: 10px; }
    .storage-tag { padding: 2px 8px; border-radius: 999px; background: #3d6f98; font-size: 9px; box-shadow: inset 0px 1px 1px 1.8px rgba(0, 0, 0, 0.159); }
    .storage-actions { display: flex; gap: 4px; }

    /* 항목 추가 (새 퀘스트) 회색 버튼 상자 */
    .add-card { min-height: 44px; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: 1000; line-height: 1; flex-shrink: 0; padding: 8px; border: 3px solid rgba(0, 0, 0, 0.368); border-radius: 5px; background: rgba(0, 0, 0, 0.216); color: rgba(0,0,0,0.4); }

    /* 화면 우측 하단의 떠있는 타이머 진입 아이콘 */
    #open-timer-btn { position: absolute; right: 12px; bottom: 48px; z-index: 10; width: 40px; height: 100px; min-width: 40px; min-height: 40px; display: flex; justify-content: center; align-items: center; background: transparent !important; animation: bounceUpDown 1.2s ease-in-out infinite; }
    @keyframes bounceUpDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* 화면 최하단 하단 탭 바 영역 (일일퀘스트 / 퀴즈 퀘스트 스위칭) */
    #bottom-tab-bar { width: 100%; height: 40px; min-height: 40px; display: flex; flex-shrink: 0; margin-top: auto; border-top: 3px solid #000; background: #1B1613; box-shadow: inset 0px 1px 1px 3px rgba(42, 37, 34, 0.5); }
    .tab { flex: 1; display: flex; justify-content: center; align-items: center; color: #6b7280; font-size: 2vh; font-weight: 800; cursor: pointer; }
    
    /* 활성화된 하단 탭 스타일 */
    .tab.active { position: relative; border-right: 3px solid #000; color: #ffffff; background: #B46236; box-shadow: inset 0px 1px 1px 3px rgba(81, 66, 58, 0.5); border-radius: 10px; }
    #tab-storage.active { border-right: 0; border-left: 3px solid #000; background: #3668B4; }
    #tab-quest.active .tab-ui-highlight, #tab-storage.active .tab-ui-highlight { position: absolute; left: 8px; right: 8px; bottom: 6px; height: 30px; border-radius: 999px; background: rgba(255, 174, 174, 0.105); pointer-events: none; opacity: 1; }

    /* +XP 경험치 텍스트가 떠오르며 사라지는 효과 */
    @keyframes xpFloatUp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -90%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -220%) scale(1); } }

    /* 모달 내부 메모 목록 아이템 스타일 (클릭 시 확장 지원) */
    .memo-text {
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      cursor: pointer; 
      transition: background 0.2s; 
      padding: 2px; 
      border-radius: 4px;
      line-height: 1.4;
      color: #000;
    }
    .memo-text:hover { background: rgba(0,0,0,0.05); }
    .memo-text.expanded { white-space: pre-wrap; word-break: break-all; } /* 클릭으로 expanded 붙으면 전체 펼침 */

    /* ==========================================================================
       [8] 미디어 쿼리 - 반응형 최적화 (Mobile / Tablet / PC)
       ========================================================================== */
    /* 모바일 환경 대응 */
    @media (max-width: 767px) {
      .mobile-menu-open #left-panel { height: calc(100% - 56px); } /* 햄버거 메뉴 오픈 시 좌측 패널 확장 */
      .mobile-menu-open #right-panel-wrapper { flex: none; height: 56px; min-height: 56px; } /* 우측 패널 헤더만 남김 */
      .mobile-menu-open #bottom-tab-bar { display: none !important; }
    }

    @media (min-width: 640px) { #timer-display { font-size: 64px; letter-spacing: .05em; } }

    /* PC 데스크톱 및 태블릿 가로모드 환경 대응 */
    @media (min-width: 768px) {
      /* 앱 래퍼 자체를 가로 비율 5:3 형태의 모니터처럼 배치 */
      .app { max-width: calc(100vh * 1.6666); max-height: 99%; aspect-ratio: 5 / 3; flex-direction: row; gap: 6px; padding: 4px; box-shadow: 0 25px 50px #0004; }
      
      /* 좌우 패널 분할 (6:4 비율) */
      #left-panel { width: 60%; height: 100% !important; }
      #right-panel-wrapper { width: 40%; height: 100% !important; flex: 1 !important; }
      #mobile-toggle-btn { display: none; } /* PC에선 햄버거 버튼 불필요 */
      #bottom-tab-bar { display: flex !important; }

      /* 각종 폰트 및 요소 사이즈 PC 친화적으로 스케일 업 */
      .goal-title { font-size: 18px; color: white; text-shadow: -1.2px 0 black, 0 1.2px black, 1.2px 0 black, 0 -1.2px black; }
      .progress-wrap { width: 95%; height: 32px; }
      #progress-text { font-size: 12px; }

      #user-profile-card { width: 160px; padding: 8px; }
      .profile-name { font-size: 14px; }
      .profile-level { font-size: 12px; }
      .lobby-char { width: 42px; } 
      .char-nameplate { font-size: 13px; }
      .char-name-text { font-size: 13px; }
      .char-level-text { font-size: 11px; }
      .char-xp-bar-container { height: 5px; }
      .char-exclamation { top: -45px; width: 36px; height: 36px; font-size: 26px; }

      .round-close { top: 16px; left: 16px; width: 40px; height: 40px; border-width: 3px; }
      .timer-layout { justify-content: center; padding-top: 64px; padding-bottom: 40px; overflow: hidden; }
      .timer-top { margin-bottom: -15px; margin-top: 0; align-items: flex-end; width: 85%; max-width: 850px; }
      
      /* PC용 타이머 캐릭터 및 HUD 비례 렌더링 세팅 */
      .timer-character { width: 90px; position: relative; z-index: 10; }
      
      .timer-char-hud {
        width: 120px;
        margin-bottom: 6px;
      }
      .timer-char-hud-name {
        font-size: 13px;
      }
      .timer-char-hud-level {
        font-size: 11px;
      }
      .timer-char-hud-xpbar {
        width: 60px;
        height: 5px;
      }
      
      /* 레이아웃 여백 확보 및 패딩 증가 */
      #speech-bubble { max-width: 500px; margin-bottom: 80px; margin-right: 20px; position: relative; z-index: 15; }
      .bubble { border-width: 4px; padding: 30px 40px; font-size: 20px; border-radius: 40px; }
      .bubble::after { width: 18px; height: 18px; right: -11px; border-width: 4px; }
      
      .timer-card { width: 85%; max-width: 850px; margin-top: -10px; border-width: 7px; padding: 20px; gap: 16px; }
      .timer-display-wrap { min-height: 120px; padding: 10px 0; border-width: 4px; }
      #timer-display { font-size: 80px; }

      .preset-btn, #reset-timer-btn, #start-timer-btn { border-width: 3px; font-size: 16px; }
      .preset-btn { padding: 10px 0; width: 30%; }
      #reset-timer-btn { width: 20%; padding: 20px 0; font-size: 18px; }

      .modal-content { max-width: 85%; padding: 20px; gap: 12px; }

      .panel-title { padding-top: 4%; padding-bottom: 3%; font-size: 30px; color: white; text-shadow: -1.2px 0 black, 0 1.2px black, 1.2px 0 black, 0 -1.2px black; }

      .todo-card, .quiz-card, .add-card { min-height: 48px; }

      #open-timer-btn { right: 5%; bottom: 15%; width: 12%; max-width: 64px; max-height: 64px; aspect-ratio: 1; }
      #bottom-tab-bar { height: 10%; min-height: 48px; }
      .tab { font-size: 3vh; }
    }

    /* 1024px 이상 대화면 디스플레이 대응 */
    @media (min-width: 1024px) {
      .goal-title { font-size: 20px; }

<body>
  <!-- [앱 루트 영역] 전체 애플리케이션의 컨테이너를 담당합니다. -->
  <div class="app">

    <!-- [좌측 영역] 게임 시각화 및 타이머 컴포넌트가 위치하는 공간입니다. -->
    <div id="left-panel" class="panel">

  <!-- 
    ========================================================================== 
    [시스템 스크립트 파트 1] 데이터 상태 관리 (캐릭터 유니온 및 경험치)
    ========================================================================== 
  -->
  <script>
    (function () {
      'use strict';

      const MAX_LEVEL = 50; // 캐릭터 최대 상한 레벨 정의
      const STORAGE_KEY = 'questify_player_v3'; // localStorage 저장 식별자

      let state = {
        characters: [{ name: '기본 목표', level: 1, xp: 0, x: 50, y: 80, showExclamation: false }]
      };

      /**
       * 새로 생성되거나 오류난 캐릭터 데이터에 대하여 무작위 이미지 파츠와 색상을 할당하여 복구/생성합니다.
       * @param {Object} char - 캐릭터 데이터를 참조하는 객체
       */
      function initCharParts(char) {
        if (char.headType === undefined) char.headType = Math.floor(Math.random() * 5) + 1; 
        if (char.bottomType === undefined) char.bottomType = Math.floor(Math.random() * 2) + 1; 
        if (char.headColor === undefined) char.headColor = Math.floor(Math.random() * 360); 
        if (char.bottomColor === undefined) char.bottomColor = Math.floor(Math.random() * 360); 
      }

      const DOM = {}; // 전역적으로 재활용할 DOM 요소 캐싱 보관소

      /** 레벨업에 필요한 경험치를 반환합니다. 만렙 시 Infinity를 반환해 레벨업을 방지. */
      function getXpRequired(level) { return level >= MAX_LEVEL ? Infinity : 100; }
      
      /** 유니온 레벨 (모든 캐릭터의 레벨 총합) 계산 함수 */
      function getUnionLevel() { return state.characters.reduce((sum, char) => sum + char.level, 0); }

      /** 경험치 상승 텍스트 등 일시적인 애니메이션 이펙트를 화면에 띄우기 위한 별도의 빈 투명 레이어를 덮습니다. */
      function createFloatLayer() {
        const gameScreen = document.getElementById('game-screen');
        DOM.floatLayer = document.createElement('div');
        DOM.floatLayer.style.cssText = 'position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden;';
        gameScreen.appendChild(DOM.floatLayer);
      }

      /** UI 텍스트(유니온 랭크 수치) 및 캐릭터 렌더링 상태를 갱신 반영합니다. */
      function updateUI() {
        const unionElHUD = document.getElementById('union-level-hud');
        if (unionElHUD) unionElHUD.textContent = '유니온 Lv.' + getUnionLevel();
        if (typeof renderLobbyCharacters === 'function') renderLobbyCharacters();
      }

      /**
       * 캐릭터에게 경험치를 부여하고 필요하다면 레벨업 로직을 수행합니다.
       * @param {number} amount - 지급할 XP 획득량
       * @param {number} charIdx - 대상 캐릭터 배열 인덱스
       */
      function gainXP(amount, charIdx = 0) {
        if (charIdx >= state.characters.length) charIdx = 0;
        const char = state.characters[charIdx];

        if (char.level >= MAX_LEVEL) { showFloat('만렙 달성!', false, charIdx); return; }

        showFloat('+' + amount + ' XP', false, charIdx);
        char.xp += amount;

        // 지급된 경험치량이 최대치보다 크면 계속 빼면서 1씩 레벨업 처리 루프를 돌림
        while (char.level < MAX_LEVEL && char.xp >= getXpRequired(char.level)) {
          char.xp -= getXpRequired(char.level);
          char.level++;
          showFloat('Lv.' + char.level + ' 달성!', true, charIdx);
        }

        if (char.level >= MAX_LEVEL) char.xp = 0; // 초과 잉여경험치 소멸
        updateUI();
        save();
      }

      /**
       * 해당 캐릭터의 시각적 위치 위에 떠올랐다 사라지는 텍스트 플로팅 텍스트 이펙트 실행
       * @param {string} text - 표시할 문구
       * @param {boolean} isLevelUp - 일반 텍스트가 아닌 레벨업 전용 효과 파라미터 판단여부
       */
      function showFloat(text, isLevelUp, charIdx = 0) {
        if (!DOM.floatLayer) return;
        const charEl = document.querySelector(`.lobby-char[data-idx="${charIdx}"]`);
        let left = '50%', top = '50%';
        if (charEl) {
          left = charEl.style.left;
          top = charEl.style.top;
        }

        const el = document.createElement('div');
        el.textContent = text;
        // Float 텍스트 인라인 스타일 동적 삽입
        el.style.cssText = `position:absolute; left:${left}; top:${top}; transform:translate(-50%,-100%); font-size:${isLevelUp ? '24px' : '16px'}; font-weight:900; color:${isLevelUp ? '#2563eb' : '#111'}; text-shadow:1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff; white-space:nowrap; animation:xpFloatUp 1.4s ease-out forwards;`;
        DOM.floatLayer.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }

      /** 현재 state의 캐릭터/경험치 현황을 로컬 스토리지에 동기화 저장합니다. */
      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

      /** 로컬스토리지에서 데이터를 읽어와 복구 및 파싱하고 깨진 경우 보정하여 다시 저장합니다. */
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          let needsSave = false; 
          if (raw) {
            const loadedState = JSON.parse(raw);
            if (loadedState.characters && loadedState.characters.length > 0) {
              state.characters = loadedState.characters;
              state.characters.forEach(c => {
                if (typeof c.x !== 'number' || isNaN(c.x)) { c.x = 50; needsSave = true; } // 위치값 좌표 손실 복구
                if (typeof c.y !== 'number' || isNaN(c.y)) { c.y = 80; needsSave = true; }
                if (c.headType === undefined) needsSave = true; 
                initCharParts(c); 
              });
            } else { needsSave = true; }
          } else {
             state.characters.forEach(c => initCharParts(c)); 
             needsSave = true;
          }
          if (needsSave) save(); 
        } catch (e) { console.warn('Init error', e); }
      }

      // 다른 스크립트 블록이나 모듈에서 접근할 수 있도록 캡슐화된 메서드를 전역 window 객체에 노출합니다.
      window.Questify = {
        gainXP, getUnionLevel, getXpRequired, getCharacters: () => state.characters, saveState: save,
        updateUI: updateUI, initCharParts: initCharParts,
        reset() {
          localStorage.removeItem(STORAGE_KEY);
          state = { characters: [{ name: '기본 목표', level: 1, xp: 0, x: 50, y: 80, showExclamation: false }] };
          state.characters.forEach(c => initCharParts(c));
          save(); 
          updateUI();
        }
      };

      createFloatLayer();
      load();
      setTimeout(updateUI, 50); // DOM이 그려진 후 지연 업데이트 호출
    })();
  </script>

  <!-- 
    ========================================================================== 
    [시스템 스크립트 파트 2] 앱 메인 인터페이스 및 DOM 조작 로직
    ========================================================================== 
  -->
  <script>
    /* --------------------------------------------------------------------------
       [2-1] 커스텀 다이얼로그 (브라우저 Native Alert/Confirm/Prompt 우회 기능)
       -------------------------------------------------------------------------- */
    let customAlertCb, customConfirmCb, customPromptCb, customSelectCb;
    const dialogOverlay = document.getElementById('dialog-overlay');

    /** 열려있는 다이얼로그 숨김 */
    function closeAllDialogs() { document.querySelectorAll('#dialog-overlay .modal-content').forEach(m => m.classList.add('hidden')); }
    
    /** 특정 ID값의 다이얼로그만 단독으로 표시 및 배경 어둡게 설정 */
    function openSpecificDialog(dialogId) { dialogOverlay.classList.remove('hidden'); closeAllDialogs(); document.getElementById(dialogId).classList.remove('hidden'); }

    // Custom Alert 함수화 연동
    window.showCustomAlert = function (msg, callback) { document.getElementById('custom-alert-msg').innerText = msg; customAlertCb = callback; openSpecificDialog('custom-alert'); }
    document.getElementById('custom-alert-btn').onclick = () => { dialogOverlay.classList.add('hidden'); if (customAlertCb) customAlertCb(); }

    // Custom Confirm 함수화 연동
    window.showCustomConfirm = function (msg, onConfirm) { document.getElementById('custom-confirm-msg').innerText = msg; customConfirmCb = onConfirm; openSpecificDialog('custom-confirm'); }
    document.getElementById('custom-confirm-cancel').onclick = () => dialogOverlay.classList.add('hidden');
    document.getElementById('custom-confirm-ok').onclick = () => { dialogOverlay.classList.add('hidden'); if (customConfirmCb) customConfirmCb(); }

    // Custom Prompt (텍스트 입력) 함수화 연동
    window.showCustomPrompt = function (title, defaultVal, onConfirm) {
      document.getElementById('custom-prompt-title').innerText = title;
      const input = document.getElementById('custom-prompt-input'); 
      input.value = defaultVal || ''; 
      customPromptCb = onConfirm;
      openSpecificDialog('custom-prompt'); 
      
      // 모달 표시와 동시에 인풋 창에 자동 포커스 주입 (키보드 띄우기)
      setTimeout(() => { 
        input.focus(); 
        const val = input.value;
        input.value = '';
        input.value = val;
        input.setSelectionRange(val.length, val.length);
      }, 50);
    }
    document.getElementById('custom-prompt-cancel').onclick = () => dialogOverlay.classList.add('hidden');
    document.getElementById('custom-prompt-ok').onclick = () => {
      const val = document.getElementById('custom-prompt-input').value; dialogOverlay.classList.add('hidden'); if (customPromptCb) customPromptCb(val);
    }

    // Custom Select (콤보박스 선택) 함수화 연동
    window.showCustomSelect = function (title, msg, options, onConfirm) {
      document.getElementById('custom-select-title').innerText = title; document.getElementById('custom-select-msg').innerText = msg;
      const select = document.getElementById('custom-select-input'); select.innerHTML = '';
      options.forEach(opt => { const el = document.createElement('option'); el.value = opt.value; el.innerText = opt.text; select.appendChild(el); });
      customSelectCb = onConfirm; openSpecificDialog('custom-select');
    }
    document.getElementById('custom-select-ok').onclick = () => {
      const val = document.getElementById('custom-select-input').value; dialogOverlay.classList.add('hidden'); if (customSelectCb) customSelectCb(val);
    }

    // 모달 배경인 오버레이 클릭 시 닫히도록 적용
    dialogOverlay.addEventListener('click', (e) => { if (e.target === dialogOverlay) dialogOverlay.classList.add('hidden'); });

    /* --------------------------------------------------------------------------
       [2-2] 메인 모달 (학습, 메모, 퀴즈, 슬롯 관리 팝업창 등) 오버레이 제어
       -------------------------------------------------------------------------- */
    const modalOverlay = document.getElementById('modal-overlay');

    function closeAllCustomModals() { document.querySelectorAll('#modal-overlay .modal-content').forEach(m => m.classList.add('hidden')); }
    function openSpecificModal(modalId) { modalOverlay.classList.remove('hidden'); closeAllCustomModals(); document.getElementById(modalId).classList.remove('hidden'); }

    // X 닫기 버튼 바인딩 및 모달 상태 초기화 연동
    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => { modalOverlay.classList.add('hidden'); currentActiveQuiz = null; editingMemoId = null; });
    });
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) { modalOverlay.classList.add('hidden'); currentActiveQuiz = null; editingMemoId = null; }
    });

    /* --------------------------------------------------------------------------
       [2-3] 핵심 앱 콘텐츠 데이터 (할 일/메모/문제 저장소) 선언 및 로드
       -------------------------------------------------------------------------- */
    const APP_DATA_KEY = 'questify_app_data_v5';

    let todoList = [];       // 사용자가 작성한 일일 퀘스트 및 하위 목표 기록 저장 배열
    let memoStorage = [];    // 캐릭터별 학습 메모 데이터 저장 배열
    let quizStorage = [];    // AI가 자동 생성한 문제 보관소 배열

    let currentActiveQuiz = null;   
    let targetCharIdxForMemo = 0;   // 신규 메모 작성 대상이 될 캐릭터 인덱스를 기록
    let editingMemoId = null;       // 기존 메모 수정 작업 시 원본 아이디 기록 식별자
    let isDraggingTodoItem = false; // 드래그 앤 드롭 중단 여부 플래그
    let isLogView = false;          // 우측 패널의 상태 (기본 일일목표 화면인가, 완료된 로그 화면인가)
    let isGeneratingQuiz = false;   // API 콜이 꼬이는것을 막기 위한 동시성 제어 통제 플래그

    /** 따옴표/꺾쇠 등으로 인해 발생할 수 있는 스크립트 충돌 방지용 텍스트 Escape 함수 */
    function escapeHTML(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }

    /** 로컬스토리지에 저장된 데이터를 복원 및 구조화. 자정 초기화 기능 포함. */
    function loadAppData() {
      try {
        const data = localStorage.getItem(APP_DATA_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          todoList = parsed.todoList || [];
          quizStorage = parsed.quizStorage || [];
          memoStorage = parsed.memoStorage || [];

          // 날짜 변경 시, 어제 완료된 목표를 로그 목록에는 놔둔 채 '진행도 프로그레스 바 0/0 산출'을 위해 과거 기록 플래그 삽입
          const today = new Date().toLocaleDateString();
          if (parsed.lastDate && parsed.lastDate !== today) {
              todoList.forEach(t => {
                  if (t.status === 'clear' || t.isHiddenInLog) t.isPastLog = true;
                  if (t.subtasks) {
                      t.subtasks.forEach(s => {
                          if (s.status === 'clear' || s.isHiddenInLog) s.isPastLog = true;
                      });
                  }
              });
              saveAppData(); // 속성 삽입 변경사항 반영
          }
        }
      } catch (e) { }
    }

    /** 변경된 핵심 데이터 JSON 직렬화 및 저장 (자정 검사를 위한 lastDate 스탬프 포함) */
    function saveAppData() { 
      localStorage.setItem(APP_DATA_KEY, JSON.stringify({ 
        todoList, 
        quizStorage, 
        memoStorage,
        lastDate: new Date().toLocaleDateString() 
      })); 
    }

    /** 화면의 모든 요소들을 데이터 상태에 기반해 완전히 새롭게 DOM으로 다시 그립니다. */
    function renderAll() {
      renderTodoList();
      renderStorageList();
      updateProgressBar();
      saveAppData();
      syncExclamations(); 
      if (window.Questify) window.Questify.updateUI(); 
    }

    /* --------------------------------------------------------------------------
       [2-4] 일일 퀘스트 & 폴더(하위 퀘스트) & 로그(기록) 렌더링 및 기능 정의
       -------------------------------------------------------------------------- */
    // 상단 "로그 / 목록" 보기 토글 버튼 클릭 처리
    document.getElementById('btn-toggle-log').addEventListener('click', () => {
      isLogView = !isLogView; // 반전 시키기
      document.getElementById('quest-panel-title').innerText = isLogView ? '완료 기록' : '일일퀘스트';
      const btn = document.getElementById('btn-toggle-log');
      btn.innerText = isLogView ? '목록' : '로그';
      btn.style.background = isLogView ? '#2563eb' : '#555';
      
      const clearBtn = document.getElementById('btn-clear-log');
      if(isLogView) clearBtn.classList.remove('hidden'); // 로그 뷰 일때만 비우기 버튼 노출
      else clearBtn.classList.add('hidden');

      renderTodoList();
    });

    // 로그 비우기 버튼 클릭 처리 (완전히 데이터를 지우는게 아니라 사용자 눈에만 감추기 위한 히든 속성 추가)
    document.getElementById('btn-clear-log').addEventListener('click', () => {
      showCustomConfirm('모든 로그 기록을 비우시겠습니까?\n(경험치 및 오늘의 목표 달성도는 보존됩니다.)', () => {
        todoList.forEach(item => {
          if (item.status === 'clear') item.isHiddenInLog = true;
          if (item.subtasks) {
            item.subtasks.forEach(s => { if (s.status === 'clear') s.isHiddenInLog = true; });
          }
        });
        renderAll();
      });
    });

    function renderTodoList() {
      const container = document.getElementById('quest-list-container');
      container.innerHTML = '';

      const todos = todoList.filter(item => item.type === 'todo');
      let displayTodos = [];

      // 현재 뷰 상태에 따라 그릴 배열 추려내기
      if (isLogView) {
        displayTodos = todos.filter(item => item.status === 'clear' && !item.isHiddenInLog);
      } else {
        displayTodos = todos.filter(item => item.status !== 'clear');
        
        // 목록 뷰의 맨 상단에 항상 새 항목 추가(+) 버튼 렌더링
        const addBtn = document.createElement('button');
        addBtn.className = 'add-card';
        addBtn.innerHTML = '<span>+</span>';
        addBtn.style.position = 'sticky';
        addBtn.style.top = '0';
        addBtn.style.zIndex = '10';
        addBtn.style.marginBottom = '8px';
        addBtn.style.backdropFilter = 'blur(8px)'; 
        addBtn.style.WebkitBackdropFilter = 'blur(8px)';
        addBtn.onclick = () => {
          const newId = Date.now();
          // 빈 아이템 삽입 및 편집모드 켜기
          todoList.push({ id: newId, type: 'todo', title: '', status: 'ready', isEditing: true });
          renderAll();
        };
        container.appendChild(addBtn);
      }

      // 각 카드 아이템 돔 생성 및 속성 정의 
      displayTodos.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'todo-item-wrapper draggable-todo-item';
        wrapper.dataset.id = item.id;
        wrapper.style.display = 'flex';
        wrapper.style.flexDirection = 'column';
        wrapper.style.gap = '4px';
        wrapper.style.marginBottom = '4px';

        const isEditing = item.isEditing ? true : false;
        
        // 편집중이 아니거나 로그뷰가 아니라면 드래그 이벤트 활성화
        if (!isLogView && !isEditing && item.status !== 'clear') {
          wrapper.setAttribute('draggable', 'true');
          wrapper.addEventListener('dragstart', handleDragStart);
          wrapper.addEventListener('dragover', handleDragOver);
          wrapper.addEventListener('drop', handleDrop);
          wrapper.addEventListener('dragend', handleDragEnd);
        }

        const card = document.createElement('div');
        card.className = 'todo-card' + (item.status === 'clear' ? ' clear' : '');
        card.dataset.id = item.id;
        card.dataset.status = item.status;

        // 클릭 이벤트 연결
        if (!isLogView) {
          card.onclick = (e) => onCardClick(e, item.id);
          card.ondblclick = (e) => onCardDblClick(e, item.id);
        } else {
          card.onclick = (e) => onLogCardClick(e, item.id);
        }

        const placeholder = isEditing ? '내용을 적고 Enter' : '';
        const isEditingAttr = isEditing ? '' : 'readonly';
        const cursorStyle = isEditing ? 'text' : 'pointer';
        
        // 카드 내부 구조 조립 (HTML 스트링 파싱)
        let innerHTML = `<div style="display:flex; align-items:center; width:100%; overflow:hidden;">`;

        if (!isLogView) {
          // 일일퀘스트 목록에서의 UI
          innerHTML += `<span class="drag-handle" style="cursor:grab;">≡</span>`;
          innerHTML += `<button class="folder-add-btn" onclick="handleAddSubtask(event, ${item.id})">+</button>`;
        } else {
          // 로그뷰에서의 UI (하위 퀘스트 존재 시 토글 십자 기호)
          if (item.subtasks && item.subtasks.length > 0) {
            innerHTML += `<span style="margin-right:8px; color:gray; font-size:18px;">${item.isExpanded ? '-' : '+'}</span>`;
          }
        }

        // 인라인 텍스트 편집 인풋 구역
        innerHTML += `
          <div class="text-area-wrapper" style="display:flex; flex-direction:column; width:100%; cursor: ${cursorStyle}; pointer-events: none;">
            <input type="text" class="inline-todo-input" value="${escapeHTML(item.title || '')}" ${isEditingAttr} placeholder="${placeholder}"
              onblur="saveTodoTitle(${item.id}, this.value)"
              onkeydown="if(event.key==='Enter') this.blur()"
              style="pointer-events: ${isEditing ? 'auto' : 'none'};">
          </div>
        </div>`;

        // 카드 우측 조작 버튼 구역 (성공/삭제)
        innerHTML += `<div style="display:flex; gap:4px; flex-shrink:0; margin-left:8px;">`;
        if (!isLogView) {
          const hasSubtasks = item.subtasks && item.subtasks.length > 0;
          const sucBtnText = hasSubtasks ? '전체 성공' : '성공';
          innerHTML += `<button onclick="event.stopPropagation(); handleTodoAction(${item.id}, 'clear')" id="suc" class="mini-btn"><span>${sucBtnText}</span></button>
                        <button onclick="event.stopPropagation(); handleTodoAction(${item.id}, 'delete')" id="del" class="mini-btn"><span>삭제</span></button>`;
        } else {
          innerHTML += `<button onclick="event.stopPropagation(); handleTodoAction(${item.id}, 'delete')" id="del" class="mini-btn"><span>삭제</span></button>`;
        }
        innerHTML += `</div>`;

        card.innerHTML = innerHTML;

        // 편집 활성화 시, input 포커싱 및 텍스트 선택 꼬임 방지 트릭
        if (!isLogView && isEditing) {
          setTimeout(() => {
            const input = card.querySelector('.inline-todo-input');
            if (input) {
              input.focus();
              const val = input.value;
              input.value = '';
              input.value = val;
              input.setSelectionRange(val.length, val.length);
            }
          }, 10);
        }

        wrapper.appendChild(card);

        // 하위 퀘스트 렌더링 계층 구성
        if (item.subtasks && item.subtasks.length > 0 && item.isExpanded) {
          const subContainer = document.createElement('div');
          subContainer.className = 'subtasks-container';
          
          item.subtasks.forEach(sub => {
            if (isLogView && sub.isHiddenInLog) return;

            const subCard = document.createElement('div');
            subCard.className = 'todo-card subtask-card' + (sub.status === 'clear' ? ' clear' : '');
            
            const subIsEditing = sub.isEditing ? true : false;
            const subIsEditingAttr = subIsEditing ? '' : 'readonly';
            const subPlaceholder = subIsEditing ? '하위 목표 입력' : '';
            
            let subHTML = `<div style="display:flex; align-items:center; width:100%; overflow:hidden;">`;
            subHTML += `<span style="color: rgba(255,255,255,0.5); font-weight: 800; margin-right: 6px; font-size: 14px;">└</span>`; // 들여쓰기 꼬리 기호
            
            subHTML += `<div class="text-area-wrapper" style="display:flex; flex-direction:column; width:100%; cursor: ${subIsEditing ? 'text' : 'pointer'}; pointer-events: none;">
              <input type="text" class="inline-todo-input" value="${escapeHTML(sub.title || '')}" ${subIsEditingAttr} placeholder="${subPlaceholder}"
                onblur="saveSubtaskTitle(${item.id}, ${sub.id}, this.value)"
                onkeydown="if(event.key==='Enter') this.blur()"
                style="pointer-events: ${subIsEditing ? 'auto' : 'none'};">
            </div></div>`;
            
            subHTML += `<div style="display:flex; gap:4px; flex-shrink:0; margin-left:8px;">`;
            
            if (!isLogView && sub.status !== 'clear') {
              subHTML += `<button onclick="event.stopPropagation(); handleSubtaskAction(${item.id}, ${sub.id}, 'clear')" id="suc" class="mini-btn" style="padding: 4px 6px; font-size: 11px;">성공</button>
                          <button onclick="event.stopPropagation(); handleSubtaskAction(${item.id}, ${sub.id}, 'delete')" id="del" class="mini-btn" style="padding: 4px 6px; font-size: 11px;">삭제</button>`;
            } else if (!isLogView && sub.status === 'clear') {
               subHTML += `<span style="color: white; opacity: 50%; font-size:10px;">성공</span>`;
               subHTML += `<button onclick="event.stopPropagation(); handleSubtaskAction(${item.id}, ${sub.id}, 'delete')" id="del" class="mini-btn" style="padding: 4px 6px; font-size: 11px; margin-left:4px;">삭제</button>`;
            } else if (isLogView) {
               subHTML += `<button onclick="event.stopPropagation(); handleSubtaskAction(${item.id}, ${sub.id}, 'delete')" id="del" class="mini-btn" style="padding: 4px 6px; font-size: 11px;">삭제</button>`;
            }
            subHTML += `</div>`;
            
            subCard.innerHTML = subHTML;
            
            if (!isLogView) {
              subCard.ondblclick = (e) => onSubCardDblClick(e, item.id, sub.id);
            }
            
            if (!isLogView && subIsEditing) {
              setTimeout(() => {
                const subInput = subCard.querySelector('.inline-todo-input');
                if (subInput) {
                  subInput.focus();
                  const val = subInput.value;
                  subInput.value = '';
                  subInput.value = val;
                  subInput.setSelectionRange(val.length, val.length);
                }
              }, 10);
            }
            
            subContainer.appendChild(subCard);
          });
          
          wrapper.appendChild(subContainer);
        }

        container.appendChild(wrapper);
      });

    window.handleAddSubtask = function(e, parentId) {

    window.onSubCardDblClick = function(e, parentId, subId) {
      e.preventDefault();
      if (window.getSelection) window.getSelection().removeAllRanges();

      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      const sub = item.subtasks.find(s => s.id === subId);
      if (!sub || sub.status === 'clear') return;
      if (!sub.isEditing) {
        sub.isEditing = true;
        renderAll();
      }

    window.saveSubtaskTitle = function(parentId, subId, newTitle) {
      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      const subIdx = item.subtasks.findIndex(s => s.id === subId);
      if (subIdx === -1) return;
      
      if (newTitle.trim() === '') {
        item.subtasks.splice(subIdx, 1);
      } else {
        item.subtasks[subIdx].title = newTitle.trim();
        delete item.subtasks[subIdx].isEditing;
      }
      renderAll();
    };

    /** 성공 및 삭제 등의 기능 버튼 액션 시 작동 */
    window.handleSubtaskAction = function(parentId, subId, action) {
      const item = todoList.find(t => t.id === parentId);
      if (!item) return;
      const subIdx = item.subtasks.findIndex(s => s.id === subId);
      if (subIdx === -1) return;
      
      if (action === 'clear') {
        item.subtasks[subIdx].status = 'clear';
        // 하위 퀘스트 완료 시 소량의 경험치 지급 처리
        const chars = window.Questify.getCharacters();
        chars.forEach((c, i) => { window.Questify.gainXP(5, i); });
        
        // 모든 하위 퀘스트가 끝났다면, 부모 퀘스트도 클리어 처리하여 대량 보상 부여
        const allClear = item.subtasks.every(s => s.status === 'clear');
        if (allClear) {
          item.status = 'clear';
          chars.forEach((c, i) => { window.Questify.gainXP(20, i); }); 
        }
      } else if (action === 'delete') {
        if (isLogView) {
          item.subtasks[subIdx].isHiddenInLog = true;
        } else {
          item.subtasks.splice(subIdx, 1);
        }
      }
      renderAll();
    };

    window.saveTodoTitle = function (id, newTitle) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;
      if (newTitle.trim() === '') todoList.splice(idx, 1);
      else {
        todoList[idx].title = newTitle.trim();
        delete todoList[idx].isEditing;
      }
      renderAll();
    };

    window.makeTodoEditable = function (id) {
      const idx = todoList.findIndex(item => item.id === id);

      }

    /** 데이터 기반으로 현재 오늘의 목표 게이지(진척도)를 퍼센티지로 계산하여 바에 그리는 함수 */
    function updateProgressBar() {
      // isPastLog 속성이 활성화된 과거 데이터는 계산에서 제외시킵니다 (매일 목표 0 초기화 지원)
      const todos = todoList.filter(item => item.type === 'todo' && !item.isPastLog);
      const total = todos.length;
      const clears = todos.filter(item => item.status === 'clear').length;
      const percent = total > 0 ? (clears / total) * 100 : 0;
      document.getElementById('progress-bar-fill').style.width = percent + '%';
      document.getElementById('progress-text').innerText = clears + '/' + total;
    }

    window.handleTodoAction = function (id, action) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;

      if (action === 'clear') {
        todoList[idx].status = 'clear';
        // 하위항목이 있다면 일괄 완료 판정 지시
        if (todoList[idx].subtasks) {

        }
        const chars = window.Questify.getCharacters();
        chars.forEach((c, i) => {

        });

      if (action === 'delete') {
        if (isLogView) {
          todoList[idx].isHiddenInLog = true;
          if (todoList[idx].subtasks) {
            todoList[idx].subtasks.forEach(sub => sub.isHiddenInLog = true);
          }
        } else {
          todoList.splice(idx, 1);
        }
      }
      renderAll();
    };

    /** (가이드 4-B) LLM 응답 포맷의 불확실성 대응 - 강건한 JSON 클렌징 함수 */
    function cleanAndParseJSON(rawText) {
      try {
        // [ ] 배열 구조로 정확히 떨어지는 텍스트 묶음만 검출
        const match = rawText.match(/\[[\s\S]*\]/);
        if (match) return JSON.parse(match[0]);

        // 간혹 { } 객체로 리턴될 경우를 대비한 보험 정규식
        const objMatch = rawText.match(/\{[\s\S]*\}/);
        if (objMatch) return [JSON.parse(objMatch[0])];

        throw new Error("JSON 배열 형식을 찾을 수 없습니다.");
      } catch (e) {
        console.error("JSON 파싱 에러:", e, "원본:", rawText);
        throw e; // 호출부의 catch 블록으로 이동하여 에러 핸들링
      }
    }

    /** (가이드 2-A) Google Gemini Flash API와 직접 통신하여 사용자가 작성한 노트를 분석, 퀴즈를 반환받습니다. */
    async function fetchQuizFromGemini(text, type = 'short') {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) return null; // API키 미등록 시 통신 중단 처리

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      let typeStr = '';
      let formatGuide = '';
      
      if (type === 'ox') {
        typeStr = '진위형 (O/X)';
        formatGuide = '{"id": 1, "title": "문제 제목", "content": "질문 내용", "answer": "O", "explanation": "왜 정답인지에 대한 해설"}';
      } else if (type === 'multiple') {
        typeStr = '객관식 4지선다형';
        formatGuide = '{"id": 1, "title": "문제 제목", "content": "질문 내용", "options": ["보기1", "보기2", "보기3", "보기4"], "answer": "정답이 되는 보기 텍스트 정확히 일치", "explanation": "왜 정답인지에 대한 해설"}';
      } else {
        typeStr = '주관식 단답형';
        formatGuide = '{"id": 1, "title": "문제 제목", "content": "질문 내용", "answer": "정답", "explanation": "해설 내용"}';
      }

      const systemPrompt = `너는 입력받은 학습 노트를 바탕으로 학습 퀴즈를 생성하는 AI다.
[지시사항]
1. 문제 유형: ${typeStr}
2. 난이도: 보통, 생성 문항 수: 1
3. 순수 JSON 배열만 반환하라. 예: [${formatGuide}]
주의사항: 모든 문제 유형에 대해 'explanation' 필드에 친절한 해설을 1~2문장으로 반드시 포함하라. 객관식의 경우 'options' 배열에 4개의 보기를 제공하고 'answer'에는 정답 보기의 텍스트를 정확히 적어라. O/X 문제일 경우 answer는 반드시 "O" 또는 "X" 여야 한다.`;
      
      const userPrompt = `학습 노트:\n${text}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (!response.ok) throw new Error('Gemini API 통신 에러');
        const resData = await response.json();

        // Gemini Response 구조 심층 탐색
        const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) return null;
        return cleanAndParseJSON(rawText);
      } catch (error) {
        // (가이드 4-D) API 실패 시 Mock 데이터 대신 null 반환하여 조용히 건너뛰기
        console.error("Gemini 연동 실패:", error);
        return null; 
      }
    }
    
    /** Gemini API를 사용한 주관식 AI 채점 및 해설 생성 */
    async function gradeWithAI(question, correctAnswer, userAnswer) {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) return null; // API키 미등록 시 통신 중단 처리, 폴백(단순 비교)으로 넘어갑니다.

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const systemPrompt = `너는 학생의 주관식 답변을 유연하게 채점하는 AI 선생님이다.
[지시사항]
1. 문제, 모범 정답, 그리고 학생의 제출 답안이 주어진다.
2. 학생의 답안이 의미상 모범 정답과 일치하거나 핵심을 포함하여 정답으로 인정할 만하면 정답 처리하라. 오타, 유의어, 조사의 차이 등은 유연하게 허용하라.
3. 순수 JSON 객체만 반환하라. 예: {"isCorrect": true, "explanation": "해설 내용"}
4. isCorrect는 boolean(true/false)이다. explanation에는 왜 맞았는지 또는 왜 틀렸는지 친절하게 1~2문장으로 설명하라.`;
      
      const userPrompt = `문제: ${question}\n모범 정답: ${correctAnswer}\n학생 답안: ${userAnswer}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (!response.ok) throw new Error('Gemini API 통신 에러');
        const resData = await response.json();
        const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (!rawText) return null;
        
        // JSON 파싱 (객체 추출)
        const match = rawText.match(/\{[\s\S]*\}/);
        if (match) {
            return JSON.parse(match[0]);
        }
        return null;
      } catch (error) {
        console.error("AI 채점 실패:", error);
        return null;
      }
    }

    /** 캐릭터에 퀴즈가 누적되어 있으면 머리 위에 빨간색 느낌표를 띄우기 위한 상태 동기화 관리 함수 */
    function syncExclamations() {
      const chars = window.Questify.getCharacters(); let needsUpdate = false;
      chars.forEach((c, idx) => {
        const charQuizzes = quizStorage.filter(q => q.charIdx === idx);
        if (charQuizzes.length === 0 && c.showExclamation) { c.showExclamation = false; needsUpdate = true; }
        else if (charQuizzes.length > 0 && !c.showExclamation) { c.showExclamation = true; needsUpdate = true; }
      });

    // AI 자동 퀴즈 생성 타이머 - 15초 마다 확률적으로 조건 검사 및 생성 지시
    setInterval(async () => {

        const chars = window.Questify.getCharacters(); const targetChar = chars[randomMemo.charIdx];
        const alreadyHasQuiz = quizStorage.some(q => q.charIdx === randomMemo.charIdx);

        if (targetChar && !targetChar.showExclamation && !alreadyHasQuiz) {
          isGeneratingQuiz = true; // 다중 콜 방지 락 걸기
          
          // 랜덤으로 OX, 객관식, 주관식 타입 결정 (33%씩)

      }
    }, 15000);

    /** (가이드 5-A) 퀴즈 풀이용 모달 창 제어 컴포넌트 - OX UI 스위칭 로직 포함 */

    /** (가이드 5-B) 통합 채점 로직 처리 - AI 유연한 채점 및 해설 제공 기능 추가 */
    async function processGrading(userAnswer) {
      if (!currentActiveQuiz) return;

      const resultBox = document.getElementById('solve-result-state'); 
      const inputState = document.getElementById('solve-input-state');
      
      // 채점 중 UI 표시 (AI 통신 지연 대비)

      resultBox.onclick = null;

      const cleanUserAnswer = String(userAnswer).trim().toLowerCase();
      const cleanCorrectAnswer = String(currentActiveQuiz.answer).trim().toLowerCase();

      let isCorrect = false;
      let explanation = "";

      // OX 및 객관식 문제는 단순 비교로 즉시 채점
      if (currentActiveQuiz.type === 'ox' || currentActiveQuiz.type === 'multiple') {
         isCorrect = (cleanUserAnswer === cleanCorrectAnswer);
         explanation = currentActiveQuiz.explanation || ""; // 생성 시 저장된 해설 사용
      } else {
         // 주관식의 경우 AI 유연 채점 시도
         const aiResult = await gradeWithAI(currentActiveQuiz.content, currentActiveQuiz.answer, userAnswer);
         if (aiResult !== null) {
            isCorrect = aiResult.isCorrect;
            // 유연 채점 시 생성된 해설이 있다면 우선 사용, 없으면 문제 생성 시 저장한 해설 사용
            explanation = aiResult.explanation || currentActiveQuiz.explanation || "";
         } else {
            // API 실패나 키가 없는 경우 기존처럼 단순 비교 (Fallback)
            isCorrect = (cleanUserAnswer === cleanCorrectAnswer);
            explanation = currentActiveQuiz.explanation || "";
         }
      }

      // 오답일 경우 처리
      if(!isCorrect) {
          resultBox.className = 'result-bad'; 
          resultBox.innerHTML = `
            <div style="margin-bottom: 12px; font-size: 16px;">❌ 틀렸습니다!</div>
            <div style="display:flex; gap: 8px; width: 100%;">
              <button id="btn-retry" class="submit-btn" style="flex:1; font-size: 14px; padding: 8px; background: #fca5a5; color: #7f1d1d; border: 2px solid #7f1d1d;">다시 풀기</button>
              <button id="btn-show-answer" class="submit-btn" style="flex:1; font-size: 14px; padding: 8px; background: #ef4444; color: #fff; border: 2px solid #7f1d1d;">정답 보기</button>
            </div>
          `;
          
          // [다시 풀기] 버튼 클릭 시 입력창으로 돌아감
          document.getElementById('btn-retry').onclick = () => {
              inputState.classList.remove('hidden');
              resultBox.classList.add('hidden');
          };

          // [정답 보기] 버튼 클릭 시 정답 확인 및 문제 완료/삭제 처리
          document.getElementById('btn-show-answer').onclick = () => {
              resultBox.innerHTML = `
                <div style="margin-bottom: 8px;">내가 쓴 답: ${escapeHTML(userAnswer)}</div>
                <div style="color: #b91c1c; font-weight: 900; font-size: 16px; margin-bottom: 12px;">정답: ${escapeHTML(currentActiveQuiz.answer)}</div>
                ${explanation ? `<div style="margin-bottom: 12px; font-size: 13px; color: #7f1d1d; text-align: left; padding: 8px; background: rgba(255,255,255,0.5); border-radius: 8px;"><b>AI 해설:</b> ${escapeHTML(explanation)}</div>` : ''}
                <button id="btn-close-quiz" class="submit-btn" style="width: 100%; font-size: 14px; padding: 8px;">확인 (닫기)</button>
              `;
              document.getElementById('btn-close-quiz').onclick = () => {
                  quizStorage = quizStorage.filter(q => q.id !== currentActiveQuiz.id); 
                  syncExclamations(); 
                  renderAll();
                  document.getElementById('modal-overlay').classList.add('hidden');
                  currentActiveQuiz = null;
              };
          };
          return;
      }

      // 정답일 경우 처리
      resultBox.className = 'result-good'; 
      resultBox.innerHTML = `
        <div style="margin-bottom: 12px; font-size: 16px;">✅ 정답입니다! 🎉 경험치를 획득했습니다.</div>
        ${explanation ? `<div style="margin-bottom: 12px; font-size: 13px; color: #15803d; text-align: left; padding: 8px; background: rgba(255,255,255,0.5); border-radius: 8px;"><b>AI 해설:</b> ${escapeHTML(explanation)}</div>` : ''}
        <button id="btn-close-quiz-success" class="submit-btn" style="width: 100%; font-size: 14px; padding: 8px; background: #22c55e;">확인 (닫기)</button>
      `;
      
      // 로비 느낌표 서프라이즈 풀이일 경우 30XP로 경험치 가중치 부여
      if (window.Questify) window.Questify.gainXP(currentActiveQuiz.isSurprise ? 30 : 20, currentActiveQuiz.charIdx);
      quizStorage = quizStorage.filter(q => q.id !== currentActiveQuiz.id); 
      syncExclamations();

      };

    // 주관식 '채점' 버튼 바인딩
    document.getElementById('btn-grade-problem').addEventListener('click', () => {
      const userAnswer = document.getElementById('input-solve-answer').value;

    });

    // O 버튼 바인딩
    document.getElementById('btn-ox-o').addEventListener('click', () => {

    });

    // X 버튼 바인딩
    document.getElementById('btn-ox-x').addEventListener('click', () => {
