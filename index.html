<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Questify</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <div id="left-panel" class="panel">
      <div id="game-screen" class="screen">
        <div class="top-hud">
          <div>
            <h2 class="goal-title">오늘의 목표</h2>
            <div class="progress-wrap">
              <div id="progress-bar-fill"></div>
              <span id="progress-text">0/0</span>
            </div>
          </div>
          <div id="user-profile-card">
            <div class="profile-name">내이름은여덟글자</div>
            <div class="profile-level">Lv.1</div>
            <div class="xp-bar"></div>
          </div>
        </div>
        <div id="draggable-character">
          <div class="char-head"></div>
          <div class="char-body"></div>
        </div>
      </div>

      <div id="timer-screen" class="screen hidden">
        <button id="close-timer-btn" class="round-close">X</button>
        <div class="timer-layout">
          <div class="timer-top">
            <div id="speech-bubble">
              <div class="bubble"></div>
            </div>
            <div class="timer-character">
              <div class="char-head"></div>
              <div class="char-body"></div>
            </div>
          </div>
          <div class="timer-card">
            <div class="timer-display-wrap">
              <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8">
            </div>
            <div class="row">
              <button class="preset-btn" data-time="3600">+ 1h</button>
              <button class="preset-btn" data-time="1800">+ 30m</button>
              <button class="preset-btn" data-time="5">+ 5s</button>
            </div>
            <div class="row">
              <button id="reset-timer-btn">초기화</button>
              <button id="start-timer-btn">시작</button>
            </div>
          </div>
        </div>
      </div>

      <div id="modal-overlay">
        <div id="create-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <input id="input-quiz-title" class="field" type="text" maxlength="27"
            placeholder="문제 목록에 표시될 제목을 적어주세요. (최대 27글자)">
          <textarea id="input-quiz-content" class="area" placeholder="질문을 적어주세요."></textarea>
          <input id="input-quiz-answer" class="field" type="text" placeholder="정답을 적어주세요.">
          <button id="btn-submit-create" class="submit-btn">제작</button>
        </div>

        <div id="solve-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <div id="solve-quiz-title" class="fake-field">문제 제목</div>
          <div id="solve-quiz-content" class="fake-field">문제 내용</div>
          <div id="solve-input-state" style="display:flex; flex-direction:column; gap:12px;">
            <input id="input-solve-answer" class="field" type="text" placeholder="정답을 적어주세요.">
            <button id="btn-grade-problem" class="submit-btn">채점</button>
          </div>
          <div id="solve-result-state" class="hidden"></div>
        </div>

        <div id="slot-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <h2 id="union-level-display">전체 유니온 Lv.0</h2>
          <div id="slot-manager-container"></div>
          <div class="row" style="margin-top:auto; width:100%;">
            <button id="btn-reset-all-data" class="danger-btn">전체 데이터 삭제</button>
            <button id="btn-add-new-character">새 캐릭터 추가</button>
          </div>
        </div>
      </div>
    </div>

    <div id="right-panel-wrapper" class="panel">
      <button id="mobile-toggle-btn">☰</button>

      <div id="panel-quest" class="panel-view">
        <h1 class="panel-title">일일퀘스트</h1>
        <div class="surprise-wrap">
          <button id="btn-trigger-surprise">랜덤 퀴즈</button>
        </div>
        <div id="quest-list-container" class="list"></div>
      </div>

      <div id="panel-storage" class="panel-view hidden">
        <h1 class="panel-title">문제저장소</h1>
        <div id="storage-list-container" class="list"></div>
      </div>

      <div id="open-timer-btn">
        <div class="mark-a"></div>
        <div class="mark-b"></div>
        <div class="mark-c"></div>
      </div>

      <div id="bottom-tab-bar">
        <div id="tab-quest" class="tab active">
          <div class="tab-ui-highlight"></div>
          일일퀘스트</div>
        <div id="tab-storage" class="tab">
          <div class="tab-ui-highlight"></div>
          문제저장소</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      const MAX_LEVEL = 50;
      const MAX_SLOTS = 10;
      const STORAGE_KEY = 'questify_player_v2';
      let state = { characters: [{ level: 1, xp: 0 }], activeSlot: 0 };
      const DOM = {};

      function getCurrentChar() { return state.characters[state.activeSlot]; }
      function getXpRequired(level) { return level >= MAX_LEVEL ? Infinity : 100; }
      function getUnionLevel() { return state.characters.reduce((sum, char) => sum + char.level, 0); }

      function connectLevelUI() {
        DOM.levelEl = document.querySelector('.profile-level');
      }

      function injectXPBarFill() {
        const xpBarContainer = document.querySelector('.xp-bar');
        if (!xpBarContainer) return;
        xpBarContainer.style.position = 'relative';
        xpBarContainer.style.overflow = 'hidden';
        DOM.xpFill = document.createElement('div');
        DOM.xpFill.style.cssText = 'position:absolute; inset:0; width:0%; background: rgb(0, 255, 0); transition:width .5s ease;';
        xpBarContainer.appendChild(DOM.xpFill);
        DOM.xpText = document.createElement('div');
        DOM.xpText.style.cssText = 'font-size:9px; color: lightgray; font-weight:900; margin-top:2px;';
        xpBarContainer.parentElement.appendChild(DOM.xpText);
      }

      function createFloatLayer() {
        const gameScreen = document.getElementById('game-screen');
        DOM.floatLayer = document.createElement('div');
        DOM.floatLayer.style.cssText = 'position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden;';
        gameScreen.appendChild(DOM.floatLayer);
      }

      function updateUI() {
        const char = getCurrentChar();
        const isMax = char.level >= MAX_LEVEL;
        const required = isMax ? 0 : getXpRequired(char.level);
        const pct = isMax ? 100 : (char.xp / required * 100);
        if (DOM.levelEl) DOM.levelEl.textContent = 'Lv.' + char.level;
        if (DOM.xpFill) DOM.xpFill.style.width = pct + '%';
        if (DOM.xpText) DOM.xpText.textContent = isMax ? 'MAX | 유니온 Lv.' + getUnionLevel() : char.xp + ' / ' + required + ' XP | 유니온 Lv.' + getUnionLevel();
        syncCharacterGraphic();
      }

      function syncCharacterGraphic() {
        const body = document.querySelector('#draggable-character .char-body');
        if (!body) return;
        const level = getCurrentChar().level;
        body.style.background = level >= 40 ? '#f87171' : level >= 20 ? '#fcd34d' : level >= 10 ? '#93c5fd' : '#f3f4f6';
      }

      function showFloat(text, isLevelUp) {
        if (!DOM.floatLayer) return;
        const el = document.createElement('div');
        el.textContent = text;
        el.style.cssText = 'position:absolute; left:50%; top:50%; font-size:' + (isLevelUp ? '24px' : '16px') + '; font-weight:900; color:' + (isLevelUp ? '#2563eb' : '#111') + '; text-shadow:1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff; white-space:nowrap; animation:xpFloatUp 1.4s ease-out forwards;';
        DOM.floatLayer.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }

      function gainXP(amount) {
        const char = getCurrentChar();
        if (char.level >= MAX_LEVEL) { showFloat('만렙! 새 캐릭터를 추가하세요.'); return; }
        showFloat('+' + amount + ' XP');
        char.xp += amount;
        while (char.level < MAX_LEVEL && char.xp >= getXpRequired(char.level)) {
          char.xp -= getXpRequired(char.level);
          char.level++;
          onLevelUp();
        }
        if (char.level >= MAX_LEVEL) {
          char.xp = 0;
          showFloat('Lv.' + MAX_LEVEL + ' 졸업!', true);
          setTimeout(() => showFloat(state.characters.length < MAX_SLOTS ? '새 캐릭터를 추가할 수 있습니다!' : '유니온 Lv.' + getUnionLevel() + ' 달성!', true), 1000);
        }
        updateUI();
        save();
      }

      function onLevelUp() {
        const char = getCurrentChar();
        showFloat('Lv.' + char.level + ' 달성!', true);
        if (DOM.levelEl) {
          DOM.levelEl.style.animation = 'none';
          requestAnimationFrame(() => { DOM.levelEl.style.animation = 'xpLevelPop .5s ease'; });
        }
      }

      function addSlot() {
        if (getCurrentChar().level < MAX_LEVEL || state.characters.length >= MAX_SLOTS) return false;
        state.characters.push({ level: 1, xp: 0 });
        state.activeSlot = state.characters.length - 1;
        showFloat('새 캐릭터 등장!', true);
        updateUI();
        save();
        return true;
      }

      function switchSlot(index) {
        if (index < 0 || index >= state.characters.length || index === state.activeSlot) return false;
        state.activeSlot = index;
        updateUI();
        save();
        return true;
      }

      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed.level !== undefined && !parsed.characters) {
            state.characters = [{ level: parsed.level, xp: parsed.xp || 0 }];
            state.activeSlot = 0;
          } else {
            Object.assign(state, parsed);
          }
        } catch (e) {
          console.warn('Init error', e);
        }
      }

      window.Questify = {
        gainXP,
        addSlot,
        switchSlot,
        getUnionLevel,
        getCharacters: () => state.characters.map(c => ({ ...c })),
        getActiveChar: () => ({ ...getCurrentChar() }),
        getSlotInfo: () => ({
          activeSlot: state.activeSlot,
          totalSlots: state.characters.length,
          maxSlots: MAX_SLOTS,
          canAddSlot: getCurrentChar().level >= MAX_LEVEL && state.characters.length < MAX_SLOTS,
          unionLevel: getUnionLevel()
        }),
        reset() {
          localStorage.removeItem(STORAGE_KEY);
          state = { characters: [{ level: 1, xp: 0 }], activeSlot: 0 };
          updateUI();
        }
      };

      connectLevelUI();
      injectXPBarFill();
      createFloatLayer();
      load();
      updateUI();
    })();
  </script>

  <script>
    const APP_DATA_KEY = 'questify_app_data_v1';
    let todoList = [];
    let quizStorage = [];
    let currentActiveQuiz = null;
    let pendingMassiveReward = false;
    let editingQuizId = null;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    function loadAppData() {
      try {
        const data = localStorage.getItem(APP_DATA_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          todoList = parsed.todoList || [];
          quizStorage = parsed.quizStorage || [];
        }
      } catch (e) {
        console.warn('App data load failed', e);
      }
    }

    function saveAppData() {
      localStorage.setItem(APP_DATA_KEY, JSON.stringify({ todoList, quizStorage }));
    }

    function renderAll() {
      renderTodoList();
      renderStorageList();
      updateProgressBar();
      saveAppData();
    }

    function renderTodoList() {
      const container = document.getElementById('quest-list-container');
      container.innerHTML = '';
      const quizzes = todoList.filter(item => item.type === 'quiz');
      const todos = todoList.filter(item => item.type === 'todo');

      todos.sort((a, b) => {
        if (a.status === 'clear' && b.status !== 'clear') return 1;
        if (a.status !== 'clear' && b.status === 'clear') return -1;
        return 0;
      });

      quizzes.forEach(item => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = '<div class="quiz-top"><span class="quiz-label">[랜덤 퀴즈]</span><button onclick="openSolveModalFromQuest(' + item.id + ')">도전하기!</button></div><input type="text" value="' + escapeHTML(item.title) + '" readonly>';
        container.appendChild(card);
      });

      todos.forEach(item => {
        const card = document.createElement('div');
        card.className = 'todo-card draggable-todo-item' + (item.status === 'clear' ? ' clear' : '');
        card.dataset.id = item.id;
        card.dataset.status = item.status;
        if (item.status !== 'clear') card.draggable = true;
        card.innerHTML = '<div style="display:flex; align-items:center; width:100%;">' +
          (item.status !== 'clear' ? '<span class="drag-handle">≡</span>' : '') +
          '<input type="text" value="' + escapeHTML(item.title) + '" readonly></div><div style="display:flex; gap:4px; flex-shrink:0; margin-left:8px;">' +
          //삭제버튼
          (item.status !== 'clear' ? '<button onclick="handleTodoAction(' + item.id + ', \'delete\')" id = "del" class="mini-btn"><span>삭제</span></button>' : '') +
          //완료버튼
          (item.status !== 'clear' ? '<button onclick="handleTodoAction(' + item.id + ', \'clear\')" id = "suc" class="mini-btn"><span>성공</span></button>' : 
          '<span style = "color: white; opacity: 25%">성공!</span>') +
          '</div>';
        if (item.status !== 'clear') {
          card.addEventListener('dragstart', handleDragStart);
          card.addEventListener('dragover', handleDragOver);
          card.addEventListener('dragend', handleDragEnd);
          card.addEventListener('touchstart', handleTouchStart, { passive: false });
          card.addEventListener('touchmove', handleTouchMove, { passive: false });
          card.addEventListener('touchend', handleTouchEnd);
        }
        container.appendChild(card);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-card';
      addBtn.innerHTML = '<span>+</span>';
      addBtn.onclick = () => {
        let title = prompt('새로운 일일 퀘스트를 입력하세요 (최대 20자):');
        if (title && title.trim()) {
          title = title.trim().substring(0, 20);
          todoList.push({ id: Date.now(), type: 'todo', title, status: 'ready' });
          renderAll();
        }
      };
      container.appendChild(addBtn);
    }

    function updateProgressBar() {
      const todos = todoList.filter(item => item.type === 'todo');
      const total = todos.length;
      const clears = todos.filter(item => item.status === 'clear').length;
      const percent = total > 0 ? clears / total * 100 : 0;
      document.getElementById('progress-bar-fill').style.width = percent + '%';
      document.getElementById('progress-text').innerText = clears + '/' + total;
    }

    function renderStorageList() {
      const container = document.getElementById('storage-list-container');
      container.innerHTML = '';
      quizStorage.forEach(quiz => {
        const card = document.createElement('div');
        card.className = 'storage-card';
        card.onclick = event => openEditModal(quiz.id, event);
        card.innerHTML = '<div class="storage-title">' + escapeHTML(quiz.title) + 
          '</div><div class="storage-bottom"><span class="storage-tag">저장된 문제</span><div class="storage-actions"><button id = "Pdel" class="mini-btn" onclick="event.stopPropagation(); deleteQuizFromStorage(' + quiz.id + ')">삭제</button><button id = "Bstorage" class="mini-btn" onclick="event.stopPropagation(); openSolveModalFromStorage(' + quiz.id + ')">다시풀기</button></div></div>';
        container.appendChild(card);
      });


      const addBtn = document.createElement('button');
      addBtn.className = 'add-card';
      addBtn.innerHTML = '<span>+</span>';
      addBtn.onclick = () => {
        editingQuizId = null;
        document.getElementById('input-quiz-title').value = '';
        document.getElementById('input-quiz-content').value = '';
        document.getElementById('input-quiz-answer').value = '';
        document.getElementById('btn-submit-create').innerText = '제작';
        openSpecificModal('create-modal');
      };
      container.appendChild(addBtn);
    }

    window.handleTodoAction = function (id, action) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;

      // 완료 처리
      if (action === 'clear') {
        todoList[idx].status = 'clear';

        if (window.Questify) {
          window.Questify.gainXP(20);
        }
      }

      // 삭제 처리
      if (action === 'delete') {
        todoList.splice(idx, 1);
      }

      renderAll();
    };

    window.openEditModal = function (id) {
      const quiz = quizStorage.find(q => q.id === id);
      if (!quiz) return;
      editingQuizId = id;
      document.getElementById('input-quiz-title').value = quiz.title;
      document.getElementById('input-quiz-content').value = quiz.content;
      document.getElementById('input-quiz-answer').value = quiz.answer;
      document.getElementById('btn-submit-create').innerText = '수정';
      openSpecificModal('create-modal');
    };

    document.getElementById('btn-trigger-surprise').addEventListener('click', () => {
      if (quizStorage.length === 0) return alert('저장된 문제가 없습니다! 먼저 문제를 만들어주세요.');
      const availableQuizzes = quizStorage.filter(q => !todoList.some(item => item.type === 'quiz' && item.originQuizId === q.id));
      if (availableQuizzes.length === 0) return alert('모든 문제가 이미 일일퀘스트에 등록되어 있습니다.');
      const randomQuiz = availableQuizzes[Math.floor(Math.random() * availableQuizzes.length)];
      todoList.unshift({ id: Date.now(), type: 'quiz', title: randomQuiz.title, originQuizId: randomQuiz.id });
      renderAll();
      alert('랜덤 퀴즈가 일일퀘스트 상단에 추가되었습니다!');
    });

    window.deleteQuizFromStorage = function (quizId) {
      if (confirm('이 문제를 정말로 삭제하시겠습니까?')) {
        quizStorage = quizStorage.filter(q => q.id !== quizId);
        todoList = todoList.filter(item => !(item.type === 'quiz' && item.originQuizId === quizId));
        renderAll();
      }
    };

    const modalOverlay = document.getElementById('modal-overlay');
    const modals = document.querySelectorAll('.modal-content');

    function openSpecificModal(modalId) {
      modalOverlay.style.display = 'flex';
      modals.forEach(m => m.classList.add('hidden'));
      document.getElementById(modalId).classList.remove('hidden');
    }

    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        modalOverlay.style.display = 'none';
        currentActiveQuiz = null;
        editingQuizId = null;
        if (pendingMassiveReward) {
          alert('문제 생성을 취소하여 경험치 획득 기회가 소멸되었습니다.');
          pendingMassiveReward = false;
        }
      });
    });

    document.getElementById('btn-submit-create').addEventListener('click', () => {
      const title = document.getElementById('input-quiz-title').value.trim();
      const content = document.getElementById('input-quiz-content').value.trim();
      const answer = document.getElementById('input-quiz-answer').value.trim();
      if (!title || !content || !answer) return alert('모든 빈칸을 채워주세요!');

      if (editingQuizId) {
        const quizIndex = quizStorage.findIndex(q => q.id === editingQuizId);
        if (quizIndex !== -1) {
          quizStorage[quizIndex].title = title;
          quizStorage[quizIndex].content = content;
          quizStorage[quizIndex].answer = answer;
          todoList.forEach(item => {
            if (item.type === 'quiz' && item.originQuizId === editingQuizId) item.title = title;
          });
        }
        alert('문제가 성공적으로 수정되었습니다.');
        editingQuizId = null;
      } else {
        quizStorage.push({ id: Date.now(), title, content, answer });
        if (pendingMassiveReward) {
          if (window.Questify) window.Questify.gainXP(50);
          alert('축하합니다! 문제 생성 50 경험치를 획득했습니다!');
          pendingMassiveReward = false;
        } else {
          alert('문제가 성공적으로 저장되었습니다.');
        }
      }
      modalOverlay.style.display = 'none';
      renderAll();
    });

    window.openSolveModalFromStorage = function (quizId) {
      const quiz = quizStorage.find(q => q.id === quizId);
      if (quiz) setupSolveModal(quiz, false);
    };

    window.openSolveModalFromQuest = function (todoQuizId) {
      const todoItem = todoList.find(item => item.id === todoQuizId);
      if (!todoItem) return;
      const quiz = quizStorage.find(q => q.id === todoItem.originQuizId);
      if (quiz) setupSolveModal(quiz, true, todoQuizId);
    };

    function setupSolveModal(quiz, isSurprise, todoQuizId) {
      currentActiveQuiz = { ...quiz, isSurprise, todoQuizId };
      document.getElementById('solve-quiz-title').innerText = quiz.title;
      document.getElementById('solve-quiz-content').innerText = quiz.content;
      document.getElementById('input-solve-answer').value = '';
      document.getElementById('solve-input-state').classList.remove('hidden');
      document.getElementById('solve-result-state').className = 'hidden';
      openSpecificModal('solve-modal');
    }

    document.getElementById('btn-grade-problem').addEventListener('click', () => {
      if (!currentActiveQuiz) return;
      const userAnswer = document.getElementById('input-solve-answer').value.trim();
      const isCorrect = userAnswer.toLowerCase() === currentActiveQuiz.answer.toLowerCase();
      document.getElementById('solve-input-state').classList.add('hidden');
      const resultBox = document.getElementById('solve-result-state');
      resultBox.classList.remove('hidden');

      if (isCorrect) {
        resultBox.className = 'result-good';
        resultBox.innerText = '정답입니다! 경험치를 획득했습니다.';
        resultBox.onclick = null;
        if (window.Questify) window.Questify.gainXP(currentActiveQuiz.isSurprise ? 30 : 20);
        if (currentActiveQuiz.isSurprise && currentActiveQuiz.todoQuizId) {
          const idx = todoList.findIndex(item => item.id === currentActiveQuiz.todoQuizId);
          if (idx !== -1) todoList.splice(idx, 1);
          renderAll();
        }
      } else {
        resultBox.className = 'result-bad';
        resultBox.innerHTML = '<div>오답입니다! (입력: ' + escapeHTML(userAnswer) + ')</div><div style="font-size:12px; margin-top:6px; opacity:.8;">터치하면 정답이 표시됩니다.</div>';
        resultBox.onclick = function () {
          resultBox.innerHTML = '<div>오답입니다! (입력: ' + escapeHTML(userAnswer) + ')</div><div style="font-size:15px; font-weight:900; color:#1d4ed8; margin-top:4px;">정답: ' + escapeHTML(currentActiveQuiz.answer) + '</div>';
          resultBox.onclick = null;
          resultBox.className = 'result-bad';
          resultBox.style.cursor = 'default';
        };
      }
    });

    const timerDisplay = document.getElementById('timer-display');
    const startTimerBtn = document.getElementById('start-timer-btn');
    const resetTimerBtn = document.getElementById('reset-timer-btn');
    const presetBtns = document.querySelectorAll('.preset-btn');
    let totalSeconds = 0;
    let timerInterval = null;
    let timerRunning = false;
    let timerPaused = false;
    const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

    function formatTime(seconds) {
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return hrs + ':' + mins + ':' + secs;
    }

    function totalSecondsFromDigits(digits) {
      const h = Number('' + digits[0] + digits[1]) || 0;
      const m = Number('' + digits[2] + digits[3]) || 0;
      const s = Number('' + digits[4] + digits[5]) || 0;
      return h * 3600 + m * 60 + s;
    }

    function updateDisplays() { timerDisplay.value = formatTime(totalSeconds); }

    function startTimer() {
      if (totalSeconds <= 0) return;
      timerRunning = true;
      timerPaused = false;
      startTimerBtn.innerText = '일시정지';
      timerDisplay.disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timerPaused) return;
        if (totalSeconds > 0) {
          totalSeconds--;
          updateDisplays();
        }
        if (totalSeconds <= 0) {
          totalSeconds = 0;
          updateDisplays();
          stopTimer();
          alert('집중 시간이 끝났습니다!\n\n문제를 생성하면 50 경험치를 얻습니다!');
          pendingMassiveReward = true;
          editingQuizId = null;
          document.getElementById('input-quiz-title').value = '';
          document.getElementById('input-quiz-content').value = '';
          document.getElementById('input-quiz-answer').value = '';
          document.getElementById('btn-submit-create').innerText = '제작';
          openSpecificModal('create-modal');
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      timerPaused = false;
      startTimerBtn.innerText = '시작';
      timerDisplay.disabled = false;
    }

    startTimerBtn.addEventListener('click', () => {
      if (timerRunning) {
        timerPaused = !timerPaused;
        startTimerBtn.innerText = timerPaused ? '계속' : '일시정지';
      } else {
        startTimer();
      }
    });
    resetTimerBtn.addEventListener('click', () => { stopTimer(); totalSeconds = 0; updateDisplays(); });
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (timerRunning && !timerPaused) return;
        totalSeconds += parseInt(btn.dataset.time, 10);
        if (totalSeconds > 359999) totalSeconds = 359999;
        updateDisplays();
      });
    });

    timerDisplay.addEventListener('keydown', e => {
      if (timerRunning) { e.preventDefault(); return; }
      if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return;
      e.preventDefault();
      let digits = timerDisplay.value.replace(/:/g, '').split('');
      const start = timerDisplay.selectionStart;
      let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start);
      if (digitIndex === -1) digitIndex = 5;
      if (/\d/.test(e.key)) {
        digits[digitIndex] = e.key;
        totalSeconds = totalSecondsFromDigits(digits);
        updateDisplays();
        const nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1;
        timerDisplay.setSelectionRange(nextPos, nextPos);
      } else if (e.key === 'Backspace') {
        let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1;
        if (start === timerDisplay.value.length) targetIdx = 5;
        if (targetIdx >= 0) {
          digits[targetIdx] = '0';
          totalSeconds = totalSecondsFromDigits(digits);
          updateDisplays();
          timerDisplay.setSelectionRange(DIGIT_POSITIONS[targetIdx], DIGIT_POSITIONS[targetIdx]);
        }
      } else if (e.key === 'Delete') {
        const targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start);
        if (targetIdx !== -1) {
          digits[targetIdx] = '0';
          totalSeconds = totalSecondsFromDigits(digits);
          updateDisplays();
          timerDisplay.setSelectionRange(start, start);
        }
      }
    });

    let dragSrcEl = null;
    function handleDragStart(e) {
      dragSrcEl = this;
      this.style.opacity = '.4';
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.dataset.id);
    }
    function handleDragOver(e) {
      e.preventDefault();
      if (this !== dragSrcEl && this.classList.contains('draggable-todo-item') && this.dataset.status !== 'clear') {
        const children = Array.from(this.parentNode.querySelectorAll('.draggable-todo-item'));
        if (children.indexOf(dragSrcEl) < children.indexOf(this)) this.after(dragSrcEl);
        else this.before(dragSrcEl);
      }
      return false;
    }
    function handleDragEnd() {
      this.style.opacity = '1';
      reorderTodoListData();
    }

    let touchStartEl = null;
    function handleTouchStart(e) {
      if (!e.target.classList.contains('drag-handle')) return;
      touchStartEl = this;
      this.style.opacity = '.4';
    }
    function handleTouchMove(e) {
      if (!touchStartEl) return;
      e.preventDefault();
      const touch = e.touches[0];
      const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
      const itemEl = targetEl && targetEl.closest('.draggable-todo-item');
      if (itemEl && itemEl !== touchStartEl && itemEl.dataset.status !== 'clear') {
        const children = Array.from(this.parentNode.querySelectorAll('.draggable-todo-item'));
        if (children.indexOf(touchStartEl) < children.indexOf(itemEl)) itemEl.after(touchStartEl);
        else itemEl.before(touchStartEl);
      }
    }
    function handleTouchEnd() {
      if (!touchStartEl) return;
      touchStartEl.style.opacity = '1';
      touchStartEl = null;
      reorderTodoListData();
    }

    function reorderTodoListData() {
      const currentDOMIds = Array.from(document.querySelectorAll('.draggable-todo-item')).map(el => parseInt(el.dataset.id, 10));
      const quizzes = todoList.filter(item => item.type === 'quiz');
      const completedTodos = todoList.filter(item => item.type === 'todo' && item.status === 'clear');
      const activeTodos = todoList.filter(item => item.type === 'todo' && item.status !== 'clear');
      activeTodos.sort((a, b) => currentDOMIds.indexOf(a.id) - currentDOMIds.indexOf(b.id));
      todoList = [...quizzes, ...activeTodos, ...completedTodos];
      saveAppData();
    }

    const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
    const leftPanel = document.getElementById('left-panel');
    const rightPanelWrapper = document.getElementById('right-panel-wrapper');
    mobileToggleBtn.addEventListener('click', () => {
      const isCollapsed = rightPanelWrapper.classList.toggle('mobile-collapsed');
      leftPanel.style.height = isCollapsed ? 'calc(100% - 56px)' : '45%';
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        rightPanelWrapper.classList.remove('mobile-collapsed');
        leftPanel.style.height = '';
      }
    });

    const gameScreen = document.getElementById('game-screen');
    const timerScreen = document.getElementById('timer-screen');
    const openTimerBtn = document.getElementById('open-timer-btn');
    const closeTimerBtn = document.getElementById('close-timer-btn');
    function toggleTimerScreen() {
      if (timerScreen.classList.contains('hidden')) {
        gameScreen.classList.add('hidden');
        timerScreen.classList.remove('hidden');
        openTimerBtn.style.background = '#d1d5db';
      } else {
        timerScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        openTimerBtn.style.background = '#fff';
      }
    }
    openTimerBtn.addEventListener('click', toggleTimerScreen);
    closeTimerBtn.addEventListener('click', toggleTimerScreen);

    const tabQuest = document.getElementById('tab-quest');
    const panelQuest = document.getElementById('panel-quest');
    const tabStorage = document.getElementById('tab-storage');
    const panelStorage = document.getElementById('panel-storage');
    tabStorage.addEventListener('click', () => {
      panelQuest.classList.add('hidden');
      panelStorage.classList.remove('hidden');
      tabStorage.classList.add('active');
      tabQuest.classList.remove('active');
    });
    tabQuest.addEventListener('click', () => {
      panelStorage.classList.add('hidden');
      panelQuest.classList.remove('hidden');
      tabQuest.classList.add('active');
      tabStorage.classList.remove('active');
    });

    document.getElementById('user-profile-card').addEventListener('click', () => {
      renderSlotInventory();
      openSpecificModal('slot-modal');
    });

    function renderSlotInventory() {
      if (!window.Questify) return;
      const info = window.Questify.getSlotInfo();
      const characters = window.Questify.getCharacters();
      const container = document.getElementById('slot-manager-container');
      document.getElementById('union-level-display').innerText = '전체 유니온 Lv.' + info.unionLevel;
      container.innerHTML = '';
      characters.forEach((char, index) => {
        const isActive = index === info.activeSlot;
        const slotCard = document.createElement('div');
        slotCard.className = 'slot-card' + (isActive ? ' active' : '');
        slotCard.innerHTML = '<div class="slot-head"><span>슬롯 #' + (index + 1) + '</span>' +
          (isActive ? '<span class="badge">현재 육성중</span>' : '') +
          (char.level >= 50 && !isActive ? '<span class="badge gold">졸업</span>' : '') +
          '</div><div style="font-size:13px; color:#374151; font-weight:800; margin-top:4px;"><span style="display:inline-block; width:60px;">레벨:</span> Lv.' + char.level + '</div>' +
          '<div style="font-size:13px; color:#374151; font-weight:800;"><span style="display:inline-block; width:60px;">현재 XP:</span> ' + char.xp + '</div>' +
          '<button class="plain-btn" onclick="Questify.switchSlot(' + index + '); renderSlotInventory();" style="margin-top:8px; padding:6px; font-size:12px;" ' + (isActive ? 'disabled' : '') + '>' + (isActive ? '선택됨' : '이 캐릭터로 스위치 전환') + '</button>';
        container.appendChild(slotCard);
      });
      const addSlotBtn = document.getElementById('btn-add-new-character');
      addSlotBtn.disabled = !info.canAddSlot;
      addSlotBtn.onclick = () => {
        if (window.Questify.addSlot()) renderSlotInventory();
      };
    }
    window.renderSlotInventory = renderSlotInventory;

    const draggableCharacter = document.getElementById('draggable-character');
    const gameScreenBox = document.getElementById('game-screen');
    let isCharDragging = false;
    let charStartX = 0;
    let charStartY = 0;
    let charInitialLeft = 0;
    let charInitialTop = 0;

    function startCharDrag(e) {
      if (gameScreenBox.classList.contains('hidden')) return;
      isCharDragging = true;
      const point = e.type.includes('mouse') ? e : e.touches[0];
      charStartX = point.clientX;
      charStartY = point.clientY;
      const rect = draggableCharacter.getBoundingClientRect();
      const parentRect = gameScreenBox.getBoundingClientRect();
      charInitialLeft = rect.left - parentRect.left;
      charInitialTop = rect.top - parentRect.top;
      draggableCharacter.style.bottom = 'auto';
      draggableCharacter.style.transform = 'none';
      draggableCharacter.style.left = charInitialLeft + 'px';
      draggableCharacter.style.top = charInitialTop + 'px';
    }

    function dragChar(e) {
      if (!isCharDragging) return;
      e.preventDefault();
      const point = e.type.includes('mouse') ? e : e.touches[0];
      let newLeft = charInitialLeft + (point.clientX - charStartX);
      let newTop = charInitialTop + (point.clientY - charStartY);
      const parentRect = gameScreenBox.getBoundingClientRect();
      const rect = draggableCharacter.getBoundingClientRect();
      if (newLeft < 0) newLeft = 0;
      if (newTop < 0) newTop = 0;
      if (newLeft + rect.width > parentRect.width) newLeft = parentRect.width - rect.width;
      if (newTop + rect.height > parentRect.height) newTop = parentRect.height - rect.height;
      draggableCharacter.style.left = newLeft + 'px';
      draggableCharacter.style.top = newTop + 'px';
    }

    function endCharDrag() {
      isCharDragging = false;
    }

    draggableCharacter.addEventListener('mousedown', startCharDrag);
    document.addEventListener('mousemove', dragChar);
    document.addEventListener('mouseup', endCharDrag);
    draggableCharacter.addEventListener('touchstart', startCharDrag, { passive: false });
    document.addEventListener('touchmove', dragChar, { passive: false });
    document.addEventListener('touchend', endCharDrag);

    const resizeObserver = new ResizeObserver(() => {
      if (draggableCharacter.style.transform === 'none') {
        const parentRect = gameScreenBox.getBoundingClientRect();
        const rect = draggableCharacter.getBoundingClientRect();
        let currentLeft = draggableCharacter.offsetLeft;
        let currentTop = draggableCharacter.offsetTop;
        if (currentLeft + rect.width > parentRect.width) currentLeft = parentRect.width - rect.width;
        if (currentTop + rect.height > parentRect.height) currentTop = parentRect.height - rect.height;
        if (currentLeft < 0) currentLeft = 0;
        if (currentTop < 0) currentTop = 0;
        draggableCharacter.style.left = currentLeft + 'px';
        draggableCharacter.style.top = currentTop + 'px';
      }
    });
    resizeObserver.observe(gameScreenBox);

    document.getElementById('btn-reset-all-data').addEventListener('click', () => {
      if (confirm('경고: 모든 캐릭터 성장, 퀘스트, 문제 데이터가 완전히 삭제되며 복구할 수 없습니다.\n\n정말 모든 데이터를 삭제하시겠습니까?')) {
        localStorage.clear();
        location.reload();
      }
    });

    loadAppData();
    renderAll();
  </script>
</body>

</html>
