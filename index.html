<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 모바일 메뉴 숨김 처리 시 맨 윗줄만 남기기 위한 스타일 */
        @media (max-width: 767px) {
            .mobile-collapsed {
                flex: none !important;
                height: 56px !important;
                min-height: 56px !important;
            }
            /* 축소 시 하단 탭 바 숨기기 */
            .mobile-collapsed #bottom-tab-bar {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-300 w-screen h-[100dvh] overflow-hidden flex justify-center items-center font-sans select-none md:p-0">

    <!-- Questify 메인 앱 컨테이너 -->

    <div class="flex flex-col md:flex-row w-full h-full md:max-h-[99%] md:max-w-[calc(100vh*1.6666)] md:aspect-[5/3] bg-white md:p-1 gap-1 md:gap-1.5 md:shadow-2xl overflow-hidden relative border-[3px] border-black">

                <!-- 좌측 메인 플레이 화면 / 캐릭터 영역 -->
        <div id="left-panel" class="h-[45%] md:h-full w-full md:w-[60%] relative overflow-hidden shrink-0 border-[4px] border-black bg-white transition-all duration-300">
                        <!-- 기본 게임 화면: 진행도 / 프로필 / 캐릭터 표시 -->
            <div id="game-screen" class="absolute inset-0 bg-white w-full h-full z-10 overflow-hidden relative">
                <div class="absolute top-0 left-0 w-full z-30 flex flex-col p-2 md:p-3 lg:p-4 gap-2 md:gap-3 pointer-events-none">
                    <div class="pointer-events-auto">
                        <h2 class="text-black font-bold text-sm md:text-lg lg:text-xl ml-[2.5%]">오늘의 목표</h2>
                        <div class="w-full mx-auto md:w-[95%] max-w-full h-6 md:h-8 bg-white border-[2px] border-black relative mt-1">
                            <div id="progress-bar-fill" class="w-0 h-full bg-gray-300 transition-all duration-300"></div>
                            <span id="progress-text" class="absolute inset-0 flex justify-center items-center text-black text-[10px] lg:text-sm font-bold">0/0</span>
                        </div>
                    </div>
                    
                    <div id="user-profile-card" class="pointer-events-auto ml-[2.5%] bg-white rounded-md p-1.5 md:p-2 lg:p-3 border-[2px] border-black w-[120px] md:w-[160px] lg:w-[200px] cursor-pointer hover:scale-105 transition-transform">
                        <div class="text-black text-[10px] md:text-sm lg:text-base font-bold tracking-wide truncate">내이름은여덟글자</div>
                        <div class="text-gray-600 text-[9px] md:text-xs lg:text-sm font-bold mt-0.5 md:mt-1">Lv.1</div>
                        <div class="w-full h-1.5 md:h-2 lg:h-3 bg-gray-300 border border-black mt-1"></div>
                    </div>
                </div>

                <div id="draggable-character" class="absolute bottom-[8%] md:bottom-[10%] left-1/2 transform -translate-x-1/2 w-[40%] max-w-[140px] md:max-w-[180px] flex flex-col items-center justify-end z-20 cursor-grab active:cursor-grabbing touch-none pointer-events-auto shrink-0">
                    <div class="w-[70%] aspect-square bg-white border-[3px] md:border-[4px] border-black rounded-full mb-[-10px] z-10 shrink-0 pointer-events-none transition-colors duration-500"></div> 
                    <div class="w-full aspect-[5/6] bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none transition-colors duration-500"></div> 
                </div>
            </div>

                        <!-- 집중 타이머 전체 화면 오버레이 -->
            <div id="timer-screen" class="absolute inset-0 bg-white w-full h-full z-30 hidden overflow-hidden">
                <button id="close-timer-btn" class="absolute top-2 left-2 md:top-4 md:left-4 w-8 h-8 md:w-10 md:h-10 bg-white rounded-full border-[2px] md:border-[3px] border-black flex justify-center items-center z-40 hover:bg-gray-100 active:scale-95 transition-all shadow-sm cursor-pointer">
                    <span class="text-black font-bold text-sm md:text-base mb-0.5">X</span>
                </button>

                <div class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none pt-12 pb-4 md:pt-16 md:pb-10">
                    <div class="flex flex-col items-center justify-center w-full min-h-0 max-h-full">
                        <div class="flex items-end justify-center gap-2 md:gap-6 w-full max-w-[800px] px-2 pointer-events-auto z-10 shrink min-h-[100px] h-[35vh] max-h-[220px] md:max-h-[320px]">
                            <div id="speech-bubble" class="hidden md:flex flex-col justify-start h-full w-[45%] md:w-[50%] max-w-[420px]">
                                <div class="relative w-full h-[80px] md:h-[110px] lg:h-[130px] shrink-0 bg-white border-[3px] md:border-[4px] border-black rounded-[2rem] md:rounded-[3rem] shadow-sm flex items-center justify-center mt-2 md:mt-4">
                                    <div class="absolute top-1/2 -translate-y-1/2 -right-[11px] md:-right-[15px] w-5 h-5 md:w-8 md:h-8 bg-white border-t-[3px] md:border-t-[4px] border-r-[3px] md:border-r-[4px] border-black transform rotate-45 z-10"></div>
                                </div>
                            </div>
                            <div class="w-[30%] max-w-[140px] md:max-w-[180px] h-full flex flex-col items-center pointer-events-auto shrink min-h-[60px]">
                                <div class="w-[70%] max-w-[120px] aspect-square bg-white border-[3px] md:border-[4px] border-black rounded-full mb-[-10px] z-10 shrink-0"></div>
                                <div class="w-full flex-1 bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink min-h-[20px]"></div>
                            </div>
                        </div>

                        <div class="w-[95%] md:w-[85%] max-w-[700px] bg-gray-100 border-[4px] md:border-[5px] border-black rounded-xl p-4 md:p-6 lg:p-8 shadow-sm z-20 pointer-events-auto flex flex-col gap-3 md:gap-5 shrink-0 -mt-10 md:-mt-16 relative">
                            <div class="w-full bg-white border-[3px] md:border-[4px] border-black rounded-lg py-4 md:py-6 lg:py-8 min-h-[80px] md:min-h-[120px] flex justify-center items-center shadow-sm relative overflow-hidden">
                                <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8" class="text-black text-[12vw] sm:text-5xl md:text-7xl lg:text-[6rem] font-black tracking-normal sm:tracking-wider leading-none text-center bg-transparent outline-none w-full z-10">
                            </div>
                            <div class="w-full flex justify-center gap-4 md:gap-8 px-1 md:px-8">
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="3600">+ 1h</button>
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="1800">+ 30m</button>
                                <!-- 신규 기능: 초 단위 빠른 타이머 추가 -->
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="5">+ 5s</button>
                            </div>
                            <div class="w-full flex justify-center gap-3 mt-1 md:mt-2">
                                <button id="reset-timer-btn" class="bg-white border-[3px] md:border-[4px] border-black rounded-lg w-[25%] md:w-[20%] py-2 md:py-3 lg:py-4 text-black font-black text-sm md:text-lg lg:text-xl shadow-sm hover:bg-gray-100 active:scale-95 transition-all">초기화</button>
                                <button id="start-timer-btn" class="bg-gray-200 border-[3px] md:border-[4px] border-black rounded-lg w-[50%] md:w-[40%] py-2 md:py-3 lg:py-4 text-black font-black text-lg md:text-xl lg:text-2xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all">시작</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                        <!-- 문제 생성 / 풀이 / 슬롯 관리용 공통 모달 레이어 -->
            <div id="modal-overlay" class="absolute inset-0 bg-gray-900/60 z-50 hidden justify-center items-center p-4 md:p-6">
                <div id="create-modal" class="modal-content bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-3 md:p-5 flex flex-col gap-3 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <input id="input-quiz-title" type="text" maxlength="27" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner" placeholder="문제 목록에 표시될 제목을 적어주세요. (최대 27글자)">
                    <textarea id="input-quiz-content" class="w-full flex-1 bg-gray-50 border-[2.5px] border-gray-400 rounded-xl px-4 py-3 text-sm md:text-base font-bold text-black outline-none resize-none placeholder-gray-500 shadow-inner" placeholder="질문을 적어주세요."></textarea>
                    <input id="input-quiz-answer" type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner mt-1" placeholder="정답을 적어주세요.">
                    <button id="btn-submit-create" class="bg-gray-200 border-[3px] border-black rounded-lg py-1.5 md:py-2 px-10 text-black font-black text-base md:text-xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all self-center mt-2">제작</button>
                </div>
                
                <div id="solve-modal" class="modal-content bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-3 md:p-5 flex flex-col gap-3 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <div id="solve-quiz-title" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black shadow-inner flex items-center">문제 제목</div>
                    <div id="solve-quiz-content" class="w-full flex-1 bg-gray-50 border-[2.5px] border-gray-400 rounded-xl px-4 py-3 text-sm md:text-base font-bold text-black overflow-y-auto shadow-inner">문제 내용</div>
                    
                    <div class="w-full flex flex-col items-center mt-1">
                        <div id="solve-input-state" class="w-full flex flex-col gap-3">
                            <input id="input-solve-answer" type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner" placeholder="정답을 적어주세요.">
                            <button id="btn-grade-problem" class="bg-gray-200 border-[3px] border-black rounded-lg py-1.5 md:py-2 px-10 text-black font-black text-base md:text-xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all self-center mt-1">채점</button>
                        </div>
                        <div id="solve-result-state" class="w-full hidden bg-gray-100 border-[2px] border-gray-300 rounded-xl px-2 py-1 text-center text-xs md:text-sm font-bold text-black leading-relaxed overflow-y-auto h-24 md:h-28 break-all flex items-center justify-center"></div>
                    </div>
                </div>

                                <!-- 신규 기능: 유니온 슬롯 / 멀티 캐릭터 관리 모달 -->
                <div id="slot-modal" class="modal-content bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-4 md:p-6 flex flex-col gap-4 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <h2 id="union-level-display" class="text-xl md:text-2xl font-black text-center border-b-2 border-black pb-2">전체 유니온 Lv.0</h2>
                    <div id="slot-manager-container" class="flex-1 overflow-y-auto flex flex-col gap-3 px-1 pb-4"></div>
                    <div class="flex gap-2 w-full mt-auto shrink-0">
                        <button id="btn-reset-all-data" class="bg-red-500 border-[3px] border-black rounded-lg py-3 px-4 text-white font-black text-xs md:text-sm shadow-sm hover:bg-red-600 active:scale-95 transition-all shrink-0">전체 데이터 삭제</button>
                        <button id="btn-add-new-character" class="flex-1 bg-gray-200 border-[3px] border-black rounded-lg py-3 text-black font-black text-base md:text-lg shadow-sm hover:bg-gray-300 active:scale-95 transition-all disabled:opacity-50 disabled:active:scale-100 shrink-0">✨ 새 캐릭터 추가</button>
                    </div>
                </div>
            </div>
        </div>

                <!-- 우측 관리 패널: 퀘스트 / 저장소 / 메뉴 -->
        <div id="right-panel-wrapper" class="flex-1 md:h-full w-full md:w-[40%] flex flex-col relative overflow-hidden border-[4px] border-black bg-gray-100 transition-all duration-300">
                        <!-- 신규 기능: 모바일 우측 패널 접기/펼치기 버튼 -->
            <button id="mobile-toggle-btn" class="md:hidden absolute top-3 right-3 w-8 h-8 flex justify-center items-center bg-white border-[2px] border-black rounded z-40 shadow-sm font-bold text-xl hover:bg-gray-100 active:scale-95 transition-all">
                ☰
            </button>

                        <!-- 일일 퀘스트 탭 -->
            <div id="panel-quest" class="flex-1 flex flex-col overflow-hidden">
                <div class="pt-3 md:pt-[4%] pb-2 md:pb-[3%] shrink-0 flex flex-col gap-2">
                    <h1 class="text-black text-xl md:text-3xl lg:text-4xl font-black text-center tracking-widest">일일퀘스트</h1>
                    <div class="flex justify-center gap-2 px-2">
                        <button id="btn-trigger-surprise" class="bg-red-100 border-[2px] border-red-400 text-red-700 text-xs md:text-sm font-bold px-3 py-1 rounded shadow-sm hover:bg-red-200 active:scale-95 transition-all">💥 기습 퀴즈</button>
                    </div>
                </div>
                <div id="quest-list-container" class="flex-1 px-2 md:px-[4%] flex flex-col gap-2 md:gap-[3%] overflow-y-auto pb-16 md:pb-[20%]">
                </div>
            </div>

                        <!-- 저장된 문제를 관리하는 문제 저장소 탭 -->
            <div id="panel-storage" class="flex-1 flex flex-col overflow-hidden hidden">
                <div class="pt-3 md:pt-[4%] pb-2 md:pb-[3%] shrink-0">
                    <h1 class="text-black text-xl md:text-3xl lg:text-4xl font-black text-center tracking-widest">문제저장소</h1>
                </div>
                <div id="storage-list-container" class="flex-1 px-2 md:px-[4%] flex flex-col gap-2 md:gap-[3%] overflow-y-auto pb-16 md:pb-[20%]">
                </div>
            </div>

            <div id="open-timer-btn" class="absolute bottom-12 md:bottom-[15%] right-3 md:right-[5%] w-10 h-10 md:w-[12%] md:aspect-square md:h-auto max-h-[64px] max-w-[64px] min-w-[40px] min-h-[40px] bg-white rounded-full border-[2.5px] md:border-[3px] border-black shadow-sm flex justify-center items-center cursor-pointer hover:scale-105 transition-all z-10">
                <div class="w-[10%] h-[20%] bg-black absolute top-[15%] rounded-full"></div>
                <div class="w-[20%] h-[10%] bg-black absolute right-[15%] rounded-full"></div>
                <div class="absolute -top-[15%] w-[20%] h-[20%] bg-black rounded-sm"></div>
            </div>

                        <!-- 하단 탭 전환 바 -->
            <div id="bottom-tab-bar" class="h-10 md:h-[10%] min-h-[40px] md:min-h-[48px] flex border-t-[3px] border-black w-full mt-auto shrink-0 bg-gray-200">
                <div id="tab-quest" class="flex-1 bg-white border-r-[3px] border-black flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all">
                    <span id="tab-quest-text" class="text-black font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2">📜 일일퀘스트</span>
                </div>
                <div id="tab-storage" class="flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors">
                    <span id="tab-storage-text" class="text-gray-500 font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2">💡 문제저장소</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    // 캐릭터 성장 / XP / 유니온 슬롯 시스템
    // 레벨업 / XP / 슬롯 확장 / 유니온 총합 관리
    // ============================================================
    (function () {
        'use strict';
        const MAX_LEVEL = 50;
        const MAX_SLOTS = 10;
        const STORAGE_KEY = 'questify_player_v2';
        
        let state = { characters: [{ level: 1, xp: 0 }], activeSlot: 0 };
        const DOM = {};

        function getCurrentChar() { return state.characters[state.activeSlot]; }
        // 요구 경험치 100 고정으로 변경
        // 레벨당 요구 경험치 계산
        function getXpRequired(level) {
            if (level >= MAX_LEVEL) return Infinity;
            return 100;
        }
        function getUnionLevel() { return state.characters.reduce((sum, char) => sum + char.level, 0); }

        function init() {
            connectLevelUI();
            injectXPBarFill();
            createFloatLayer();
            injectCSS();
            load();
            updateUI();
        }

        function connectLevelUI() {
            const allDivs = [...document.querySelectorAll('#game-screen div')];
            DOM.levelEl = allDivs.find(d => !d.children.length && d.textContent.trim().startsWith('Lv.'));
        }

        function injectXPBarFill() {
            if (!DOM.levelEl) return;
            const xpBarContainer = DOM.levelEl.nextElementSibling;
            if (!xpBarContainer) return;

            xpBarContainer.style.position = 'relative';
            xpBarContainer.style.overflow = 'hidden';

            DOM.xpFill = document.createElement('div');
            DOM.xpFill.style.cssText = 'position:absolute; inset:0; width:0%; background:#444; transition:width 0.5s ease;';
            xpBarContainer.appendChild(DOM.xpFill);

            DOM.xpText = document.createElement('div');
            DOM.xpText.style.cssText = 'font-size:9px; color:#666; font-weight:900; margin-top:2px;';
            xpBarContainer.parentElement.appendChild(DOM.xpText);
        }

        function createFloatLayer() {
            const gameScreen = document.getElementById('game-screen');
            if (!gameScreen) return;
            DOM.floatLayer = document.createElement('div');
            DOM.floatLayer.style.cssText = 'position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden;';
            gameScreen.appendChild(DOM.floatLayer);
        }

        function injectCSS() {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes xpFloatUp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -90%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -220%) scale(1); } }
                @keyframes xpLevelPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); color: #2563eb; } }
            `;
            document.head.appendChild(style);
        }

        function updateUI() {
            const char = getCurrentChar();
            const isMax = char.level >= MAX_LEVEL;
            const required = isMax ? 0 : getXpRequired(char.level);
            const pct = isMax ? 100 : (char.xp / required * 100);

            if (DOM.levelEl) DOM.levelEl.textContent = `Lv.${char.level}`;
            if (DOM.xpFill) DOM.xpFill.style.width = `${pct}%`;
            if (DOM.xpText) DOM.xpText.textContent = isMax ? `MAX  |  유니온 Lv.${getUnionLevel()}` : `${char.xp} / ${required} XP  |  유니온 Lv.${getUnionLevel()}`;
            
            syncCharacterGraphic();
        }

        function syncCharacterGraphic() {
            const activeChar = getCurrentChar();
            const body = document.querySelector('#draggable-character > div:last-child');
            if (!body) return;
            
            if (activeChar.level >= 40) body.className = "w-full aspect-[5/6] bg-red-400 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none transition-colors duration-500";
            else if (activeChar.level >= 20) body.className = "w-full aspect-[5/6] bg-amber-300 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none transition-colors duration-500";
            else if (activeChar.level >= 10) body.className = "w-full aspect-[5/6] bg-blue-300 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none transition-colors duration-500";
            else body.className = "w-full aspect-[5/6] bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none transition-colors duration-500";
        }

        function showFloat(text, isLevelUp = false) {
            if (!DOM.floatLayer) return;
            const el = document.createElement('div');
            el.textContent = text;
            el.style.cssText = `position:absolute; left:50%; top:50%; font-size:${isLevelUp ? '24px' : '16px'}; font-weight:900; color:${isLevelUp ? '#2563eb' : '#111'}; text-shadow:1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff; white-space:nowrap; pointer-events:none; animation:xpFloatUp 1.4s ease-out forwards;`;
            DOM.floatLayer.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        // 경험치 획득 및 자동 레벨업 처리
        function gainXP(amount) {
            const char = getCurrentChar();
            if (char.level >= MAX_LEVEL) { showFloat('만렙! 새 캐릭터를 추가하세요.'); return; }
            showFloat(`+${amount} XP`);
            char.xp += amount;
            while (char.level < MAX_LEVEL && char.xp >= getXpRequired(char.level)) { char.xp -= getXpRequired(char.level); char.level++; onLevelUp(); }
            if (char.level >= MAX_LEVEL) { char.xp = 0; onGraduate(); }
            updateUI(); save();
        }

        function onLevelUp() {
            const char = getCurrentChar();
            showFloat(`🎉 Lv.${char.level} 달성!`, true);
            if (DOM.levelEl) { DOM.levelEl.style.animation = 'none'; requestAnimationFrame(() => { DOM.levelEl.style.animation = 'xpLevelPop 0.5s ease'; }); }
        }

        // 만렙 도달 시 졸업 처리 및 신규 슬롯 해금 안내
        function onGraduate() {
            showFloat(`⭐ Lv.${MAX_LEVEL} 졸업!`, true);
            setTimeout(() => showFloat(state.characters.length < MAX_SLOTS ? '새 캐릭터를 추가할 수 있습니다!' : `유니온 Lv.${getUnionLevel()} 달성!`, true), 1000);
        }

        function addSlot() {
            if (getCurrentChar().level < MAX_LEVEL || state.characters.length >= MAX_SLOTS) return false;
            state.characters.push({ level: 1, xp: 0 }); state.activeSlot = state.characters.length - 1;
            showFloat('✨ 새 캐릭터 등장!', true); updateUI(); save(); return true;
        }

        function switchSlot(index) {
            if (index < 0 || index >= state.characters.length || index === state.activeSlot) return false;
            state.activeSlot = index; updateUI(); save(); return true;
        }

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.level !== undefined && !parsed.characters) {
                    state.characters = [{ level: parsed.level, xp: parsed.xp || 0 }]; state.activeSlot = 0;
                } else { Object.assign(state, parsed); }
            } catch (e) { console.warn('Init error'); }
        }

        // 외부 UI 및 시스템에서 사용하는 전역 Questify API
        window.Questify = {
            gainXP(amount) { gainXP(amount); },
            addSlot, switchSlot, getUnionLevel,
            getCharacters: () => state.characters.map(c => ({ ...c })),
            getActiveChar: () => ({ ...getCurrentChar() }),
            getSlotInfo: () => ({ activeSlot: state.activeSlot, totalSlots: state.characters.length, maxSlots: MAX_SLOTS, canAddSlot: getCurrentChar().level >= MAX_LEVEL && state.characters.length < MAX_SLOTS, unionLevel: getUnionLevel() }),
            reset() { localStorage.removeItem(STORAGE_KEY); state = { characters: [{ level: 1, xp: 0 }], activeSlot: 0 }; updateUI(); }
        };

        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
    })();
    </script>

    <script>
        // ============================================================
        // Todo / Quiz / 저장소 / 기습퀴즈 시스템
        // 퀘스트 관리 / 문제 생성 / 저장소 / 기습 퀴즈 처리
        // ============================================================

        const APP_DATA_KEY = 'questify_app_data_v1';
        let todoList = [];
        let quizStorage = [];
        let currentActiveQuiz = null;
        let pendingMassiveReward = false; 
        // 신규 기능: 문제 수정 모드용 현재 편집 퀴즈 ID
        let editingQuizId = null; // 수정 중인 퀴즈 식별을 위한 변수 추가

        function loadAppData() {
            try {
                const data = localStorage.getItem(APP_DATA_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    todoList = parsed.todoList || [];
                    quizStorage = parsed.quizStorage || [];
                }
            } catch (e) {
                console.warn("App data load failed", e);
            }
        }

        function saveAppData() {
            localStorage.setItem(APP_DATA_KEY, JSON.stringify({ todoList, quizStorage }));
        }

        // 전체 UI 동기화 렌더링
        function renderAll() {
            renderTodoList();
            renderStorageList();
            updateProgressBar();
            saveAppData(); 
        }

        // 퀘스트 목록 렌더링 및 드래그 정렬 처리
        function renderTodoList() {
            const container = document.getElementById('quest-list-container');
            container.innerHTML = '';

            const quizzes = todoList.filter(item => item.type === 'quiz');
            const todos = todoList.filter(item => item.type === 'todo');

            todos.sort((a, b) => {
                if (a.status === 'clear' && b.status !== 'clear') return 1;
                if (a.status !== 'clear' && b.status === 'clear') return -1;
                return 0;
            });

            quizzes.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-red-50 border-[2.5px] border-red-400 rounded shadow-sm flex flex-col p-1.5 lg:p-2 min-h-[44px] md:min-h-[48px] shrink-0";
                card.innerHTML = `
                    <div class="flex justify-between items-center w-full">
                        <span class="text-red-600 font-black text-xs">[💥기습 퀴즈]</span>
                        <button onclick="openSolveModalFromQuest(${item.id})" class="bg-red-500 text-white font-bold text-[10px] md:text-xs px-3 py-1 rounded shadow-sm hover:bg-red-600 active:scale-95">도전</button>
                    </div>
                    <input type="text" value="${item.title}" class="bg-transparent text-black font-bold text-xs md:text-sm w-full outline-none mt-1" readonly>
                `;
                container.appendChild(card);
            });

            todos.forEach(item => {
                const card = document.createElement('div');
                card.className = `border-[2.5px] border-black rounded shadow-sm flex justify-between items-center p-1.5 lg:p-2 min-h-[44px] md:min-h-[48px] shrink-0 draggable-todo-item ${item.status === 'clear' ? 'bg-gray-200' : 'bg-white cursor-move'}`;
                card.setAttribute('data-id', item.id);
                card.setAttribute('data-status', item.status); // 상태 확인을 위한 속성 부여
                
                if (item.status !== 'clear') card.setAttribute('draggable', 'true');

                card.innerHTML = `
                    <div class="flex items-center w-full">
                        ${item.status !== 'clear' ? '<span class="text-gray-400 mr-2 cursor-grab drag-handle text-lg font-bold">≡</span>' : ''}
                        <input type="text" value="${item.title}" class="bg-transparent text-black font-bold text-xs md:text-sm w-full outline-none ${item.status === 'clear' ? 'line-through text-gray-500' : ''}" readonly>
                    </div>
                    <div class="flex gap-1 shrink-0 ml-2">
                        ${item.status !== 'clear' ? `<button onclick="handleTodoAction(${item.id}, 'clear')" class="bg-gray-200 text-black font-bold text-[10px] md:text-xs px-2 py-1 border border-black rounded-sm shadow-sm hover:bg-green-300 active:translate-y-px">완료</button>` : `<span class="text-xs font-black text-gray-500 px-2 py-1">완료됨</span>`}
                    </div>
                `;

                if (item.status !== 'clear') {
                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragover', handleDragOver);
                    card.addEventListener('dragend', handleDragEnd);
                    card.addEventListener('touchstart', handleTouchStart, { passive: false });
                    card.addEventListener('touchmove', handleTouchMove, { passive: false });
                    card.addEventListener('touchend', handleTouchEnd);
                }
                container.appendChild(card);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "bg-white border-[2.5px] border-black border-dashed rounded min-h-[44px] md:min-h-[48px] flex justify-center items-center hover:bg-gray-50 transition-colors shrink-0";
            addBtn.innerHTML = '<span class="text-black opacity-30 text-3xl lg:text-5xl font-bold leading-none mb-1">+</span>';
            addBtn.onclick = () => {
                let title = prompt("새로운 일일 퀘스트를 입력하세요 (최대 20자):");
                if (title && title.trim()) {
                    title = title.trim().substring(0, 20);
                    todoList.push({ id: Date.now(), type: 'todo', title: title, status: 'ready' });
                    renderAll();
                }
            };
            container.appendChild(addBtn);
        }

        // 완료된 퀘스트 비율을 진행도 바에 반영
        function updateProgressBar() {
            const todos = todoList.filter(item => item.type === 'todo');
            const total = todos.length;
            const clears = todos.filter(item => item.status === 'clear').length;
            const percent = total > 0 ? (clears / total) * 100 : 0;
            
            document.getElementById('progress-bar-fill').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${clears}/${total}`;
        }

        function renderStorageList() {
            const container = document.getElementById('storage-list-container');
            container.innerHTML = '';
            
            quizStorage.forEach(quiz => {
                const card = document.createElement('div');
                card.className = "bg-white border-[2.5px] border-black rounded shadow-sm flex flex-col p-2 min-h-[60px] md:min-h-[72px] shrink-0 relative gap-2 cursor-pointer hover:bg-gray-50 transition-colors";
                card.setAttribute('onclick', `openEditModal(${quiz.id}, event)`); // 클릭 시 편집 모달 호출
                card.innerHTML = `
                    <div class="text-black text-xs md:text-sm font-bold truncate pr-6 pointer-events-none">${quiz.title}</div>
                    <div class="flex justify-between items-end mt-auto pointer-events-none">
                        <span class="bg-gray-200 border border-black text-black text-[9px] md:text-[10px] px-2 py-0.5 rounded-full pointer-events-none">저장된 문제</span>
                        <div class="flex gap-1 pointer-events-auto">
                            <button onclick="event.stopPropagation(); deleteQuizFromStorage(${quiz.id})" class="bg-gray-300 border-[2px] border-black rounded px-3 py-1 text-black font-bold text-[10px] md:text-xs shadow hover:bg-red-300 active:scale-95 transition-all">삭제</button>
                            <button onclick="event.stopPropagation(); openSolveModalFromStorage(${quiz.id})" class="bg-gray-200 border-[2px] border-black rounded px-3 py-1 text-black font-bold text-[10px] md:text-xs shadow hover:bg-gray-300 active:scale-95 transition-all">다시풀기</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "bg-white border-[2.5px] border-black border-dashed rounded min-h-[44px] md:min-h-[48px] flex justify-center items-center hover:bg-gray-50 transition-colors shrink-0";
            addBtn.innerHTML = '<span class="text-black opacity-40 text-3xl md:text-4xl font-bold leading-none mb-1">+</span>';
            addBtn.onclick = () => {
                editingQuizId = null; // 초기화
                document.getElementById('input-quiz-title').value = '';
                document.getElementById('input-quiz-content').value = '';
                document.getElementById('input-quiz-answer').value = '';
                document.getElementById('btn-submit-create').innerText = '제작';
                openSpecificModal('create-modal');
            };
            container.appendChild(addBtn);
        }

        window.handleTodoAction = function(id, action) {
            const idx = todoList.findIndex(item => item.id === id);
            if (idx === -1) return;
            if (action === 'clear') {
                todoList[idx].status = 'clear';
                if (window.Questify) window.Questify.gainXP(20); 
            }
            renderAll();
        };

        // 문제 편집 모달 열기 기능 추가
        window.openEditModal = function(id, e) {
            const quiz = quizStorage.find(q => q.id === id);
            if (!quiz) return;
            
            editingQuizId = id;
            document.getElementById('input-quiz-title').value = quiz.title;
            document.getElementById('input-quiz-content').value = quiz.content;
            document.getElementById('input-quiz-answer').value = quiz.answer;
            document.getElementById('btn-submit-create').innerText = '수정';
            
            openSpecificModal('create-modal');
        };

        document.getElementById('btn-trigger-surprise').addEventListener('click', () => {
            if (quizStorage.length === 0) return alert("저장된 문제가 없습니다! 먼저 문제를 만들어주세요.");
            
            // 현재 일일 퀘스트에 없는 퀴즈들만 필터링
            const availableQuizzes = quizStorage.filter(q => !todoList.some(item => item.type === 'quiz' && item.originQuizId === q.id));
            
            if (availableQuizzes.length === 0) return alert("모든 문제가 이미 일일퀘스트에 등록되어 있습니다.");
            
            // 남은 퀴즈 안에서만 랜덤 선택
            const randomQuiz = availableQuizzes[Math.floor(Math.random() * availableQuizzes.length)];
            todoList.unshift({ id: Date.now(), type: 'quiz', title: randomQuiz.title, originQuizId: randomQuiz.id });
            renderAll();
            alert("💥 기습 퀴즈가 일일퀘스트 상단에 추가되었습니다!");
        });

        window.deleteQuizFromStorage = function(quizId) {
            if(confirm("이 문제를 정말로 삭제하시겠습니까?")) {
                quizStorage = quizStorage.filter(q => q.id !== quizId);
                todoList = todoList.filter(item => !(item.type === 'quiz' && item.originQuizId === quizId));
                renderAll();
            }
        };

        const modalOverlay = document.getElementById('modal-overlay');
        const modals = document.querySelectorAll('.modal-content');
        
        function openSpecificModal(modalId) {
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            modals.forEach(m => m.classList.add('hidden'));
            document.getElementById(modalId).classList.remove('hidden');
        }

        document.querySelectorAll('.close-modal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('flex');
                currentActiveQuiz = null;
                editingQuizId = null; // 초기화 추가
                
                if (pendingMassiveReward) {
                    alert("문제 생성을 취소하여 경험치 획득 기회가 소멸되었습니다.");
                    pendingMassiveReward = false;
                }
            });
        });

        document.getElementById('btn-submit-create').addEventListener('click', () => {
            const title = document.getElementById('input-quiz-title').value.trim();
            const content = document.getElementById('input-quiz-content').value.trim();
            const answer = document.getElementById('input-quiz-answer').value.trim();

            if (!title || !content || !answer) return alert("모든 빈칸을 채워주세요!");

            if (editingQuizId) {
                // 수정 모드
                const quizIndex = quizStorage.findIndex(q => q.id === editingQuizId);
                if (quizIndex !== -1) {
                    quizStorage[quizIndex].title = title;
                    quizStorage[quizIndex].content = content;
                    quizStorage[quizIndex].answer = answer;
                    
                    // 기 등록된 기습퀴즈의 제목도 동기화 
                    todoList.forEach(item => {
                        if (item.type === 'quiz' && item.originQuizId === editingQuizId) item.title = title;
                    });
                }
                alert("문제가 성공적으로 수정되었습니다.");
                editingQuizId = null;
            } else {
                // 신규 제작 모드
                quizStorage.push({ id: Date.now(), title, content, answer });
                if (pendingMassiveReward) {
                    if (window.Questify) window.Questify.gainXP(50); 
                    alert("축하합니다! 문제 생성 50 경험치를 획득했습니다!");
                    pendingMassiveReward = false; 
                } else {
                    alert("문제가 성공적으로 저장되었습니다.");
                }
            }

            document.getElementById('modal-overlay').classList.add('hidden');
            renderAll();
        });

        window.openSolveModalFromStorage = function(quizId) {
            const quiz = quizStorage.find(q => q.id === quizId);
            if (quiz) setupSolveModal(quiz, false);
        };
        window.openSolveModalFromQuest = function(todoQuizId) {
            const todoItem = todoList.find(item => item.id === todoQuizId);
            if (!todoItem) return;
            const quiz = quizStorage.find(q => q.id === todoItem.originQuizId);
            if (quiz) setupSolveModal(quiz, true, todoQuizId);
        };

        function setupSolveModal(quiz, isSurprise, todoQuizId = null) {
            currentActiveQuiz = { ...quiz, isSurprise, todoQuizId };
            document.getElementById('solve-quiz-title').innerText = quiz.title;
            document.getElementById('solve-quiz-content').innerText = quiz.content;
            document.getElementById('input-solve-answer').value = '';
            
            document.getElementById('solve-input-state').classList.remove('hidden');
            document.getElementById('solve-result-state').classList.add('hidden');
            openSpecificModal('solve-modal');
        }

        document.getElementById('btn-grade-problem').addEventListener('click', () => {
            if (!currentActiveQuiz) return;
            const userAnswer = document.getElementById('input-solve-answer').value.trim();
            const isCorrect = userAnswer.toLowerCase() === currentActiveQuiz.answer.toLowerCase();

            document.getElementById('solve-input-state').classList.add('hidden');
            const resultBox = document.getElementById('solve-result-state');
            resultBox.classList.remove('hidden');

            if (isCorrect) {
                resultBox.className = "w-full bg-green-100 border-[2.5px] border-green-500 rounded-xl px-3 py-2 text-center text-sm md:text-base font-bold text-green-700 h-24 md:h-28 flex items-center justify-center";
                resultBox.innerText = "⭕ 정답입니다! 경험치를 획득했습니다.";
                // 정답 처리 후에는 오답 클릭 이벤트를 비워 둔다.
                resultBox.onclick = null; // 이전 오답 이벤트가 남아있지 않도록 제거
                
                if (window.Questify) {
                    if (currentActiveQuiz.isSurprise) window.Questify.gainXP(30); 
                    else window.Questify.gainXP(20); 
                }
                if (currentActiveQuiz.isSurprise && currentActiveQuiz.todoQuizId) {
                    const idx = todoList.findIndex(item => item.id === currentActiveQuiz.todoQuizId);
                    if (idx !== -1) todoList.splice(idx, 1);
                    renderAll();
                }
            } else {
                // 신규 기능: 오답 박스를 터치하면 정답을 즉시 공개
                resultBox.className = "w-full bg-red-100 border-[2.5px] border-red-500 rounded-xl px-3 py-2 text-center text-sm md:text-base font-bold text-red-700 h-24 md:h-28 flex flex-col items-center justify-center cursor-pointer select-none hover:bg-red-200 transition-colors";
                resultBox.innerHTML = `
                    <div>❌ 오답입니다! (입력: ${userAnswer})</div>
                    <div class="text-xs text-red-600 mt-1.5 opacity-80 animate-pulse">터치하면 정답이 표시됩니다.</div>
                `;
                resultBox.onclick = function() {
                    resultBox.innerHTML = `
                        <div>❌ 오답입니다! (입력: ${userAnswer})</div>
                        <div class="text-sm md:text-base font-black text-blue-700 mt-1">정답: ${currentActiveQuiz.answer}</div>
                    `;
                    resultBox.onclick = null;
                    resultBox.classList.remove('cursor-pointer', 'hover:bg-red-200');
                };
            }
        });

        const timerDisplay = document.getElementById('timer-display');
        const startTimerBtn = document.getElementById('start-timer-btn');
        const resetTimerBtn = document.getElementById('reset-timer-btn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        
        let totalSeconds = 0;
        let timerInterval = null;
        let timerRunning = false;
        let timerPaused = false;

        const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }
        function totalSecondsFromDigits(digits) {
            const h = Number(`${digits[0]}${digits[1]}`) || 0;
            const m = Number(`${digits[2]}${digits[3]}`) || 0;
            const s = Number(`${digits[4]}${digits[5]}`) || 0;
            return (h * 3600) + (m * 60) + s;
        }
        function updateDisplays() { timerDisplay.value = formatTime(totalSeconds); }

        function startTimer() {
            if (totalSeconds <= 0) return;
            timerRunning = true; timerPaused = false;
            startTimerBtn.innerText = '일시정지'; timerDisplay.disabled = true;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerPaused) return; 
                if (totalSeconds > 0) { totalSeconds--; updateDisplays(); }
                if (totalSeconds <= 0) {
                    totalSeconds = 0; updateDisplays(); stopTimer();
                    
                    alert('⏰ 집중 시간이 끝났습니다!\n\n문제를 생성하면 50 경험치를 얻습니다!');
                    pendingMassiveReward = true; 
                    editingQuizId = null; 
                    
                    document.getElementById('input-quiz-title').value = '';
                    document.getElementById('input-quiz-content').value = '';
                    document.getElementById('input-quiz-answer').value = '';
                    document.getElementById('btn-submit-create').innerText = '제작';
                    openSpecificModal('create-modal');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null; timerRunning = false; timerPaused = false;
            startTimerBtn.innerText = '시작'; timerDisplay.disabled = false;
        }

        startTimerBtn.addEventListener('click', () => {
            if (timerRunning) { timerPaused = !timerPaused; startTimerBtn.innerText = timerPaused ? '계속' : '일시정지'; }
            else startTimer();
        });
        resetTimerBtn.addEventListener('click', () => { stopTimer(); totalSeconds = 0; updateDisplays(); });
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (timerRunning && !timerPaused) return; 
                totalSeconds += parseInt(btn.getAttribute('data-time'));
                if(totalSeconds > 359999) totalSeconds = 359999; 
                updateDisplays();
            });
        });

        timerDisplay.addEventListener('keydown', (e) => {
            if (timerRunning) { e.preventDefault(); return; }
            if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return;
            e.preventDefault();

            let digits = timerDisplay.value.replace(/:/g, '').split('');
            const start = timerDisplay.selectionStart;
            let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start);
            if (digitIndex === -1) digitIndex = 5;

            if (/\d/.test(e.key)) {
                digits[digitIndex] = e.key; totalSeconds = totalSecondsFromDigits(digits); updateDisplays();
                let nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1;
                timerDisplay.setSelectionRange(nextPos, nextPos);
            } else if (e.key === 'Backspace') {
                let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1;
                if (start === timerDisplay.value.length) targetIdx = 5;
                if (targetIdx >= 0) {
                    digits[targetIdx] = '0'; totalSeconds = totalSecondsFromDigits(digits); updateDisplays();
                    let nextPos = DIGIT_POSITIONS[targetIdx]; timerDisplay.setSelectionRange(nextPos, nextPos);
                }
            } else if (e.key === 'Delete') {
                 let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start);
                 if(targetIdx !== -1) {
                    digits[targetIdx] = '0'; totalSeconds = totalSecondsFromDigits(digits); updateDisplays();
                    timerDisplay.setSelectionRange(start, start);
                 }
            }
        });
        timerDisplay.addEventListener('click', (e) => {
            const start = timerDisplay.selectionStart;
            if (!DIGIT_POSITIONS.includes(start) && start !== 8) {
                const nextPos = DIGIT_POSITIONS.find(pos => pos > start) || 8;
                timerDisplay.setSelectionRange(nextPos-1, nextPos-1);
            }
        });

        let dragSrcEl = null;

        function handleDragStart(e) {
            dragSrcEl = this;
            this.style.opacity = '0.4';
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.getAttribute('data-id'));
        }
        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            // 완료된 퀘스트(status: clear) 위로는 드래그/침범 금지
            if (this !== dragSrcEl && this.classList.contains('draggable-todo-item') && this.getAttribute('data-status') !== 'clear') {
                const children = Array.from(this.parentNode.querySelectorAll('.draggable-todo-item'));
                if (children.indexOf(dragSrcEl) < children.indexOf(this)) this.after(dragSrcEl);
                else this.before(dragSrcEl);
            }
            return false;
        }
        function handleDragEnd() {
            this.style.opacity = '1';
            reorderTodoListData();
        }

        let touchStartEl = null;
        function handleTouchStart(e) {
            if (!e.target.classList.contains('drag-handle')) return;
            touchStartEl = this;
            this.style.opacity = '0.4';
        }
        function handleTouchMove(e) {
            if (!touchStartEl) return;
            e.preventDefault(); 
            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!targetEl) return;
            const itemEl = targetEl.closest('.draggable-todo-item');
            
            // 완료된 퀘스트(status: clear) 위로는 드래그/침범 금지
            if (itemEl && itemEl !== touchStartEl && itemEl.getAttribute('data-status') !== 'clear') {
                const children = Array.from(this.parentNode.querySelectorAll('.draggable-todo-item'));
                if (children.indexOf(touchStartEl) < children.indexOf(itemEl)) itemEl.after(touchStartEl);
                else itemEl.before(touchStartEl);
            }
        }
        function handleTouchEnd() {
            if (!touchStartEl) return;
            touchStartEl.style.opacity = '1';
            touchStartEl = null;
            reorderTodoListData();
        }

        function reorderTodoListData() {
            const currentDOMIds = Array.from(document.querySelectorAll('.draggable-todo-item')).map(el => parseInt(el.getAttribute('data-id')));
            const quizzes = todoList.filter(item => item.type === 'quiz');
            // 완료된 퀘스트는 정렬에 관여하지 않고 언제나 무조건 배열의 맨 뒤로 고정
            const completedTodos = todoList.filter(item => item.type === 'todo' && item.status === 'clear');
            const activeTodos = todoList.filter(item => item.type === 'todo' && item.status !== 'clear');

            activeTodos.sort((a, b) => currentDOMIds.indexOf(a.id) - currentDOMIds.indexOf(b.id));
            todoList = [...quizzes, ...activeTodos, ...completedTodos];
            saveAppData(); 
        }

        const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
        const leftPanel = document.getElementById('left-panel');
        const rightPanelWrapper = document.getElementById('right-panel-wrapper');
        
        mobileToggleBtn.addEventListener('click', () => {
            const isCollapsed = rightPanelWrapper.classList.toggle('mobile-collapsed');
            if (isCollapsed) {
                leftPanel.classList.replace('h-[45%]', 'h-[calc(100%-56px)]');
            } else {
                leftPanel.classList.replace('h-[calc(100%-56px)]', 'h-[45%]');
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) { 
                rightPanelWrapper.classList.remove('mobile-collapsed');
                leftPanel.classList.replace('h-[calc(100%-56px)]', 'h-[45%]'); 
            }
        });

        const gameScreen = document.getElementById('game-screen');
        const timerScreen = document.getElementById('timer-screen');
        const openTimerBtn = document.getElementById('open-timer-btn');
        const closeTimerBtn = document.getElementById('close-timer-btn');
        
        function toggleTimerScreen() {
            if (timerScreen.classList.contains('hidden')) {
                gameScreen.classList.add('hidden');
                timerScreen.classList.remove('hidden');
                timerScreen.classList.add('block'); 
                openTimerBtn.classList.replace('bg-white', 'bg-gray-300'); 
            } else {
                timerScreen.classList.add('hidden');
                timerScreen.classList.remove('block');
                gameScreen.classList.remove('hidden');
                openTimerBtn.classList.replace('bg-gray-300', 'bg-white');
            }
        }
        openTimerBtn.addEventListener('click', toggleTimerScreen);
        closeTimerBtn.addEventListener('click', toggleTimerScreen);

        const tabQuest = document.getElementById('tab-quest');
        const panelQuest = document.getElementById('panel-quest');
        const tabStorage = document.getElementById('tab-storage');
        const panelStorage = document.getElementById('panel-storage');
        
        tabStorage.addEventListener('click', () => {
            panelQuest.classList.add('hidden'); panelStorage.classList.remove('hidden');
            tabStorage.className = "flex-1 bg-white border-black border-l-[3px] flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all";
            tabStorage.querySelector('span').className = "text-black font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
            tabQuest.className = "flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors";
            tabQuest.querySelector('span').className = "text-gray-500 font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
        });
        
        tabQuest.addEventListener('click', () => {
            panelStorage.classList.add('hidden'); panelQuest.classList.remove('hidden');
            tabQuest.className = "flex-1 bg-white border-black border-r-[3px] flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all";
            tabQuest.querySelector('span').className = "text-black font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
            tabStorage.className = "flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors";
            tabStorage.querySelector('span').className = "text-gray-500 font-bold text-[2vh] md:text-[2vh] lg:text-[3vh] flex items-center gap-1 md:gap-2";
        });

        document.getElementById('user-profile-card').addEventListener('click', () => {
            renderSlotInventory();
            openSpecificModal('slot-modal');
        });

        function renderSlotInventory() {
            if (!window.Questify) return;
            const info = window.Questify.getSlotInfo();
            const characters = window.Questify.getCharacters();
            const container = document.getElementById('slot-manager-container');
            
            document.getElementById('union-level-display').innerText = `전체 유니온 Lv.${info.unionLevel}`;
            container.innerHTML = '';
            
            characters.forEach((char, index) => {
                const slotCard = document.createElement('div');
                const isActive = (index === info.activeSlot);
                
                slotCard.className = `p-3 rounded-lg border-[3px] flex flex-col gap-1 shadow-sm transition-all ${isActive ? 'border-blue-500 bg-blue-50' : 'border-black bg-gray-50'}`;
                slotCard.innerHTML = `
                    <div class="font-black text-sm md:text-base flex justify-between items-center">
                        <span>슬롯 #${index + 1}</span>
                        ${isActive ? '<span class="text-xs bg-blue-500 text-white px-2 py-0.5 rounded-full">현재 육성중</span>' : ''}
                        ${char.level >= 50 && !isActive ? '<span class="text-xs bg-yellow-400 text-black px-2 py-0.5 rounded-full font-bold">졸업</span>' : ''}
                    </div>
                    <div class="text-xs md:text-sm text-gray-700 font-bold mt-1">
                        <span class="inline-block w-[60px]">레벨:</span> Lv.${char.level}
                    </div>
                    <div class="text-xs md:text-sm text-gray-700 font-bold">
                        <span class="inline-block w-[60px]">현재 XP:</span> ${char.xp}
                    </div>
                    <button onclick="Questify.switchSlot(${index}); renderSlotInventory();" class="mt-2 bg-white border-[2.5px] border-black rounded py-1.5 text-xs font-black hover:bg-gray-200 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition-all" ${isActive ? 'disabled' : ''}>
                        ${isActive ? '선택됨' : '이 캐릭터로 스위치 전환'}
                    </button>
                `;
                container.appendChild(slotCard);
            });
            
            const addSlotBtn = document.getElementById('btn-add-new-character');
            addSlotBtn.disabled = !info.canAddSlot;
            addSlotBtn.onclick = () => {
                if (window.Questify.addSlot()) renderSlotInventory();
            };
        }

        const draggableCharacter = document.getElementById('draggable-character');
        const gameScreenBox = document.getElementById('game-screen');
        let isCharDragging = false, charStartX, charStartY, charInitialLeft, charInitialTop;

        function startCharDrag(e) {
            if (gameScreenBox.classList.contains('hidden')) return;
            isCharDragging = true;
            draggableCharacter.classList.replace('cursor-grab', 'cursor-grabbing');
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            charStartX = clientX; charStartY = clientY;
            const rect = draggableCharacter.getBoundingClientRect();
            const parentRect = gameScreenBox.getBoundingClientRect();
            charInitialLeft = rect.left - parentRect.left; charInitialTop = rect.top - parentRect.top;
            draggableCharacter.style.bottom = 'auto'; draggableCharacter.style.transform = 'none';
            draggableCharacter.style.left = `${charInitialLeft}px`; draggableCharacter.style.top = `${charInitialTop}px`;
        }
        function dragChar(e) {
            if (!isCharDragging) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            let newLeft = charInitialLeft + (clientX - charStartX); let newTop = charInitialTop + (clientY - charStartY);
            const parentRect = gameScreenBox.getBoundingClientRect(); const rect = draggableCharacter.getBoundingClientRect();
            if (newLeft < 0) newLeft = 0; if (newTop < 0) newTop = 0;
            if (newLeft + rect.width > parentRect.width) newLeft = parentRect.width - rect.width;
            if (newTop + rect.height > parentRect.height) newTop = parentRect.height - rect.height;
            draggableCharacter.style.left = `${newLeft}px`; draggableCharacter.style.top = `${newTop}px`;
        }
        function endCharDrag() {
            if (!isCharDragging) return;
            isCharDragging = false;
            draggableCharacter.classList.replace('cursor-grabbing', 'cursor-grab');
        }

        draggableCharacter.addEventListener('mousedown', startCharDrag);
        document.addEventListener('mousemove', dragChar);
        document.addEventListener('mouseup', endCharDrag);
        draggableCharacter.addEventListener('touchstart', startCharDrag, { passive: false });
        document.addEventListener('touchmove', dragChar, { passive: false });
        document.addEventListener('touchend', endCharDrag);

        const resizeObserver = new ResizeObserver(() => {
            if (draggableCharacter.style.transform === 'none') {
                const parentRect = gameScreenBox.getBoundingClientRect();
                const rect = draggableCharacter.getBoundingClientRect();
                let currentLeft = draggableCharacter.offsetLeft; let currentTop = draggableCharacter.offsetTop;
                if (currentLeft + rect.width > parentRect.width) currentLeft = parentRect.width - rect.width;
                if (currentTop + rect.height > parentRect.height) currentTop = parentRect.height - rect.height;
                if (currentLeft < 0) currentLeft = 0; if (currentTop < 0) currentTop = 0;
                draggableCharacter.style.left = `${currentLeft}px`; draggableCharacter.style.top = `${currentTop}px`;
            }
        });
        resizeObserver.observe(gameScreenBox);

        document.getElementById('btn-reset-all-data').addEventListener('click', () => {
            if (confirm("⚠️ 경고: 모든 캐릭터 성장, 퀘스트, 문제 데이터가 완전히 삭제되며 복구할 수 없습니다.\\n\\n정말 모든 데이터를 삭제하시겠습니까?")) {
                localStorage.clear();
                location.reload();
            }
        });

        loadAppData();
        renderAll();

    </script>
</body>
</html>
