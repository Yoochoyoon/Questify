<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <title>Questify</title>
</head>

<body>
  <div class="app">
    <!-- 좌측 영역: 게임 상태, 캐릭터, 집중 타이머를 포함하는 컨테이너 화면이다. -->
    <div id="left-panel" class="panel">
      <!-- 메인 게임 렌더링 화면이다. -->
      <div id="game-screen" class="screen">
        <div class="top-hud">
          <div>
            <h2 class="goal-title">오늘의 목표</h2>
            <div class="progress-wrap">
              <div id="progress-bar-fill"></div>
              <span id="progress-text">0/0</span>
            </div>
          </div>
          <!-- 유니온 전체 레벨을 나타내며, 클릭 시 캐릭터 슬롯 모달을 호출한다. -->
          <div id="user-profile-card" tabindex="0">
            <div class="profile-name">유니온(전체) 현황</div>
            <div class="profile-level" id="union-level-hud">유니온 Lv.1</div>
          </div>
        </div>
        <!-- DOM 상에 로비 캐릭터 요소들이 동적으로 추가되는 빈 컨테이너이다. -->
        <div id="lobby-container"></div>
      </div>

      <!-- 집중 타이머 화면: 타이머 버튼 클릭 시 디스플레이되며 게임 화면은 감춘다. -->
      <div id="timer-screen" class="screen hidden">
        <!-- 타이머 개시 전 동반 캐릭터를 선택하는 오버레이이다. -->
        <div id="timer-char-select" class="timer-char-select-overlay">
          <div class="timer-char-select-box">
            <h3 class="timer-char-select-title">함께 공부할 캐릭터를 선택하세요!</h3>
            <div id="timer-char-grid" class="timer-char-grid"></div>
            <button id="close-timer-select-btn" class="danger-btn" style="width:100%; padding: 8px;">메인으로 돌아가기</button>
          </div>
        </div>

        <!-- 실질적인 타이머 조작 및 카운트다운이 수행되는 메인 화면이다. -->
        <div id="timer-main" class="hidden">
          <button id="close-timer-btn" class="round-close">X</button>
          <div class="timer-layout">
            <div class="timer-top">
              <div id="speech-bubble">
                <div class="bubble">
                  <p style="margin:0;">타이머로 공부 시간을 설정하자!</p>
                </div>
              </div>
              <div class="timer-character">
                <div class="timer-char-img-wrap">
                  <div class="timer-char-hud">
                    <div class="timer-char-hud-name" id="timer-char-hud-name">이름</div>
                    <div class="timer-char-hud-level" id="timer-char-hud-level">Lv.1</div>
                    <div class="timer-char-hud-xpbar">
                      <div class="timer-char-hud-xpfill" id="timer-char-hud-xpfill"></div>
                    </div>
                  </div>
                  <div class="char-body" id="timer-main-char-body" style="width: 100%; position: relative;"></div>
                </div>
              </div>
            </div>
            <!-- 타이머 시간 입력 및 작동(시작, 일시정지, 프리셋)을 지원하는 하단 패널이다. -->
            <div class="timer-card">
              <div class="timer-display-wrap">
                <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8">
              </div>
              <div class="row">
                <button class="preset-btn" data-time="3600">+ 1h</button>
                <button class="preset-btn" data-time="1800">+ 30m</button>
                <button class="preset-btn" data-time="5">+ 5s</button>
              </div>
              <div class="row">
                <button id="reset-timer-btn">초기화</button>
                <button id="start-timer-btn">시작</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 타이머 완료 시 보상 안내 및 메모 작성 여부를 결정하는 결과창이다. -->
        <div id="timer-result-overlay" class="hidden">
          <div class="timer-result-box">
            <div class="timer-result-char-name" id="result-char-name">캐릭터 이름</div>
            <div class="timer-result-xp-badge" id="result-xp-badge">+50 XP 획득!</div>
            <div class="timer-result-lv" id="result-lv-text">Lv.1</div>
            <p class="timer-result-msg">메모를 남기시겠습니까?</p>
            <div class="timer-result-btns">
              <button id="result-btn-memo" class="timer-result-btn memo">📝 메모 작성</button>
              <button id="result-btn-skip" class="timer-result-btn skip">건너뛰기</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 영역: 사용자의 퀘스트 및 시스템 저장소 내역을 관리하는 뷰이다. -->
    <div id="right-panel-wrapper" class="panel">
      <!-- 모바일 전환용 햄버거 토글 버튼이다. -->
      <button id="mobile-toggle-btn">☰</button>

      <!-- 사용자 일일 투두(할일) 리스트 및 로그 기록을 담당하는 패널 영역이다. -->
      <div id="panel-quest" class="panel-view">
        <div style="position: relative;">
          <div
            style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; z-index: 10; align-items: center;">
            <button id="btn-toggle-log" class="mini-btn" style="margin: 0;">로그</button>
            <!-- 삭제된 btn-clear-log -->
          </div>
          <h1 class="panel-title" id="quest-panel-title">일일퀘스트</h1>
        </div>
        <span id="quest-subtext" class="subtext" style="display: inline-block; padding-bottom: 6px;">+를 눌러 오늘의 퀘스트를
          추가하세요!</span>
        <div id="quest-list-container" class="list"></div>
      </div>

      <!-- AI가 생성한 퀴즈 문제 목록을 저장 및 제공하는 패널 영역이다. -->
      <div id="panel-storage" class="panel-view hidden">
        <h1 class="panel-title">퀴즈퀘스트</h1>
        <div id="storage-list-container" class="list"></div>
      </div>

      <!-- 타이머 스크린을 오버레이로 호출하기 위한 진입점 버튼이다. -->
      <div id="open-timer-btn" tabindex="0" onclick="toggleTimerScreen()">
        <img src="타이머.png" alt="timer-icon"
          onerror="this.style.display='none'; this.parentElement.innerText='⏱️'; this.parentElement.style.fontSize='30px';"
          style="width: 50px; pointer-events: none;">
      </div>

      <!-- 일일퀘스트와 퀴즈퀘스트 패널을 전환하는 하단 내비게이션 탭이다. -->
      <div id="bottom-tab-bar">
        <div id="tab-quest" class="tab active" tabindex="0">
          <div class="tab-ui-highlight"></div>
          일일퀘스트
        </div>
        <div id="tab-storage" class="tab" tabindex="0">
          <div class="tab-ui-highlight"></div>
          퀴즈퀘스트
        </div>
      </div>
    </div>

    <!-- UI 상단에 표출될 전역 오버레이 기반 모달 그룹이다. -->
    <div id="modal-overlay" class="hidden">

      <!-- 학습 메모 목록을 조회하고 편집할 수 있는 모달이다. -->
      <div id="char-memo-modal" class="modal-content hidden">
        <button class="close-modal-btn">X</button>
        <h2 id="char-memo-title" style="text-align:center; margin-top:0;">학습 메모</h2>

        <!-- [수정] 퀴즈 출제 유형을 개별 캐릭터에 귀속시켜 체크박스 형태로 제공하는 설정 영역이다. -->
        <div class="quiz-type-selection"
          style="margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 6px;">
          <label style="font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px;">출제할 퀴즈 유형 지정 (캐릭터별
            저장)</label>
          <div style="display: flex; gap: 15px; font-size: 13px;">
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
              <input type="checkbox" id="quiz-type-ox" value="ox" checked> OX 퀴즈
            </label>
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
              <input type="checkbox" id="quiz-type-multiple" value="multiple" checked> 객관식
            </label>
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
              <input type="checkbox" id="quiz-type-short" value="short" checked> 주관식 단답형
            </label>
          </div>
        </div>

        <!-- 작성된 메모들이 동적으로 삽입되는 컨테이너 공간이다. -->
        <div id="char-memo-list"
          style="flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding: 2px;">
        </div>
        <button id="btn-open-notepad" class="submit-btn" style="width:100%; margin-top:auto;">+ 새 메모 작성</button>
      </div>

      <!-- 새로운 학습 메모를 타이핑하여 등록하는 편집 폼 모달이다. -->
      <div id="notepad-modal" class="modal-content hidden">
        <button class="close-modal-btn">X</button>
        <h2 style="text-align:center; margin-top:0;">학습 메모장</h2>
        <div style="font-size:12px; color:#4b5563; margin-bottom:8px; text-align:center;"
          id="notepad-target-char-label"></div>
        <textarea id="input-notepad-content" class="area" placeholder="공부한 내용을 이곳에 메모하세요! (줄바꿈: Enter, 저장 및 창 닫기: Esc)"
          onkeydown="if(event.key==='Escape'){ event.preventDefault(); window.submitNotepad(); }"></textarea>
        <button id="btn-submit-notepad" class="submit-btn" style="background:#59A3F8; margin-top:auto;">저장</button>
      </div>

      <!-- AI 퀴즈 및 일반 퀴즈 풀이를 담당하는 문답 전용 모달이다. -->
      <div id="solve-modal" class="modal-content hidden">
        <button class="close-modal-btn">X</button>
        <div id="solve-quiz-title" class="fake-field" tabindex="0">문제 제목</div>
        <div id="solve-quiz-content" class="fake-field" tabindex="0">문제 내용</div>
        <div id="solve-input-state" style="display:flex; flex-direction:column; gap:12px;">
          <!-- 주관식 입력 필드이다. 엔터 입력 시 자동 채점 트리거를 발생시킨다. -->
          <textarea id="input-solve-answer" class="field" placeholder="정답을 적어주세요 (엔터 시 채점)"
            onkeydown="if(event.key==='Enter' && !event.isComposing){ event.preventDefault(); this.blur(); document.getElementById('btn-grade-problem').click(); }"></textarea>

          <!-- O/X 문제 해결을 위한 버튼 영역이다. 조건부 렌더링으로 표시/숨김 처리된다. -->
          <!-- O/X 버튼 크기 조정 및 색상 변경 반영 -->
          <div id="ox-buttons" class="hidden" style="display: flex; gap: 10px;">
            <button id="btn-ox-o" class="submit-btn"
              style="flex: 1; height: 120px; font-size: 60px; background: #4a90e2;">O</button>
            <button id="btn-ox-x" class="submit-btn"
              style="flex: 1; height: 120px; font-size: 60px; background: #d9534f;">X</button>
          </div>

          <!-- 객관식 보기 전용 동적 렌더링 컨테이너이다. -->
          <div id="multiple-choice-buttons" class="hidden" style="display: flex; flex-direction: column; gap: 8px;">
          </div>
          <button id="btn-grade-problem" class="submit-btn">채점</button>
        </div>
        <!-- 채점 후 정답 여부를 피드백해주는 영역이다. -->
        <div id="solve-result-state" class="hidden" tabindex="0"></div>
      </div>

      <!-- 계정 내 캐릭터 풀(Pool)을 전반적으로 관리하는 슬롯 모달이다. -->
      <div id="slot-modal" class="modal-content hidden">
        <div class="slot-btn-row">
          <button id="btn-reset-all-data" style="padding:0 5px; width: 80x; height: 30px;">전체 데이터 삭제</button>
          <button id="btn-api-key" style="padding:0 5px; width: 68px; height: 30px;">API키 설정</button>
        </div>

        <button class="close-modal-btn">X</button>
        <h2 id="union-level-display">전체 유니온 Lv.0</h2>

        <div id="slot-manager-container"></div>
        <div
          style="display:flex; flex-direction:column; gap:8px; margin-top:16px; width:100%; justify-content: center; align-items: center;">
          <div style="display:flex; gap:8px; width: 100%; max-width: 400px;">
          </div>
          <button id="btn-add-new-character" class="submit-btn"
            style="width: 100%; max-width: 400px; padding: 16px; font-size: 18px; background: #e8ef08; color: #362a16; border-radius:8px;">새
            캐릭터 추가</button>
        </div>
      </div>
    </div>

    <!-- 브라우저의 기본 alert, confirm을 대체하기 위해 별도 구축된 다이얼로그 전용 오버레이이다. -->
    <div id="dialog-overlay" class="hidden">
      <!-- 단순 정보 전달을 위한 커스텀 Alert 박스이다. -->
      <div id="custom-alert" class="modal-content modal-mini hidden">
        <h3 style="text-align:center; margin-top:0;">알림</h3>
        <p id="custom-alert-msg"
          style="text-align:center; margin-bottom: 20px; font-size: 14px; white-space: pre-line; word-break: keep-all;">
        </p>
        <button id="custom-alert-btn" class="submit-btn" style="width: 100%; margin-top:auto;">확인</button>
      </div>

      <!-- 사용자의 선택(승인/취소)을 요구하는 커스텀 Confirm 박스이다. -->
      <div id="custom-confirm" class="modal-content modal-mini hidden">
        <h3 style="text-align:center; margin-top:0;">확인</h3>
        <p id="custom-confirm-msg"
          style="text-align:center; margin-bottom: 20px; font-size: 14px; white-space: pre-line; word-break: keep-all;">
        </p>
        <div style="display:flex; gap:10px; margin-top:auto;">
          <button id="custom-confirm-cancel" class="danger-btn" style="flex:1;">취소</button>
          <button id="custom-confirm-ok" class="submit-btn" style="flex:1;">확인</button>
        </div>
      </div>

      <!-- 사용자의 텍스트 입력을 요구하는 커스텀 Prompt 박스이다. -->
      <div id="custom-prompt" class="modal-content modal-mini hidden">
        <h3 id="custom-prompt-title" style="text-align:center; margin-top:0;">입력</h3>
        <!-- 수정됨: 엔터를 입력했을 때 이벤트 전파를 제어하여 모달이 부적절하게 강제 닫히는 현상을 방지한다. 포커스만 [확인] 버튼으로 이관한다. -->
        <input type="text" id="custom-prompt-input" class="field" style="margin-bottom: 20px;"
          onkeydown="if(event.key==='Enter' && !event.isComposing) { event.preventDefault(); event.stopPropagation(); document.getElementById('custom-prompt-ok').focus(); }">
        <div style="display:flex; gap:10px; margin-top:auto;">
          <button id="custom-prompt-cancel" class="danger-btn" style="flex:1;">취소</button>
          <button id="custom-prompt-ok" class="submit-btn" style="flex:1;">확인</button>
        </div>
      </div>

      <!-- 드롭다운 방식의 다중 선택을 제공하는 Select 박스이다. -->
      <div id="custom-select" class="modal-content modal-mini hidden">
        <h3 id="custom-select-title" style="text-align:center; margin-top:0;">선택</h3>
        <p id="custom-select-msg"
          style="text-align:center; margin-bottom: 12px; font-size: 14px; white-space: pre-line;"></p>
        <select id="custom-select-input" class="field" style="margin-bottom: 20px;"></select>
        <button id="custom-select-ok" class="submit-btn" style="width: 100%; margin-top:auto;">확인</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="hidden">
    <div id="confirm-box">
      <h3>전체 데이터 삭제</h3>
      <p>정말 삭제할까요?<br>이 작업은 되돌릴 수 없습니다.</p>
      <div class="confirm-actions">
        <button id="confirm-cancel">취소</button>
        <button id="confirm-ok">삭제</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>

</body>

</html>
