<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questify - 조별과제 통합본</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <div id="left-panel" class="panel-left">
            <button id="mobile-toggle-btn" class="btn-mobile-toggle">메뉴 보기</button>

            <div id="game-screen" class="screen-active">
                <div class="game-ui-overlay">
                    <div class="progress-area">
                        <h2 class="ui-title">오늘의 목표</h2>
                        <div class="progress-bar-container">
                            <div id="progress-bar"></div>
                            <span id="progress-text">0/0</span>
                        </div>
                    </div>
                    <div class="user-profile-card">
                        <div class="user-name">내이름은여덟글자</div>
                        <div class="user-level">Lv.999</div>
                        <div class="user-exp-bar"></div>
                    </div>
                </div>

                <div id="draggable-character" class="character-box">
                    <div class="character-head"></div> 
                    <div class="character-body"></div> 
                </div>
            </div>

            <div id="timer-screen" class="screen-hidden">
                <button id="close-timer-btn" class="btn-circle-close"><span>X</span></button>
                <div class="timer-layout-wrapper">
                    <div class="timer-character-zone">
                        <div id="speech-bubble" class="bubble-hidden">
                            <div class="bubble-content">
                                <div class="bubble-arrow"></div>
                            </div>
                        </div>
                        <div class="timer-character">
                            <div class="char-head-sm"></div>
                            <div class="char-body-sm"></div>
                        </div>
                    </div>
                    
                    <div class="timer-control-panel">
                        <div class="timer-display-frame">
                            <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8">
                        </div>
                        <div class="timer-presets">
                            <button class="preset-btn" data-time="3600">+ 1h</button>
                            <button class="preset-btn" data-time="1800">+ 30m</button>
                            <button class="preset-btn" data-time="300">+ 5m</button>
                        </div>
                        <div class="timer-actions">
                            <button id="reset-timer-btn" class="btn-timer-reset">초기화</button>
                            <button id="start-timer-btn" class="btn-timer-start">시작</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="modal-overlay" class="modal-overlay-hidden">
                <div id="create-modal" class="modal-window hidden">
                    <button class="close-modal-btn btn-modal-x">X</button>
                    <h3 class="modal-title">새로운 문제 등록</h3>
                    <input id="input-quiz-title" type="text" class="form-input" placeholder="문제 제목을 입력해주세요.">
                    <textarea id="input-quiz-content" class="form-textarea" placeholder="문제 내용을 상세히 적어주세요."></textarea>
                    <input id="input-quiz-answer" type="text" class="form-input" placeholder="정답을 입력해주세요.">
                    <button id="btn-submit-create" class="btn-prime-action">제작</button>
                </div>
                
                <div id="solve-modal" class="modal-window hidden">
                    <button class="close-modal-btn btn-modal-x">X</button>
                    <div id="solve-quiz-title" class="form-view-title"></div>
                    <div id="solve-quiz-content" class="form-view-content"></div>
                    
                    <div class="solve-action-area">
                        <div id="solve-input-state" class="input-state-active">
                            <input id="input-solve-answer" type="text" class="form-input" placeholder="정답을 적어주세요.">
                            <button id="btn-grade-problem" class="btn-prime-action">채점</button>
                        </div>
                        <div id="solve-result-state" class="result-state-hidden">
                            <div id="grade-result-text"></div>
                            <button id="btn-result-confirm" class="btn-sub-confirm">확인</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="right-panel-wrapper" class="panel-right md:block">
            
            <div id="panel-quest" class="tab-panel">
                <div class="panel-header">
                    <h1 class="panel-main-title">일일퀘스트</h1>
                    <div class="panel-action-row">
                        <button id="btn-trigger-surprise" class="btn-trigger-system">💥 기습 퀴즈 생성</button>
                        <button id="btn-clear-completed" class="btn-action-system-gray">🧹 클리어 일괄 삭제</button>
                    </div>
                </div>
                <div id="quest-list-container" class="list-scroll-area">
                    </div>
            </div>

            <div id="panel-storage" class="tab-panel hidden">
                <div class="panel-header">
                    <h1 class="panel-main-title">문제저장소</h1>
                </div>
                <div id="storage-list-container" class="list-scroll-area">
                    </div>
            </div>

            <div id="open-timer-btn" class="floating-timer-btn">
                <div class="icon-clock-eye-l"></div>
                <div class="icon-clock-eye-r"></div>
                <div class="icon-clock-top"></div>
            </div>

            <div class="bottom-nav-bar">
                <div id="tab-quest" class="nav-tab tab-active">
                    <span id="tab-quest-text">📜 일일퀘스트</span>
                </div>
                <div id="tab-storage" class="nav-tab">
                    <span id="tab-storage-text">💡 문제저장소</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 코어 데이터 모델 인스턴스 ---
        let todoList = [
            { id: 1, type: 'todo', title: 'HTML 기초 마크업 복습하기', status: 'ready' },
            { id: 2, type: 'todo', title: 'Tailwind CSS 가이드 문서 읽기', status: 'clear' },
            { id: 3, type: 'todo', title: 'C# 자료형 및 제어문 실습', status: 'ready' }
        ];

        let quizStorage = [
            { id: 101, title: '웹 접근성 핵심 요소', content: '시각 장애인을 위해 이미지가 가질 수 있는 필수 속성의 이름은 무엇인가요?', answer: 'alt' },
            { id: 102, title: '프론트엔드 프로그래밍', content: '배열의 특정 요소를 삭제하거나 교체할 때 사용하는 JS 메소드의 이름은?', answer: 'splice' }
        ];

        let currentActiveQuiz = null; 

        // --- 2. 뷰 렌더링 엔진 기능 및 드래그앤드롭 이벤트 바인딩 ---
        function renderAll() {
            renderTodoList();
            renderQuizStorage();
            updateProgressBar();
        }

        function renderTodoList() {
            const container = document.getElementById('quest-list-container');
            container.innerHTML = '';

            // 기습 퀴즈 아이템과 일반 투두 목록 분리 처리 (퀴즈는 상단 고정)
            const quizzes = todoList.filter(item => item.type === 'quiz');
            const todos = todoList.filter(item => item.type === 'todo');

            // 1. 기습 퀴즈 먼저 렌더링 (드래그 불가)
            quizzes.forEach(item => {
                const card = document.createElement('div');
                card.className = "card-item-quiz";
                card.innerHTML = `
                    <div class="card-info-zone">
                        <span class="badge-surprise">[💥기습 퀴즈 발생!]</span>
                        <input type="text" value="${item.title}" class="input-readonly-title" readonly>
                    </div>
                    <button onclick="openSolveModalFromQuest(${item.id})" class="btn-card-action-red">도전</button>
                `;
                container.appendChild(card);
            });

            // 2. 일반 투두 항목 렌더링 (드래그 가능하도록 설계)
            todos.forEach((item, idx) => {
                const card = document.createElement('div');
                
                if (item.status === 'clear') {
                    card.className = "card-item-todo completed";
                    // 완료된 항목은 드래그에서 제외하거나 별도 제어
                    card.innerHTML = `
                        <input type="text" value="${item.title}" class="input-readonly-title line-through" disabled>
                        <span class="badge-complete-stamp">클리어</span>
                        <div class="card-btn-group" style="z-index: 10;">
                            <button onclick="handleTodoAction(${item.id}, 'delete')" class="btn-card-action-delete">삭제</button>
                        </div>
                    `;
                    container.appendChild(card);
                } else {
                    card.className = "card-item-todo draggable-todo-item";
                    card.setAttribute('draggable', 'true');
                    card.setAttribute('data-id', item.id);
                    
                    card.innerHTML = `
                        <div class="drag-handle">≡</div>
                        <input type="text" value="${item.title}" class="input-readonly-title" readonly>
                        <div class="card-btn-group">
                            <button onclick="handleTodoAction(${item.id}, 'clear')" class="btn-card-action">완료</button>
                            <button onclick="handleTodoAction(${item.id}, 'delete')" class="btn-card-action-delete">삭제</button>
                        </div>
                    `;

                    // 드래그앤드롭 이벤트 리스너 바인딩
                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragover', handleDragOver);
                    card.addEventListener('dragend', handleDragEnd);
                    
                    // 모바일 터치 대응 이벤트 바인딩
                    card.addEventListener('touchstart', handleTouchStart, { passive: false });
                    card.addEventListener('touchmove', handleTouchMove, { passive: false });
                    card.addEventListener('touchend', handleTouchEnd);
                    container.prepend(card);
                }
                
            });

            // 일반 투두 퀘스트 수동 생성 버튼 추가
            const addBtn = document.createElement('button');
            addBtn.className = "btn-list-dashed-add";
            addBtn.innerHTML = '<span>+ 퀘스트 추가</span>';
            addBtn.onclick = () => {
                const title = prompt("새로운 일일 퀘스트를 입력하세요:");
                if (title && title.trim()) {
                    todoList.push({ id: Date.now(), type: 'todo', title: title.trim(), status: 'ready' });
                    renderAll();
                }
            };
            container.appendChild(addBtn);
        }

        // --- [기능 추가] 투두리스트 HTML5 표준 드래그앤드롭 제어 및 정렬 순서 보존 로직 ---
        let dragSrcEl = null;

        function handleDragStart(e) {
            dragSrcEl = this;
            this.classList.add('drag-active');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.getAttribute('data-id'));
        }

        function handleDragOver(e) {
            if (e.preventDefault) { e.preventDefault(); }
            e.dataTransfer.dropEffect = 'move';
            
            if (this !== dragSrcEl && this.classList.contains('draggable-todo-item')) {
                const container = document.getElementById('quest-list-container');
                const children = Array.from(container.querySelectorAll('.draggable-todo-item'));
                const srcIdx = children.indexOf(dragSrcEl);
                const targetIdx = children.indexOf(this);
                
                if (srcIdx < targetIdx) {
                    this.after(dragSrcEl);
                } else {
                    this.before(dragSrcEl);
                }
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('drag-active');
            reorderTodoListData();
        }

        // 모바일 환경을 위한 터치 드래그 인터랙션 보정 핸들러
        let touchStartEl = null;
        let shadowActiveEl = null;

        function handleTouchStart(e) {
            if (!e.target.classList.contains('drag-handle')) return;
            touchStartEl = this;
            this.classList.add('drag-active');
        }

        function handleTouchMove(e) {
            if (!touchStartEl) return;
            e.preventDefault(); 
            
            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!targetEl) return;
            
            const itemEl = targetEl.closest('.draggable-todo-item');
            if (itemEl && itemEl !== touchStartEl) {
                const container = document.getElementById('quest-list-container');
                const children = Array.from(container.querySelectorAll('.draggable-todo-item'));
                const srcIdx = children.indexOf(touchStartEl);
                const targetIdx = children.indexOf(itemEl);
                
                if (srcIdx < targetIdx) {
                    itemEl.after(touchStartEl);
                } else {
                    itemEl.before(touchStartEl);
                }
            }
        }

        function handleTouchEnd() {
            if (!touchStartEl) return;
            touchStartEl.classList.remove('drag-active');
            touchStartEl = null;
            reorderTodoListData();
        }

        // DOM 변경 구조를 메모리 데이터 배열(`todoList`) 순서에 영구 동기화
        function reorderTodoListData() {
            const container = document.getElementById('quest-list-container');
            const currentDOMIds = Array.from(container.querySelectorAll('.draggable-todo-item'))
                                      .map(el => parseInt(el.getAttribute('data-id')));
            
            // 기존 퀴즈 객체 및 완료된 항목들은 원래 순서를 보존하여 재조합
            const quizzes = todoList.filter(item => item.type === 'quiz');
            const completedTodos = todoList.filter(item => item.type === 'todo' && item.status === 'clear');
            const activeTodos = todoList.filter(item => item.type === 'todo' && item.status !== 'clear');

            // 정렬된 DOM 아이디 배열 순서대로 액티브 투두 인스턴스를 재배치
            activeTodos.sort((a, b) => currentDOMIds.indexOf(a.id) - currentDOMIds.indexOf(b.id));

            // 코어 데이터 변수 복구 바인딩
            todoList = [...quizzes, ...activeTodos, ...completedTodos];
            updateProgressBar();
        }

        // --- [기능 추가] 완료 항목 일괄 삭제 바인딩 ---
        document.getElementById('btn-clear-completed').onclick = () => {
            const clearCount = todoList.filter(item => item.type === 'todo' && item.status === 'clear').length;
            if (clearCount === 0) {
                alert("현재 클리어한 퀘스트가 존재하지 않습니다!");
                return;
            }
            if (confirm(`완료된 퀘스트 ${clearCount}개를 일괄 삭제하시겠습니까?`)) {
                // status가 'clear'인 항목 제외 필터링
                todoList = todoList.filter(item => !(item.type === 'todo' && item.status === 'clear'));
                renderAll();
            }
        };


        // --- 기존 코어 엔진 연동 로직 (유지) ---
        function renderQuizStorage() {
            const container = document.getElementById('storage-list-container');
            container.innerHTML = '';

            quizStorage.forEach(quiz => {
                const card = document.createElement('div');
                card.className = "card-item-storage";
                card.innerHTML = `
                    <div class="storage-card-title">${quiz.title}</div>
                    <div class="storage-card-footer">
                        <span class="badge-storage-tag">저장된 문제</span>
                        <button onclick="openSolveModalFromStorage(${quiz.id})" class="btn-card-action-sm">다시풀기</button>
                    </div>
                `;
                container.appendChild(card);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "btn-list-dashed-add";
            addBtn.innerHTML = '<span>+ 새로운 문제 제작</span>';
            addBtn.onclick = () => openModal('create');
            container.appendChild(addBtn);
        }

        function updateProgressBar() {
            const todos = todoList.filter(item => item.type === 'todo');
            const total = todos.length;
            const clears = todos.filter(item => item.status === 'clear').length;
            
            const percent = total > 0 ? (clears / total) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${clears}/${total}`;
        }

        function handleTodoAction(id, action) {
            const idx = todoList.findIndex(item => item.id === id);
            if (idx === -1) return;
            if (action === 'clear') todoList[idx].status = 'clear';
            else if (action === 'delete') todoList.splice(idx, 1);
            renderAll();
        }

        function triggerSurpriseQuiz() {
            if (quizStorage.length === 0) {
                alert("문제저장소에 등록된 문제가 없습니다! 먼저 우측에서 문제를 만들어주세요.");
                return;
            }
            const randomQuiz = quizStorage[Math.floor(Math.random() * quizStorage.length)];
            const isExist = todoList.some(item => item.type === 'quiz' && item.originQuizId === randomQuiz.id);
            if (isExist) {
                alert("이미 같은 기습 퀴즈가 일일퀘스트 최상단에 고정되어 있습니다!");
                return;
            }

            todoList.unshift({ // 상단 고정을 위한 큐 인서트
                id: Date.now(),
                type: 'quiz',
                title: randomQuiz.title,
                originQuizId: randomQuiz.id
            });

            renderAll();
            alert("💥 일일퀘스트 최상단에 기습 퀴즈 카드가 고정되었습니다!");
        }
        document.getElementById('btn-trigger-surprise').onclick = triggerSurpriseQuiz;

        const modalOverlay = document.getElementById('modal-overlay');
        const createModal = document.getElementById('create-modal');
        const solveModal = document.getElementById('solve-modal');

        function openModal(type) {
            modalOverlay.className = "modal-overlay-flex";
            if (type === 'create') {
                createModal.classList.remove('hidden');
                solveModal.classList.add('hidden');
            } else {
                solveModal.classList.remove('hidden');
                createModal.classList.add('hidden');
            }
        }

        function closeModal() {
            modalOverlay.className = "modal-overlay-hidden";
            createModal.classList.add('hidden');
            solveModal.classList.add('hidden');
            currentActiveQuiz = null;
        }

        document.querySelectorAll('.close-modal-btn').forEach(btn => btn.onclick = closeModal);

        document.getElementById('btn-submit-create').onclick = () => {
            const title = document.getElementById('input-quiz-title').value.trim();
            const content = document.getElementById('input-quiz-content').value.trim();
            const answer = document.getElementById('input-quiz-answer').value.trim();

            if (!title || !content || !answer) {
                alert("모든 빈칸을 빠짐없이 채워주세요!");
                return;
            }

            quizStorage.push({ id: Date.now(), title, content, answer });
            document.getElementById('input-quiz-title').value = '';
            document.getElementById('input-quiz-content').value = '';
            document.getElementById('input-quiz-answer').value = '';
            
            closeModal();
            renderAll();
        };

        function openSolveModalFromStorage(quizId) {
            const quiz = quizStorage.find(q => q.id === quizId);
            if (!quiz) return;
            setupSolveModal(quiz, false);
        }

        function openSolveModalFromQuest(todoQuizId) {
            const todoItem = todoList.find(item => item.id === todoQuizId);
            if (!todoItem) return;
            const quiz = quizStorage.find(q => q.id === todoItem.originQuizId);
            if (!quiz) return;
            setupSolveModal(quiz, true, todoQuizId);
        }

        function setupSolveModal(quiz, isSurprise, todoQuizId = null) {
            currentActiveQuiz = { ...quiz, isSurprise, todoQuizId };
            document.getElementById('solve-quiz-title').innerText = quiz.title;
            document.getElementById('solve-quiz-content').innerText = quiz.content;
            document.getElementById('input-solve-answer').value = '';
            document.getElementById('solve-input-state').className = "input-state-active";
            document.getElementById('solve-result-state').className = "result-state-hidden";
            openModal('solve');
        }

        document.getElementById('btn-grade-problem').onclick = () => {
            if (!currentActiveQuiz) return;
            const userAnswer = document.getElementById('input-solve-answer').value.trim();
            const isCorrect = userAnswer.toLowerCase() === currentActiveQuiz.answer.toLowerCase();

            document.getElementById('solve-input-state').className = "input-state-hidden";
            document.getElementById('solve-result-state').className = "result-state-active";

            const resultTextDiv = document.getElementById('grade-result-text');
            if (isCorrect) {
                resultTextDiv.className = "text-result-success";
                resultTextDiv.innerText = "⭕ 정답입니다! 완벽하게 해결하셨습니다.";
                if (currentActiveQuiz.isSurprise && currentActiveQuiz.todoQuizId) {
                    const idx = todoList.findIndex(item => item.id === currentActiveQuiz.todoQuizId);
                    if (idx !== -1) todoList.splice(idx, 1);
                }
            } else {
                resultTextDiv.className = "text-result-fail";
                resultTextDiv.innerText = `❌ 오답입니다! (입력값: ${userAnswer})`;
            }
        };

        document.getElementById('btn-result-confirm').onclick = () => {
            closeModal();
            renderAll();
        };

        // --- 타이머 및 드래그앤드롭 월드 인터랙션 플러그인 ---
        const timerDisplay = document.getElementById('timer-display');
        const startTimerBtn = document.getElementById('start-timer-btn');
        const resetTimerBtn = document.getElementById('reset-timer-btn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        
        let totalSeconds = 0, timerInterval = null, timerRunning = false, timerPaused = false;
        const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function totalSecondsFromDigits(digits) {
            const h = Number(`${digits[0]}${digits[1]}`) || 0;
            const m = Number(`${digits[2]}${digits[3]}`) || 0;
            const s = Number(`${digits[4]}${digits[5]}`) || 0;
            return (h * 3600) + (m * 60) + s;
        }

        function updateDisplays() { timerDisplay.value = formatTime(totalSeconds); }

        function startTimer() {
            if (totalSeconds <= 0) return;
            timerRunning = true; timerPaused = false;
            startTimerBtn.innerText = '일시정지'; timerDisplay.disabled = true;
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerPaused) return;
                if (totalSeconds > 0) { totalSeconds--; updateDisplays(); }
                if (totalSeconds <= 0) { totalSeconds = 0; updateDisplays(); stopTimer(); alert('타이머가 종료되었습니다!'); }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null; timerRunning = false; timerPaused = false;
            startTimerBtn.innerText = '시작'; timerDisplay.disabled = false;
        }

        startTimerBtn.addEventListener('click', () => {
            if (timerRunning) { timerPaused = !timerPaused; startTimerBtn.innerText = timerPaused ? '계속' : '일시정지'; }
            else { startTimer(); }
        });

        resetTimerBtn.addEventListener('click', () => { stopTimer(); totalSeconds = 0; updateDisplays(); });
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (timerRunning && !timerPaused) return;
                totalSeconds += parseInt(btn.getAttribute('data-time'));
                if(totalSeconds > 359999) totalSeconds = 359999;
                updateDisplays();
            });
        });

        timerDisplay.addEventListener('keydown', (e) => {
            if (timerRunning) { e.preventDefault(); return; }
            if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return;
            e.preventDefault();

            let digits = timerDisplay.value.replace(/:/g, '').split('');
            const start = timerDisplay.selectionStart;
            let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start);
            if (digitIndex === -1) digitIndex = 5;

            if (/\d/.test(e.key)) {
                digits[digitIndex] = e.key; totalSeconds = totalSecondsFromDigits(digits); updateDisplays();
                let nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1;
                timerDisplay.setSelectionRange(nextPos, nextPos);
            } else if (e.key === 'Backspace') {
                let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1;
                if (start === timerDisplay.value.length) targetIdx = 5;
                if (targetIdx >= 0) {
                    digits[targetIdx] = '0'; totalSeconds = totalSecondsFromDigits(digits); updateDisplays();
                    let nextPos = DIGIT_POSITIONS[targetIdx]; timerDisplay.setSelectionRange(nextPos, nextPos);
                }
            }
        });

        const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
        const leftPanel = document.getElementById('left-panel');
        const rightPanelWrapper = document.getElementById('right-panel-wrapper');
        
        mobileToggleBtn.addEventListener('click', () => {
            const isHidden = rightPanelWrapper.classList.toggle('hidden');
            const speechBubble = document.getElementById('speech-bubble');
            if (isHidden) {
                leftPanel.className = "panel-left h-full-forced";
                mobileToggleBtn.innerText = '메뉴 보기';
                if(speechBubble) speechBubble.className = "bubble-visible";
            } else {
                leftPanel.className = "panel-left";
                mobileToggleBtn.innerText = '메뉴 숨기기';
                if(speechBubble) speechBubble.className = "bubble-hidden";
            }
        });

        const gameScreen = document.getElementById('game-screen');
        const timerScreen = document.getElementById('timer-screen');
        const openTimerBtn = document.getElementById('open-timer-btn');
        const closeTimerBtn = document.getElementById('close-timer-btn');
        
        function toggleTimerScreen() {
            if (timerScreen.classList.contains('screen-hidden')) {
                gameScreen.className = "screen-hidden"; timerScreen.className = "screen-block";
                openTimerBtn.classList.add('active-state'); 
            } else {
                timerScreen.className = "screen-hidden"; gameScreen.className = "screen-active";
                openTimerBtn.classList.remove('active-state');
                document.getElementById('draggable-character').style.cssText = "";
            }
        }
        openTimerBtn.onclick = toggleTimerScreen;
        closeTimerBtn.onclick = toggleTimerScreen;

        const tabQuest = document.getElementById('tab-quest');
        const tabQuestText = document.getElementById('tab-quest-text');
        const panelQuest = document.getElementById('panel-quest');
        const tabStorage = document.getElementById('tab-storage');
        const tabStorageText = document.getElementById('tab-storage-text');
        const panelStorage = document.getElementById('panel-storage');
        
        tabStorage.onclick = () => {
            panelQuest.classList.add('hidden'); panelStorage.classList.remove('hidden');
            tabStorage.className = "nav-tab tab-active border-l-cut"; tabStorageText.className = "tab-text-dark";
            tabQuest.className = "nav-tab tab-inactive"; tabQuestText.className = "tab-text-gray";
        };
        
        tabQuest.onclick = () => {
            panelStorage.classList.add('hidden'); panelQuest.classList.remove('hidden');
            tabQuest.className = "nav-tab tab-active border-r-cut"; tabQuestText.className = "tab-text-dark";
            tabStorage.className = "nav-tab tab-inactive"; tabStorageText.className = "tab-text-gray";
        };

        const draggableCharacter = document.getElementById('draggable-character');
        let isDragging = false, startX, startY, initialLeft, initialTop;

        function startDrag(e) {
            if (gameScreen.classList.contains('screen-hidden')) return;
            isDragging = true; draggableCharacter.classList.add('dragging');
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            startX = clientX; startY = clientY;
            const rect = draggableCharacter.getBoundingClientRect();
            const parentRect = gameScreen.getBoundingClientRect();
            initialLeft = rect.left - parentRect.left; initialTop = rect.top - parentRect.top;
            draggableCharacter.style.bottom = 'auto'; draggableCharacter.style.transform = 'none';
            draggableCharacter.style.left = `${initialLeft}px`; draggableCharacter.style.top = `${initialTop}px`;
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            let newLeft = initialLeft + (clientX - startX); let newTop = initialTop + (clientY - startY);
            const parentRect = gameScreen.getBoundingClientRect(); const rect = draggableCharacter.getBoundingClientRect();

            if (newLeft < 0) newLeft = 0; if (newTop < 0) newTop = 0;
            if (newLeft + rect.width > parentRect.width) newLeft = parentRect.width - rect.width;
            if (newTop + rect.height > parentRect.height) newTop = parentRect.height - rect.height;

            draggableCharacter.style.left = `${newLeft}px`; draggableCharacter.style.top = `${newTop}px`;
        }

        function endDrag() { if (!isDragging) return; isDragging = false; draggableCharacter.classList.remove('dragging'); }

        draggableCharacter.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag); document.addEventListener('mouseup', endDrag);
        draggableCharacter.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', drag); document.addEventListener('touchend', endDrag);

        new ResizeObserver(() => {
            if (draggableCharacter.style.transform === 'none') {
                const parentRect = gameScreen.getBoundingClientRect(); const rect = draggableCharacter.getBoundingClientRect();
                let cLeft = draggableCharacter.offsetLeft, cTop = draggableCharacter.offsetTop;
                if (cLeft + rect.width > parentRect.width) cLeft = parentRect.width - rect.width;
                if (cTop + rect.height > parentRect.height) cTop = parentRect.height - rect.height;
                draggableCharacter.style.left = `${Math.max(0, cLeft)}px`; draggableCharacter.style.top = `${Math.max(0, cTop)}px`;
            }
        }).observe(gameScreen);

        // 초기 빌드 기동
        renderAll();
    </script>
</body>
</html>
