<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #000; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-300 w-screen h-[100dvh] overflow-hidden flex justify-center items-center font-sans select-none md:p-0">

    <div class="flex flex-col md:flex-row w-full h-full md:max-h-[99%] md:max-w-[calc(100vh*1.6666)] md:aspect-[5/3] bg-white md:p-1 gap-1 md:gap-1.5 md:shadow-2xl overflow-hidden relative border-[3px] border-black">

        <!-- 좌측 영역 -->
        <div id="left-panel" class="h-[45%] md:h-full w-full md:w-[60%] relative overflow-hidden shrink-0 border-[4px] border-black bg-white transition-all duration-300">
            <button id="mobile-toggle-btn" class="md:hidden absolute top-2 right-2 px-3 py-1.5 bg-white border-[2px] border-black rounded-lg z-40 shadow-sm font-bold text-xs hover:bg-gray-100 active:scale-95 transition-all">
                메뉴 숨기기
            </button>

            <!-- 메인 게임 화면 -->
            <div id="game-screen" class="absolute inset-0 bg-white w-full h-full z-10 overflow-hidden">
                <div class="absolute top-0 left-0 w-full z-30 flex flex-col p-2 md:p-3 lg:p-4 gap-2 md:gap-3 pointer-events-none">
                    <div class="pointer-events-auto">
                        <h2 class="text-black font-bold text-sm md:text-lg lg:text-xl ml-[2.5%]">오늘의 목표</h2>
                        <div class="w-full mx-auto md:w-[95%] max-w-full h-6 md:h-8 bg-white border-[2px] border-black relative mt-1">
                            <div id="goal-progress-bar" class="w-2/3 h-full bg-gray-300 transition-all duration-300"></div>
                            <span id="goal-progress-text" class="absolute inset-0 flex justify-center items-center text-black text-[10px] lg:text-sm font-bold">2/3</span>
                        </div>
                    </div>
                    
                    <div class="pointer-events-auto ml-[2.5%] bg-white rounded-md p-1.5 md:p-2 lg:p-3 border-[2px] border-black w-[120px] md:w-[160px] lg:w-[200px]">
                        <div class="text-black text-[10px] md:text-sm lg:text-base font-bold tracking-wide truncate">내이름은여덟글자</div>
                        <div class="text-gray-600 text-[9px] md:text-xs lg:text-sm font-bold mt-0.5 md:mt-1">Lv.999</div>
                        <div class="w-full h-1.5 md:h-2 lg:h-3 bg-gray-300 border border-black mt-1"></div>
                    </div>
                </div>

                <!-- 메인 화면 캐릭터 및 말풍선 구역 -->
                <div id="draggable-character" class="absolute bottom-[8%] md:bottom-[10%] left-1/2 transform -translate-x-1/2 w-[40%] max-w-[140px] md:max-w-[180px] flex flex-col items-center justify-end z-20 cursor-grab active:cursor-grabbing touch-none pointer-events-auto shrink-0">
                    <!-- 주석: 홈화면 전용 캐릭터 말풍선 UI 컴포넌트입니다. 상단에 배치되어 대사를 노출합니다. -->
                    <div id="main-speech-bubble" class="hidden flex-col justify-end w-full mb-2">
                        <div class="relative w-full min-h-[40px] bg-white border-[2px] border-black rounded-xl p-2 shadow-sm flex items-center justify-center text-center">
                            <span id="main-speech-text" class="text-black font-bold text-[10px] md:text-xs">대사 자리</span>
                            <div class="absolute -bottom-[6px] left-1/2 -translate-x-1/2 w-2 h-2 bg-white border-b-[2px] border-r-[2px] border-black transform rotate-45"></div>
                        </div>
                    </div>
                    <div class="w-[70%] aspect-square bg-white border-[3px] md:border-[4px] border-black rounded-full mb-[-10px] z-10 shrink-0 pointer-events-none"></div> 
                    <div class="w-full aspect-[5/6] bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink-0 pointer-events-none"></div> 
                </div>
            </div>

            <!-- 타이머 전용 화면 -->
            <div id="timer-screen" class="absolute inset-0 bg-white w-full h-full z-30 hidden overflow-hidden">
                <button id="close-timer-btn" class="absolute top-2 left-2 md:top-4 md:left-4 w-8 h-8 md:w-10 md:h-10 bg-white rounded-full border-[2px] md:border-[3px] border-black flex justify-center items-center z-40 hover:bg-gray-100 active:scale-95 transition-all shadow-sm cursor-pointer">
                    <span class="text-black font-bold text-sm md:text-base mb-0.5">X</span>
                </button>

                <div class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none pt-12 pb-4 md:pt-16 md:pb-10">
                    <div class="flex flex-col items-center justify-center w-full min-h-0 max-h-full">
                        <div class="flex items-end justify-center gap-2 md:gap-6 w-full max-w-[800px] px-2 pointer-events-auto z-10 shrink min-h-[100px] h-[35vh] max-h-[220px] md:max-h-[320px]">
                            <div id="speech-bubble" class="hidden md:flex flex-col justify-start h-full w-[45%] md:w-[50%] max-w-[420px]">
                                <div class="relative w-full h-[80px] md:h-[110px] lg:h-[130px] shrink-0 bg-white border-[3px] md:border-[4px] border-black rounded-[2rem] md:rounded-[3rem] shadow-sm flex items-center justify-center mt-2 md:mt-4 px-4 text-center">
                                    <span id="speech-text" class="text-black font-bold text-xs md:text-sm">시간은 금이라구 친구!</span>
                                    <div class="absolute top-1/2 -translate-y-1/2 -right-[11px] md:-right-[15px] w-5 h-5 md:w-8 md:h-8 bg-white border-t-[3px] md:border-t-[4px] border-r-[3px] md:border-r-[4px] border-black transform rotate-45 z-10"></div>
                                </div>
                            </div>
                            
                            <div class="w-[30%] max-w-[140px] md:max-w-[180px] h-full flex flex-col items-center pointer-events-auto shrink min-h-[60px]">
                                <div class="w-[70%] max-w-[120px] aspect-square bg-white border-[3px] md:border-[4px] border-black rounded-full mb-[-10px] z-10 shrink-0"></div>
                                <div class="w-full flex-1 bg-gray-100 border-[3px] md:border-[4px] border-black rounded-t-[2rem] md:rounded-t-[3rem] shrink min-h-[20px]"></div>
                            </div>
                        </div>

                        <div class="w-[95%] md:w-[85%] max-w-[700px] bg-gray-100 border-[4px] md:border-[5px] border-black rounded-xl p-4 md:p-6 lg:p-8 shadow-sm z-20 pointer-events-auto flex flex-col gap-3 md:gap-5 shrink-0 -mt-10 md:-mt-16 relative">
                            <div class="w-full bg-white border-[3px] md:border-[4px] border-black rounded-lg py-4 md:py-6 lg:py-8 min-h-[80px] md:min-h-[120px] flex justify-center items-center shadow-sm relative overflow-hidden">
                                <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8" class="text-black text-[12vw] sm:text-5xl md:text-7xl lg:text-[6rem] font-black tracking-normal sm:tracking-wider leading-none text-center bg-transparent outline-none w-full z-10">
                            </div>
                            
                            <div class="w-full flex justify-center gap-4 md:gap-8 px-1 md:px-8">
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="3600">+ 1h</button>
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="1800">+ 30m</button>
                                <button class="preset-btn bg-white border-[2.5px] md:border-[3px] border-black rounded-lg flex-1 py-1.5 md:py-2.5 text-black font-bold text-sm md:text-base lg:text-lg shadow-sm hover:bg-gray-50 active:scale-95 transition-all" data-time="300">+ 5m</button>
                            </div>
                            
                            <div class="w-full flex justify-center gap-3 mt-1 md:mt-2">
                                <button id="reset-timer-btn" class="bg-white border-[3px] md:border-[4px] border-black rounded-lg w-[25%] md:w-[20%] py-2 md:py-3 lg:py-4 text-black font-black text-sm md:text-lg lg:text-xl shadow-sm hover:bg-gray-100 active:scale-95 transition-all">초기화</button>
                                <button id="start-timer-btn" class="bg-gray-200 border-[3px] md:border-[4px] border-black rounded-lg w-[50%] md:w-[40%] py-2 md:py-3 lg:py-4 text-black font-black text-lg md:text-xl lg:text-2xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all">시작</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="modal-overlay" class="absolute inset-0 bg-gray-900/60 z-50 hidden justify-center items-center p-4 md:p-6">
                <!-- 문제 생성 팝업 모달 -->
                <div id="create-modal" class="bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-3 md:p-5 flex flex-col gap-3 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <input id="input-modal-title" type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner" placeholder="문제 제목을 입력해주세요.">
                    <textarea id="input-modal-desc" class="w-full flex-1 bg-gray-50 border-[2.5px] border-gray-400 rounded-xl px-4 py-3 text-sm md:text-base font-bold text-black outline-none resize-none placeholder-gray-500 shadow-inner" placeholder="문제를 적어주세요."></textarea>
                    <input id="input-modal-ans" type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner mt-1" placeholder="정답을 적어주세요.">
                    <button id="btn-submit-create" class="bg-gray-200 border-[3px] border-black rounded-lg py-1.5 md:py-2 px-10 text-black font-black text-base md:text-xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all self-center mt-2">제작</button>
                </div>
                
                <!-- 문제 풀이 팝업 모달 -->
                <div id="solve-modal" class="bg-white w-full max-w-[95%] md:max-w-[85%] h-[90%] border-[4px] border-black rounded-xl p-3 md:p-5 flex flex-col gap-3 relative hidden shadow-xl">
                    <button class="close-modal-btn absolute -top-3 -left-3 md:-top-4 md:-left-4 w-7 h-7 md:w-9 md:h-9 bg-white rounded-full border-[3px] border-black flex justify-center items-center text-black font-bold hover:scale-105 active:scale-95 transition-transform z-50">X</button>
                    <div id="solve-modal-title" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black shadow-inner flex items-center truncate">가져온 문제 제목</div>
                    <div id="solve-modal-desc" class="w-full flex-1 bg-gray-50 border-[2.5px] border-gray-400 rounded-xl px-4 py-3 text-sm md:text-base font-bold text-black overflow-y-auto shadow-inner custom-scroll">문제 내용이 여기에 표시됩니다.</div>
                    
                    <div class="w-full flex flex-col items-center mt-1">
                        <div id="solve-input-state" class="w-full flex flex-col gap-3">
                            <input id="input-solve-ans" type="text" class="w-full bg-gray-50 border-[2.5px] border-gray-400 rounded-full px-4 py-2 md:py-3 text-sm md:text-base font-bold text-black outline-none placeholder-gray-500 shadow-inner" placeholder="정답을 적어주세요.">
                            <button id="btn-grade-problem" class="bg-gray-200 border-[3px] border-black rounded-lg py-1.5 md:py-2 px-10 text-black font-black text-base md:text-xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all self-center mt-1">채점</button>
                        </div>
                        <div id="solve-result-state" class="w-full hidden bg-gray-100 border-[2px] border-gray-300 rounded-xl p-4 text-center text-sm md:text-base font-bold text-black leading-relaxed h-24 md:h-28 flex flex-col justify-center items-center gap-2">
                            <span id="solve-result-text"></span>
                            <button id="btn-solve-confirm" class="bg-black text-white text-xs px-4 py-1.5 rounded border border-black hover:bg-gray-800 transition-all">확인</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 메뉴 영역 -->
        <div id="right-panel-wrapper" class="flex-1 md:h-full w-full md:w-[40%] flex flex-col relative overflow-hidden border-[4px] border-black bg-gray-100 transition-colors duration-200">
            
            <!-- 일일퀘스트 탭 -->
            <div id="panel-quest" class="flex-1 flex flex-col overflow-hidden">
                <div class="pt-3 md:pt-[4%] pb-2 md:pb-[3%] shrink-0">
                    <h1 class="text-black text-xl md:text-3xl lg:text-4xl font-black text-center tracking-widest">일일퀘스트</h1>
                </div>
                <div id="quest-list-container" class="flex-1 px-2 md:px-[4%] flex flex-col gap-2 md:gap-[3%] overflow-y-auto pb-16 md:pb-[20%] custom-scroll">
                    
                    <button id="btn-add-quest-prompt" class="bg-white border-[2.5px] border-black border-dashed rounded min-h-[44px] md:min-h-[48px] flex justify-center items-center hover:bg-gray-50 transition-colors shrink-0">
                        <span class="text-black opacity-30 text-3xl lg:text-5xl font-bold leading-none mb-1">+</span>
                    </button>
                </div>
            </div>

            <!-- 문제저장소 탭 -->
            <div id="panel-storage" class="flex-1 flex flex-col overflow-hidden hidden">
                <div class="pt-3 md:pt-[4%] pb-2 md:pb-[3%] shrink-0">
                    <h1 class="text-black text-xl md:text-3xl lg:text-4xl font-black text-center tracking-widest">문제저장소</h1>
                </div>
                <div id="storage-list-container" class="flex-1 px-2 md:px-[4%] flex flex-col gap-2 md:gap-[3%] overflow-y-auto pb-16 md:pb-[20%] custom-scroll">
                    
                    <button id="btn-open-create" class="bg-white border-[2.5px] border-black border-dashed rounded min-h-[44px] md:min-h-[48px] flex justify-center items-center hover:bg-gray-50 transition-colors shrink-0">
                        <span class="text-black opacity-40 text-3xl md:text-4xl font-bold leading-none mb-1">+</span>
                    </button>
                </div>
            </div>

            <!-- 타이머 진입 플로팅 버튼 -->
            <div id="open-timer-btn" class="absolute bottom-12 md:bottom-[15%] right-3 md:right-[5%] w-10 h-10 md:w-[12%] md:aspect-square md:h-auto max-h-[64px] max-w-[64px] min-w-[40px] min-h-[40px] bg-white rounded-full border-[2.5px] md:border-[3px] border-black shadow-sm flex justify-center items-center cursor-pointer hover:scale-105 transition-all z-10">
                <div class="w-[10%] h-[20%] bg-black absolute top-[15%] rounded-full"></div>
                <div class="w-[20%] h-[10%] bg-black absolute right-[15%] rounded-full"></div>
                <div class="absolute -top-[15%] w-[20%] h-[20%] bg-black rounded-sm"></div>
            </div>

            <!-- 하단 네비게이션 탭 바 -->
            <div class="h-10 md:h-[10%] min-h-[40px] md:min-h-[48px] flex border-t-[3px] border-black w-full mt-auto shrink-0 bg-gray-200">
                <div id="tab-quest" class="flex-1 bg-white border-r-[3px] border-black flex justify-center items-center cursor-pointer shadow-sm hover:bg-gray-50 transition-all">
                    <span id="tab-quest-text" class="text-black font-bold text-xs md:text-sm lg:text-base flex items-center gap-1 md:gap-2">📜 일일퀘스트</span>
                </div>
                <div id="tab-storage" class="flex-1 flex justify-center items-center cursor-pointer hover:bg-gray-300 transition-colors">
                    <span id="tab-storage-text" class="text-gray-500 font-bold text-xs md:text-sm lg:text-base flex items-center gap-1 md:gap-2">💡 문제저장소</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 퀘스트 생성 커스텀 다이얼로그 모달 구조 -->
    <div id="quest-modal-overlay" class="absolute inset-0 bg-gray-900/60 z-50 hidden justify-center items-center p-4">
        <!-- 주석: 일일 퀘스트 생성 시 디데이 날짜 및 시간 설정을 포함하는 모달창입니다. -->
        <div class="bg-white w-full max-w-sm border-[4px] border-black rounded-xl p-4 flex flex-col gap-3 shadow-xl">
            <h3 class="text-black font-black text-base md:text-lg">새로운 퀘스트 등록</h3>
            <input id="input-quest-text" type="text" class="w-full bg-gray-50 border-[2px] border-black rounded-md px-3 py-2 text-sm font-bold text-black outline-none" placeholder="퀘스트 내용을 입력하세요.">
            
            <div class="border-t border-black pt-2 flex flex-col gap-2">
                <label class="flex items-center gap-2 text-sm font-bold text-black cursor-pointer">
                    <input id="checkbox-use-dday" type="checkbox" class="w-4 h-4 border-2 border-black accent-black">
                    디데이 타임아웃 제한 적용
                </label>
                
                <div id="dday-input-group" class="hidden flex-col gap-2 bg-gray-50 p-2 border border-gray-400 rounded-md">
                    <span class="text-[11px] font-bold text-gray-600">마감 일시 지정</span>
                    <input id="input-quest-dday" type="datetime-local" class="w-full bg-white border border-black rounded px-2 py-1 text-xs font-bold text-black">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button id="btn-cancel-quest-modal" class="bg-white border border-black px-3 py-1 text-xs font-bold rounded">취소</button>
                <button id="btn-confirm-quest-modal" class="bg-black text-white px-4 py-1 text-xs font-bold rounded">추가</button>
            </div>
        </div>
    </div>

    <script>
        // --- 글로벌 인메모리 데이터 상태 관리 ---
        // 주석: 기존 데이터 포맷에 디데이 계산용 절대 시간 데이터 필드(deadline)를 연동 확장했습니다.
        let quests = [
            { id: 1, text: "알고리즘 1문제 풀기", status: "active", deadline: null },
            { id: 2, text: "중간고사 전공 서적 격파", status: "active", deadline: new Date(Date.now() + 9000000000).toISOString() }
        ];
        let problemStorage = [
            { id: "sample-1", title: "CSS Tailwind 레이아웃 마스터하기", desc: "Tailwind CSS에서 임의의 값을 주기 위해 대괄호를 사용하는 문법의 명칭과, 가로 너비를 스크린 전체 화면으로 채우는 클래스명을 적으시오.", ans: "JIT" }
        ];
        let currentActiveSolvingProblem = null;

        // 주석: 레벨업 시 동료 해금 및 메인 캐릭터 스왑을 대응하기 위한 확장형 캐릭터 테이블 구조입니다.
        const characterDatabase = {
            "char_01": { id: "char_01", name: "훈련용 목각인형", desc: "기본 지급되는 기본 연습용 캐릭터" },
            "char_02": { id: "char_02", name: "대마법사 고양이", desc: "레벨 50 달성 시 해금되는 특수 동료 캐릭터" }
        };
        let currentSelectedCharacter = "char_01";

        // --- DOM Elements 로드 ---
        const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
        const leftPanel = document.getElementById('left-panel');
        const rightPanelWrapper = document.getElementById('right-panel-wrapper');
        const gameScreen = document.getElementById('game-screen');
        const timerScreen = document.getElementById('timer-screen');
        const openTimerBtn = document.getElementById('open-timer-btn');
        const closeTimerBtn = document.getElementById('close-timer-btn');
        
        const tabQuest = document.getElementById('tab-quest');
        const tabQuestText = document.getElementById('tab-quest-text');
        const panelQuest = document.getElementById('panel-quest');
        const tabStorage = document.getElementById('tab-storage');
        const tabStorageText = document.getElementById('tab-storage-text');
        const panelStorage = document.getElementById('panel-storage');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const createModal = document.getElementById('create-modal');
        const solveModal = document.getElementById('solve-modal');
        const btnOpenCreate = document.getElementById('btn-open-create');
        const btnSubmitCreate = document.getElementById('btn-submit-create');
        const btnGradeProblem = document.getElementById('btn-grade-problem');
        const solveInputState = document.getElementById('solve-input-state');
        const solveResultState = document.getElementById('solve-result-state');
        const solveResultText = document.getElementById('solve-result-text');
        const btnSolveConfirm = document.getElementById('btn-solve-confirm');
        
        const questListContainer = document.getElementById('quest-list-container');
        const storageListContainer = document.getElementById('storage-list-container');
        const btnAddQuestPrompt = document.getElementById('btn-add-quest-prompt');
        
        const goalProgressBar = document.getElementById('goal-progress-bar');
        const goalProgressText = document.getElementById('goal-progress-text');

        // 주석: 신규 추가된 일일 퀘스트 설정 모달창 관련 엘리먼트 객체입니다.
        const questModalOverlay = document.getElementById('quest-modal-overlay');

        // --- 4. 목표 달성률 상단 프로그레스 바 갱신 함수 ---
        function renderGoalProgress() {

        // --- 5. 디데이 파싱 알고리즘 구현부 ---
        // 주석: 타겟 밀리초 시간을 인자로 받아 문제 조건 조건(년, 월, 일 순차 소거법 및 시분초 표기 제어)에 부합하는 문자열을 변환하는 가공 함수입니다.
        function calculateDdayString(deadlineIsoString) {
            if (!deadlineIsoString) return "";
            
            const now = new Date();
            const target = new Date(deadlineIsoString);
            const diffMs = target - now;
            
            if (diffMs <= 0) {
                return "시간 만료";
            }
            
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffSecs / 60);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);
            
            const targetYear = target.getFullYear();
            const targetMonth = target.getMonth();
            const nowYear = now.getFullYear();
            const nowMonth = now.getMonth();
            
            let years = targetYear - nowYear;
            let months = targetMonth - nowMonth;
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            const displaySec = diffSecs % 60;
            const displayMin = diffMins % 60;
            const displayHour = diffHours % 24;
            
            if (years > 0) {
                return `남은기간 ${years}년 ${months}월 ${diffDays % 30}일 ${displayHour}시`;
            } else if (months > 0) {
                return `남은기간 ${months}월 ${diffDays % 30}일 ${displayHour}시`;
            } else {
                return `남은기간 ${diffDays}일 ${displayHour}시 ${displayMin}분 ${displaySec}초`;
            }
        }

        // --- 9. 타이머 코어 엔진 및 마스킹 인터랙션 ---
        const timerDisplay = document.getElementById('timer-display');
        const startTimerBtn = document.getElementById('start-timer-btn');
        const resetTimerBtn = document.getElementById('reset-timer-btn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const speechText = document.getElementById('speech-text');
        
        let totalSeconds = 0;
        let initialTimerSetupSeconds = 0;
        let timerInterval = null;
        let timerRunning = false;
        let timerPaused = false;
        
        const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function totalSecondsFromDigits(digits) {
            const h = Number(`${digits[0]}${digits[1]}`) || 0;
            const m = Number(`${digits[2]}${digits[3]}`) || 0;
            const s = Number(`${digits[4]}${digits[5]}`) || 0;
            return (h * 3600) + (m * 60) + s;
        }

        function updateDisplays() {
            timerDisplay.value = formatTime(totalSeconds);
        }

        function startTimer() {
            if (totalSeconds <= 0) {
                speechText.innerText = "시간을 먼저 설정해줘!";
                return;
            }
            
            if(!timerPaused) {
                initialTimerSetupSeconds = totalSeconds;
            }

            timerRunning = true;
            timerPaused = false;
            startTimerBtn.innerText = '일시정지';
            startTimerBtn.className = "bg-yellow-200 border-[3px] md:border-[4px] border-black rounded-lg w-[50%] md:w-[40%] py-2 md:py-3 lg:py-4 text-black font-black text-lg md:text-xl lg:text-2xl shadow-sm hover:bg-yellow-300 active:scale-95 transition-all";
            timerDisplay.disabled = true;
            speechText.innerText = "몰입하는 모습 멋진데?";
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (timerPaused) return;
                
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplays();
                    // 주석: 매 초마다 경과 시간을 체크하여 말풍선을 업데이트하는 이벤트 파이프라인 호출입니다.
                    checkTimerSpeechEvents(totalSeconds, initialTimerSetupSeconds);
                }
                
                if (totalSeconds <= 0) {
                    totalSeconds = 0;
                    updateDisplays();
                    stopTimer();
                    speechText.innerText = "타이머 종료! 정말 고생했어! 🥳";
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            timerRunning = false;
            timerPaused = false;
            startTimerBtn.innerText = '시작';
            startTimerBtn.className = "bg-gray-200 border-[3px] md:border-[4px] border-black rounded-lg w-[50%] md:w-[40%] py-2 md:py-3 lg:py-4 text-black font-black text-lg md:text-xl lg:text-2xl shadow-sm hover:bg-gray-300 active:scale-95 transition-all";
            timerDisplay.disabled = false;
        }

        startTimerBtn.addEventListener('click', () => {
            if (timerRunning) {
                timerPaused = !timerPaused;
                startTimerBtn.innerText = timerPaused ? '계속' : '일시정지';
                speechText.innerText = timerPaused ? "숨 고르기 중..." : "다시 달려보자구!";
            } else {
                startTimer();
            }
        });

        resetTimerBtn.addEventListener('click', () => {
            stopTimer();
            totalSeconds = 0;
            initialTimerSetupSeconds = 0;
            updateDisplays();
            speechText.innerText = "시간은 금이라구 친구!";
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (timerRunning && !timerPaused) return;
                const addTime = parseInt(btn.getAttribute('data-time'));
                totalSeconds += addTime;
                if(totalSeconds > 359999) totalSeconds = 359999;
                updateDisplays();
            });
        });

        timerDisplay.addEventListener('keydown', (e) => {
            if (timerRunning) {
                e.preventDefault();
                return;
            }

            if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return;
            e.preventDefault();

            let digits = timerDisplay.value.replace(/:/g, '').split('');
            const start = timerDisplay.selectionStart;
            
            let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start);
            if (digitIndex === -1) digitIndex = 5;

            if (/\d/.test(e.key)) {
                digits[digitIndex] = e.key;
                totalSeconds = totalSecondsFromDigits(digits);
                updateDisplays();
                
                let nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1;
                timerDisplay.setSelectionRange(nextPos, nextPos);

            } else if (e.key === 'Backspace') {
                let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1;
                if (start === timerDisplay.value.length) targetIdx = 5;

                if (targetIdx >= 0) {
                    digits[targetIdx] = '0';
                    totalSeconds = totalSecondsFromDigits(digits);
                    updateDisplays();

                    let nextPos = DIGIT_POSITIONS[targetIdx];
                    timerDisplay.setSelectionRange(nextPos, nextPos);
                }
            }
        });

        timerDisplay.addEventListener('focus', () => {
            setTimeout(() => {
                timerDisplay.setSelectionRange(0, 0);
            }, 10);
        });

        // --- 10. 동적 캐릭터 말풍선 대사 제어 기능 스크립트 ---
        // 주석: 캐릭터 ID 및 상황 유형별로 대사 풀을 보관하는 통합 사전 데이터입니다. 차후 신규 동료 추가가 용이합니다.
        const speechPoolDatabase = {
            "char_01": {
                idle: [
                    "오늘도 무언가를 달성하기 좋은 날이군.",
                    "목록에 쌓여있는 미션들을 확인해봐.",

                    dinner: "저녁 먹을 시간이야. 맛있는 메뉴를 골라봐."
                },
                timerProgress: {
                    half: "설정했던 시간의 절반이 벌써 흘러갔어.",
                    oneMin: "마지막 1분 남았어. 조금만 더 힘을 내."
                }
            },
            "char_02": {
                idle: [
                    "마법 같은 집중력을 발휘해 볼 시간이다 냥.",
                    "주인님 기운 내라 냥.",
                    "공부나 작업은 제때 제때 끝내야 고양이다 냥."
                ],
                mealTimes: {
                    morning: "생선 구이가 생각나는 아침이다 냥.",
                    lunch: "점심 츄르를 챙겨먹을 타이밍이다 냥.",
                    dinner: "벌써 어둑어둑한 저녁 밥 타임이다 냥."
                },
                timerProgress: {
                    half: "마법 모래시계가 벌써 반이나 떨어졌다 냥.",
                    oneMin: "1분 뒤 마법이 풀리니 집중해라 냥."
                }
            }
        };

        const mainSpeechBubble = document.getElementById('main-speech-bubble');
        const mainSpeechText = document.getElementById('main-speech-text');

        // 주석: 메인 화면 로드 및 일정 주기로 일반 상태/식사 시간의 캐릭터 대사를 제어하는 전용 스케줄링 관리 함수입니다.
        function triggerMainScreenSpeech() {
            const currentHour = new Date().getHours();
            const charPool = speechPoolDatabase[currentSelectedCharacter];
            let selectText = "";

            if (currentHour >= 7 && currentHour <= 9) {
                selectText = charPool.mealTimes.morning;
            } else if (currentHour >= 12 && currentHour <= 14) {
                selectText = charPool.mealTimes.lunch;
            } else if (currentHour >= 18 && currentHour <= 20) {
                selectText = charPool.mealTimes.dinner;
            } else {
                const randomIndex = Math.floor(Math.random() * charPool.idle.length);
                selectText = charPool.idle[randomIndex];
            }

            mainSpeechText.innerText = selectText;
            mainSpeechBubble.classList.replace('hidden', 'flex');

            setTimeout(() => {
                mainSpeechBubble.classList.replace('flex', 'hidden');
            }, 5000);
        }

        // 주석: 15초 간격으로 메인 화면 캐릭터가 랜덤으로 말풍선을 띄우도록 설정한 타이머 인스턴스입니다.
        setInterval(() => {
            if (!gameScreen.classList.contains('hidden')) {
                triggerMainScreenSpeech();
            }
        }, 15000);

        // 주석: 타이머가 구동될 때 남은 비율을 모니터링하여 절반 시점 또는 1분 미만 시점에 말풍선을 발생시키는 함수입니다.
        let isHalfSpoken = false;
        let isOneMinSpoken = false;

        function checkTimerSpeechEvents(currentSeconds, initialSeconds) {
            if (initialSeconds <= 0) return;
            const charPool = speechPoolDatabase[currentSelectedCharacter];

            if (currentSeconds === Math.floor(initialSeconds / 2) && !isHalfSpoken) {
                speechText.innerText = charPool.timerProgress.half;
                isHalfSpoken = true;
            }
            
            if (currentSeconds === 60 && !isOneMinSpoken) {
                speechText.innerText = charPool.timerProgress.oneMin;
                isOneMinSpoken = true;
            }

            if (currentSeconds === 0) {
                isHalfSpoken = false;
                isOneMinSpoken = false;
            }
        }

        // 주석: 팀원들이 추후 캐릭터 스왑 기능을 연동할 수 있도록 설계해둔 인터페이스 래퍼 함수입니다.
        window.changeActiveCharacter = function(characterId) {
            if (characterDatabase[characterId]) {
                currentSelectedCharacter = characterId;
                isHalfSpoken = false;
                isOneMinSpoken = false;
            }
        };

        // 초기 빌드 앱 구동용 함수 실행
        renderQuests();
        renderStorage();
        setTimeout(triggerMainScreenSpeech, 1000);
    </script>
</body>
</html>
