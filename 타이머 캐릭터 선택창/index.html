<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Questify</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 전체 앱 루트: 좌측 게임 화면과 우측 퀘스트 패널을 한 화면에 배치하는 최상위 컨테이너 -->
  <div class="app">
        <!-- 좌측 패널: 캐릭터 로비, 타이머, 메인 모달이 올라가는 게임 영역 -->
    <div id="left-panel" class="panel">
            <!-- 게임 화면: 목표 진행도와 로비 캐릭터가 표시되는 메인 무대 -->
      <div id="game-screen" class="screen">
                <!-- 상단 HUD: 오늘의 목표 진행도와 유니온 레벨을 표시 -->
        <div class="top-hud">
          <div>
            <h2 class="goal-title">오늘의 목표</h2>
            <div class="progress-wrap">
              <div id="progress-bar-fill"></div>
              <span id="progress-text">0/0</span>
            </div>
          </div>
          <div id="user-profile-card">
            <div class="profile-name">유니온(전체) 현황</div>
            <div class="profile-level" id="union-level-hud">유니온 Lv.1</div>
          </div>
        </div>
                <!-- 로비 캐릭터는 스크립트가 동적으로 생성하므로, 실제 DOM 삽입 위치만 남겨둔 컨테이너 -->
        <div id="lobby-container"></div>
      </div>

            <!-- 타이머 화면: 공부 시간 설정과 시작/초기화 버튼을 제공하는 오버레이 -->
      <div id="timer-screen" class="screen hidden">
        <button id="close-timer-btn" class="round-close">X</button>

        <!-- 타이머 캐릭터 선택창 -->
        <div id="timer-char-select" class="timer-char-select-overlay">
          <div class="timer-char-select-box">
            <h3 class="timer-char-select-title">함께 공부할 캐릭터를 선택하세요!</h3>
            <div id="timer-char-grid" class="timer-char-grid"></div>
          </div>
        </div>

        <!-- 타이머 메인 화면 -->
        <div id="timer-main" class="hidden">
          <div class="timer-layout">
            <div class="timer-top">
              <div id="speech-bubble">
                <div class="bubble">
                  <p style="margin:0;">타이머로 공부 시간을 설정하자!</p>
                </div>
              </div>
              <div class="timer-character">
                <!-- 캐릭터 이미지 + 오버레이 -->
                <div class="timer-char-img-wrap">
                  <div class="timer-char-hud">
                    <div class="timer-char-hud-name" id="timer-char-hud-name">캐릭터</div>
                    <div class="timer-char-hud-level" id="timer-char-hud-level">Lv.1</div>
                    <div class="timer-char-hud-xpbar">
                      <div class="timer-char-hud-xpfill" id="timer-char-hud-xpfill"></div>
                    </div>
                  </div>
                  <div class="char-body"><img src="chrLD.png" alt="캐릭터LD"></div>
                </div>
              </div>
            </div>
            <div class="timer-card">
              <div class="timer-display-wrap">
                <input id="timer-display" type="text" value="00:00:00" inputmode="numeric" maxlength="8">
              </div>
              <div class="row">
                <button class="preset-btn" data-time="3600">+ 1h</button>
                <button class="preset-btn" data-time="1800">+ 30m</button>
                <button class="preset-btn" data-time="5">+ 5s</button>
              </div>
              <div class="row">
                <button id="reset-timer-btn">초기화</button>
                <button id="start-timer-btn">시작</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 타이머 종료 결과 창 -->
      <div id="timer-result-overlay" class="hidden">
        <div class="timer-result-box">
          <div class="timer-result-char-name" id="result-char-name"></div>
          <div class="timer-result-xp-badge" id="result-xp-badge">+0 XP 획득!</div>
          <div class="timer-result-lv" id="result-lv-text"></div>
          <p class="timer-result-msg">메모를 남기시겠습니까?</p>
          <div class="timer-result-btns">
            <button id="result-btn-memo" class="timer-result-btn memo">📝 메모 작성</button>
            <button id="result-btn-skip" class="timer-result-btn skip">건너뛰기</button>
          </div>
        </div>
      </div>

            <!-- 메인 팝업 오버레이: 메모, 문제풀이, 슬롯 관리 같은 주요 모달을 담당 -->
      <div id="modal-overlay" class="hidden">
        
                <!-- 캐릭터 메모 목록 모달: 선택한 캐릭터의 학습 메모를 모아 보여주는 창 -->
        <div id="char-memo-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <h2 id="char-memo-title" style="text-align:center; margin-top:0;">학습 메모</h2>
          <div id="char-memo-list" style="flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding: 2px;"></div>
          <button id="btn-open-notepad" class="submit-btn" style="width:100%; margin-top:auto;">+ 새 메모 작성</button>
        </div>

                <!-- 학습 메모 입력 모달: 새 메모 작성 및 기존 메모 편집에 공용으로 사용 -->
        <div id="notepad-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <h2 style="text-align:center; margin-top:0;">학습 메모장</h2>
          <div style="font-size:12px; color:#4b5563; margin-bottom:8px; text-align:center;" id="notepad-target-char-label"></div>
          <textarea id="input-notepad-content" class="area" placeholder="공부한 내용을 이곳에 메모하세요!"></textarea>
          <button id="btn-submit-notepad" class="submit-btn" style="background:#59A3F8; margin-top:auto;">저장</button>
        </div>

                <!-- 문제 풀이 모달: 저장된 문제를 불러와 정답 입력과 채점을 수행 -->
        <div id="solve-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <div id="solve-quiz-title" class="fake-field">문제 제목</div>
          <div id="solve-quiz-content" class="fake-field">문제 내용</div>
          <div id="solve-input-state" style="display:flex; flex-direction:column; gap:12px;">
            <input id="input-solve-answer" class="field" type="text" placeholder="정답을 적어주세요.">
            <button id="btn-grade-problem" class="submit-btn">채점</button>
          </div>
          <div id="solve-result-state" class="hidden"></div>
        </div>

                <!-- 슬롯 관리 모달: 캐릭터 추가/삭제와 전체 유니온 현황을 조정 -->
        <div id="slot-modal" class="modal-content hidden">
          <button class="close-modal-btn">X</button>
          <h2 id="union-level-display">전체 유니온 Lv.0</h2>
          <div id="slot-manager-container"></div>
          <div class="row" style="margin-top:auto; width:100%;">
            <button id="btn-reset-all-data" class="danger-btn">전체 데이터 삭제</button>
            <button id="btn-add-new-character">새 캐릭터 추가</button>
          </div>
        </div>
      </div>

            <!-- 별도 알림 오버레이: alert/confirm/prompt/select를 직접 구현한 공용 대화상자 계층 -->
      <div id="dialog-overlay" class="hidden">
        <div id="custom-alert" class="modal-content modal-mini hidden">
          <h3 style="text-align:center; margin-top:0;">알림</h3>
          <p id="custom-alert-msg" style="text-align:center; margin-bottom: 20px; font-size: 14px; white-space: pre-line; word-break: keep-all;"></p>
          <button id="custom-alert-btn" class="submit-btn" style="width: 100%; margin-top:auto;">확인</button>
        </div>

        <div id="custom-confirm" class="modal-content modal-mini hidden">
          <h3 style="text-align:center; margin-top:0;">확인</h3>
          <p id="custom-confirm-msg" style="text-align:center; margin-bottom: 20px; font-size: 14px; white-space: pre-line; word-break: keep-all;"></p>
          <div style="display:flex; gap:10px; margin-top:auto;">
            <button id="custom-confirm-cancel" class="danger-btn" style="flex:1;">취소</button>
            <button id="custom-confirm-ok" class="submit-btn" style="flex:1;">확인</button>
          </div>
        </div>

        <div id="custom-prompt" class="modal-content modal-mini hidden">
          <h3 id="custom-prompt-title" style="text-align:center; margin-top:0;">입력</h3>
          <input type="text" id="custom-prompt-input" class="field" style="margin-bottom: 20px;">
          <div style="display:flex; gap:10px; margin-top:auto;">
            <button id="custom-prompt-cancel" class="danger-btn" style="flex:1;">취소</button>
            <button id="custom-prompt-ok" class="submit-btn" style="flex:1;">확인</button>
          </div>
        </div>

        <div id="custom-select" class="modal-content modal-mini hidden">
          <h3 id="custom-select-title" style="text-align:center; margin-top:0;">선택</h3>
          <p id="custom-select-msg" style="text-align:center; margin-bottom: 12px; font-size: 14px; white-space: pre-line;"></p>
          <select id="custom-select-input" class="field" style="margin-bottom: 20px;"></select>
          <button id="custom-select-ok" class="submit-btn" style="width: 100%; margin-top:auto;">확인</button>
        </div>
      </div>
    </div>

        <!-- 우측 패널: 일일퀘스트와 문제저장소를 전환하는 작업 패널 -->
    <div id="right-panel-wrapper" class="panel">
      <button id="mobile-toggle-btn">☰</button>

            <!-- 일일퀘스트 패널: 현재 진행 중인 TODO 목록을 보여주는 기본 탭 -->
      <div id="panel-quest" class="panel-view">
        <h1 class="panel-title">일일퀘스트</h1>
        <div id="quest-list-container" class="list"></div>
      </div>

            <!-- 문제저장소 패널: AI 생성 문제를 확인하고 풀 수 있는 보관함 -->
      <div id="panel-storage" class="panel-view hidden">
        <h1 class="panel-title">문제저장소</h1>
        <div id="storage-list-container" class="list"></div>
      </div>

            <!-- 타이머 진입 버튼: 우측 하단에서 항상 보이는 바로가기 버튼 -->
      <div id="open-timer-btn">
        <img src="타이머.png" alt="timer-icon" style="width: 50px;">
      </div>

            <!-- 하단 탭 바: 모바일/협소 화면에서 패널 전환을 담당 -->
      <div id="bottom-tab-bar">
        <div id="tab-quest" class="tab active">
          <div class="tab-ui-highlight"></div>
          일일퀘스트
        </div>
        <div id="tab-storage" class="tab">
          <div class="tab-ui-highlight"></div>
          문제저장소
        </div>
      </div>
    </div>
  </div>

    <!-- 시스템 로직: 유니온 XP, 로비 캐릭터, 저장 상태를 총괄하는 핵심 스크립트 -->
  <script>
    (function () {
      // ===== 유니온/경험치 시스템 초기화 =====
      'use strict';
            // 캐릭터가 도달할 수 있는 최대 레벨
      const MAX_LEVEL = 50;
            // 유니온 저장 전용 localStorage 키
      const STORAGE_KEY = 'questify_player_v3';
      
            // 유니온 상태: 캐릭터 목록, 위치, 레벨, 경험치를 한 번에 보관
      let state = { 
        characters: [{ name: '기본 목표', level: 1, xp: 0, x: 50, y: 80, showExclamation: false }]
      };
            // 자주 참조하는 동적 DOM 노드 저장소
      const DOM = {};

      // [기존 코드 유지] 경험치 요구량 계산
            // 현재 레벨에서 다음 레벨까지 필요한 경험치량을 계산
      function getXpRequired(level) { return level >= MAX_LEVEL ? Infinity : 100; }
            // 모든 캐릭터 레벨의 합으로 전체 유니온 레벨 산출
      function getUnionLevel() { return state.characters.reduce((sum, char) => sum + char.level, 0); }

            // XP 획득/레벨업 텍스트를 띄울 전용 오버레이 레이어 생성
      function createFloatLayer() {
        const gameScreen = document.getElementById('game-screen');
        DOM.floatLayer = document.createElement('div');
        DOM.floatLayer.style.cssText = 'position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden;';
        gameScreen.appendChild(DOM.floatLayer);
      }

            // HUD와 로비 캐릭터를 다시 그려 화면 상태를 최신화
      function updateUI() {
        const unionElHUD = document.getElementById('union-level-hud');
        if (unionElHUD) unionElHUD.textContent = '유니온 Lv.' + getUnionLevel();
        if (typeof renderLobbyCharacters === 'function') renderLobbyCharacters();
      }

            // 특정 캐릭터에 경험치를 부여하고 필요 시 레벨업까지 처리
      function gainXP(amount, charIdx = 0) {
        if(charIdx >= state.characters.length) charIdx = 0;
        const char = state.characters[charIdx];
        
        if (char.level >= MAX_LEVEL) { showFloat('만렙 달성!', false, charIdx); return; }
        showFloat('+' + amount + ' XP', false, charIdx);
        char.xp += amount;
        
        while (char.level < MAX_LEVEL && char.xp >= getXpRequired(char.level)) {
          char.xp -= getXpRequired(char.level);
          char.level++;
          showFloat('Lv.' + char.level + ' 달성!', true, charIdx);
        }
        if (char.level >= MAX_LEVEL) char.xp = 0;
        updateUI();
        save();
      }

            // 화면 위에 떠오르는 경험치/레벨업 문구를 생성
      function showFloat(text, isLevelUp, charIdx = 0) {
        if (!DOM.floatLayer) return;
        const charEl = document.querySelector(`.lobby-char[data-idx="${charIdx}"]`);
        let left = '50%', top = '50%';
        if (charEl) {
          left = charEl.style.left;
          top = charEl.style.top;
        }

        const el = document.createElement('div');
        el.textContent = text;
        el.style.cssText = `position:absolute; left:${left}; top:${top}; transform:translate(-50%,-100%); font-size:${isLevelUp ? '24px' : '16px'}; font-weight:900; color:${isLevelUp ? '#2563eb' : '#111'}; text-shadow:1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff; white-space:nowrap; animation:xpFloatUp 1.4s ease-out forwards;`;
        DOM.floatLayer.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }

            // 유니온 상태를 localStorage에 즉시 저장
      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      
            // 저장된 유니온 상태를 불러오고 좌표값을 안전하게 보정
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const loadedState = JSON.parse(raw);
            if (loadedState.characters && loadedState.characters.length > 0) {
              state.characters = loadedState.characters;
              state.characters.forEach(c => {
                if (typeof c.x !== 'number' || isNaN(c.x)) c.x = 50;
                if (typeof c.y !== 'number' || isNaN(c.y)) c.y = 80;
                // 새로고침 해도 ! 가 사라지지 않도록 c.showExclamation 강제 초기화 코드는 삭제된 상태 유지
              });
            }
          }
        } catch (e) {
          console.warn('Init error', e);
        }
      }

            // 외부 스크립트에서 호출할 수 있도록 핵심 API 공개
      window.Questify = {
        gainXP,
        getUnionLevel,
        getXpRequired,
        getCharacters: () => state.characters,
        saveState: save,
        updateUI: updateUI,
        reset() {
          localStorage.removeItem(STORAGE_KEY);
          state = { characters: [{ name: '기본 목표', level: 1, xp: 0, x: 50, y: 80, showExclamation: false }]};
          updateUI();
        }
      };

            // 시작 시 플로팅 레이어 생성 → 저장 상태 로드 → 첫 UI 갱신 예약
      createFloatLayer();
      load();
      setTimeout(updateUI, 50); 
    })();
  </script>

    <!-- 공용 팝업/데이터/UI 제어: alert·confirm·prompt·select 및 앱 상태 렌더링을 담당 -->
  <script>
        // ===== 공용 대화상자(알림/확인/입력/선택) 상태 =====
    let customAlertCb, customConfirmCb, customPromptCb, customSelectCb;
        const dialogOverlay = document.getElementById('dialog-overlay');
    // dialogOverlay는 alert/confirm/prompt/select를 공통으로 담는 가장 바깥 레이어

        // 열려 있는 커스텀 대화상자를 모두 숨김
    function closeAllDialogs() {
      document.querySelectorAll('#dialog-overlay .modal-content').forEach(m => m.classList.add('hidden'));
    }

        // 요청한 대화상자만 표시하고 나머지는 숨김
    function openSpecificDialog(dialogId) {
      dialogOverlay.classList.remove('hidden');
      closeAllDialogs();
      document.getElementById(dialogId).classList.remove('hidden');
    }

        // 확인 버튼만 필요한 알림창
    window.showCustomAlert = function(msg, callback) {
      document.getElementById('custom-alert-msg').innerText = msg;
      customAlertCb = callback;
      openSpecificDialog('custom-alert');
    }
    document.getElementById('custom-alert-btn').onclick = () => {
      dialogOverlay.classList.add('hidden');
      if(customAlertCb) customAlertCb();
    }

        // 확인/취소가 필요한 2버튼 확인창
    window.showCustomConfirm = function(msg, onConfirm) {
      document.getElementById('custom-confirm-msg').innerText = msg;
      customConfirmCb = onConfirm;
      openSpecificDialog('custom-confirm');
    }
    document.getElementById('custom-confirm-cancel').onclick = () => dialogOverlay.classList.add('hidden');
    document.getElementById('custom-confirm-ok').onclick = () => {
      dialogOverlay.classList.add('hidden');
      if(customConfirmCb) customConfirmCb();
    }

        // 문자열 입력을 받는 프롬프트 창
    window.showCustomPrompt = function(title, defaultVal, onConfirm) {
      document.getElementById('custom-prompt-title').innerText = title;
      const input = document.getElementById('custom-prompt-input');
      input.value = defaultVal || '';
      customPromptCb = onConfirm;
      openSpecificDialog('custom-prompt');
      setTimeout(() => input.focus(), 50);
    }
    document.getElementById('custom-prompt-cancel').onclick = () => dialogOverlay.classList.add('hidden');
    document.getElementById('custom-prompt-ok').onclick = () => {
      const val = document.getElementById('custom-prompt-input').value;
      dialogOverlay.classList.add('hidden');
      if(customPromptCb) customPromptCb(val);
    }

        // 선택지 목록을 보여주는 셀렉트 창
    window.showCustomSelect = function(title, msg, options, onConfirm) {
      document.getElementById('custom-select-title').innerText = title;
      document.getElementById('custom-select-msg').innerText = msg;
      const select = document.getElementById('custom-select-input');
      select.innerHTML = '';
      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.value;
        el.innerText = opt.text;
        select.appendChild(el);
      });
      customSelectCb = onConfirm;
      openSpecificDialog('custom-select');
    }
    document.getElementById('custom-select-ok').onclick = () => {
      const val = document.getElementById('custom-select-input').value;
      dialogOverlay.classList.add('hidden');
      if(customSelectCb) customSelectCb(val);
    }

        /* ===== 메인 모달(메모/문제/슬롯) 제어 ===== */
    const modalOverlay = document.getElementById('modal-overlay');
        // 메인 모달 오버레이 안의 열린 창을 모두 닫음
    function closeAllCustomModals() {
      document.querySelectorAll('#modal-overlay .modal-content').forEach(m => m.classList.add('hidden'));
    }
        // 특정 메인 모달만 열기 위한 공용 헬퍼
    function openSpecificModal(modalId) {
      modalOverlay.classList.remove('hidden');
      closeAllCustomModals();
      document.getElementById(modalId).classList.remove('hidden');
    }

    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => { 
        modalOverlay.classList.add('hidden'); 
        currentActiveQuiz = null; 
        editingMemoId = null; 
      });
    });
    modalOverlay.addEventListener('mousedown', (e) => {
      if (e.target === modalOverlay) { 
        modalOverlay.classList.add('hidden'); 
        currentActiveQuiz = null; 
        editingMemoId = null; 
      }
    });

        /* ================= 앱 메인 데이터 로직: TODO / 메모 / 문제 저장소 ================= */
        // 앱 데이터 저장 전용 localStorage 키
    const APP_DATA_KEY = 'questify_app_data_v4';
        // 일일퀘스트(TODO) 목록
    let todoList = [];
        // 캐릭터별 학습 메모 저장소
    let memoStorage = []; 
        // 메모에서 생성된 문제 저장소
    let quizStorage = []; 
        // 현재 풀이 중인 문제 상태
    let currentActiveQuiz = null;
        // 메모 작성/편집 대상 캐릭터 인덱스
    let targetCharIdxForMemo = 0; 
        // 편집 중인 메모 ID
    let editingMemoId = null; 

        // 사용자 입력을 HTML에 안전하게 출력하기 위한 이스케이프
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

        // 앱 데이터(TODO/메모/문제)를 localStorage에서 복원
    function loadAppData() {
      try {
        const data = localStorage.getItem(APP_DATA_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          todoList = parsed.todoList || [];
          quizStorage = parsed.quizStorage || [];
          memoStorage = parsed.memoStorage || [];
        }
      } catch (e) { }
    }

        // 현재 앱 데이터를 localStorage에 저장
    function saveAppData() {
      localStorage.setItem(APP_DATA_KEY, JSON.stringify({ todoList, quizStorage, memoStorage }));
    }

        // 핵심 렌더 루틴: 목록/진행도/유니온 UI를 한 번에 갱신
    function renderAll() {
      renderTodoList();
      renderStorageList();
      updateProgressBar();
      saveAppData();
      syncExclamations();
      if (window.Questify) window.Questify.updateUI(); 
    }

        // 좌측 상단 일일퀘스트 목록을 렌더링
    function renderTodoList() {
      const container = document.getElementById('quest-list-container');
      container.innerHTML = '';
      const todos = todoList.filter(item => item.type === 'todo');

      todos.sort((a, b) => {
        if (a.status === 'clear' && b.status !== 'clear') return 1;
        if (a.status !== 'clear' && b.status === 'clear') return -1;
        return 0;
      });

      todos.forEach(item => {
        const card = document.createElement('div');
        card.className = 'todo-card draggable-todo-item' + (item.status === 'clear' ? ' clear' : '');
        card.dataset.id = item.id;
        card.dataset.status = item.status;
        if (item.status !== 'clear') card.draggable = true;
        
        const isEditing = item.isEditing ? '' : 'readonly';
        const placeholder = item.isEditing ? '내용을 적고 Enter를 누르세요' : '';

        card.innerHTML = `
          <div style="display:flex; align-items:center; width:100%; overflow:hidden;">
            ${item.status !== 'clear' ? '<span class="drag-handle">≡</span>' : ''}
            <div style="display:flex; flex-direction:column; width:100%;">
              <input type="text" class="inline-todo-input" value="${escapeHTML(item.title || '')}" ${isEditing} placeholder="${placeholder}"
                onclick="if(this.readOnly) makeTodoEditable(${item.id})"
                onblur="saveTodoTitle(${item.id}, this.value)"
                onkeydown="if(event.key==='Enter') this.blur()">
            </div>
          </div>
          <div style="display:flex; gap:4px; flex-shrink:0; margin-left:8px;">
            ${item.status !== 'clear' 
              ? `<button onclick="handleTodoAction(${item.id}, 'clear')" id="suc" class="mini-btn"><span>성공</span></button>
                 <button onclick="handleTodoAction(${item.id}, 'delete')" id="del" class="mini-btn"><span>삭제</span></button>` 
              : `<span style="color: white; opacity: 25%; font-size:12px;">성공!</span>`}
          </div>`;
          
        if (item.status !== 'clear') {
          card.addEventListener('dragstart', handleDragStart);
          card.addEventListener('dragover', handleDragOver);
          card.addEventListener('dragend', handleDragEnd);
        }
        container.appendChild(card);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-card';
      addBtn.innerHTML = '<span>+</span>';
      addBtn.onclick = () => {
        const newId = Date.now();
        todoList.push({ id: newId, type: 'todo', title: '', status: 'ready', isEditing: true });
        renderAll();
        setTimeout(() => {
          const input = document.querySelector(`.todo-card[data-id='${newId}'] input.inline-todo-input`);
          if (input) input.focus();
        }, 50);
      };
      container.appendChild(addBtn);
    }

        // TODO 제목 수정/삭제 처리
    window.saveTodoTitle = function(id, newTitle) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;
      if (newTitle.trim() === '') todoList.splice(idx, 1);
      else {
        todoList[idx].title = newTitle.trim();
        delete todoList[idx].isEditing;
      }
      renderAll();
    };

        // 읽기 전용 TODO 항목을 편집 모드로 전환
    window.makeTodoEditable = function(id) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx !== -1 && todoList[idx].status !== 'clear') {
        todoList[idx].isEditing = true;
        renderAll();
        setTimeout(() => {
          const input = document.querySelector(`.todo-card[data-id='${id}'] input.inline-todo-input`);
          if (input) input.focus();
        }, 50);
      }
    };

        // 완료한 TODO 비율을 진행 바와 숫자로 표시
    function updateProgressBar() {
      const todos = todoList.filter(item => item.type === 'todo');
      const total = todos.length;
      const clears = todos.filter(item => item.status === 'clear').length;
      const percent = total > 0 ? (clears / total) * 100 : 0;
      document.getElementById('progress-bar-fill').style.width = percent + '%';
      document.getElementById('progress-text').innerText = clears + '/' + total;
    }

        // 기존 메모를 편집하기 위해 메모장 모달을 재사용
    window.editMemo = function(memoId, charIdx) {
      const memo = memoStorage.find(m => m.id === memoId);
      if(!memo) return;
      editingMemoId = memoId;
      targetCharIdxForMemo = charIdx;
      const charName = window.Questify.getCharacters()[charIdx].name;
      document.getElementById('notepad-target-char-label').innerText = `[${charName}] 캐릭터의 메모를 수정합니다.`;
      document.getElementById('input-notepad-content').value = memo.content;
      openSpecificModal('notepad-modal');
    };

        // 특정 캐릭터의 메모 목록을 모달에 렌더링
    function renderCharMemos(charIdx) {
      const charName = window.Questify.getCharacters()[charIdx]?.name || '캐릭터';
      document.getElementById('char-memo-title').innerText = `[${charName}]의 학습 메모`;
      const container = document.getElementById('char-memo-list');
      container.innerHTML = '';
      
      const memos = memoStorage.filter(m => m.charIdx === charIdx);
      if (memos.length === 0) {
          container.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px; font-size:14px; font-weight:800;">아직 작성된 메모가 없습니다.</div>';
      } else {
          memos.forEach(m => {
              const el = document.createElement('div');
              el.style.cssText = 'padding:12px; border:3px solid #000; border-radius:10px; background:#fff; font-size:13px; font-weight:800; display:flex; flex-direction:column; gap:8px; margin-bottom: 4px;';
              el.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px dashed #ccc; padding-bottom: 4px;">
                  <div style="font-size:10px; color:#999;">${m.date || ''}</div>
                  <div style="display:flex; gap:6px;">
                    <button style="border:2px solid #000; border-radius:5px; background:#f59e0b; font-size:11px; font-weight:bold; color:#fff; padding:4px 8px;" onclick="editMemo(${m.id}, ${charIdx})">편집</button>
                    <button style="border:2px solid #000; border-radius:5px; background:#ef4444; font-size:11px; font-weight:bold; color:#fff; padding:4px 8px;" onclick="deleteMemo(${m.id}, ${charIdx})">삭제</button>
                  </div>
                </div>
                <div style="line-height:1.4; white-space:pre-wrap; word-break:break-all; color:#000;">${escapeHTML(m.content)}</div>
              `;
              container.appendChild(el);
          });
      }
    }

        // 메모 삭제 확인 후 항목 제거
    window.deleteMemo = function(memoId, charIdx) {
      showCustomConfirm('이 메모를 삭제하시겠습니까?', () => {
        memoStorage = memoStorage.filter(m => m.id !== memoId);
        saveAppData();
        renderCharMemos(charIdx);
      });
    }

        // 새 메모 작성 버튼: 현재 캐릭터에 대한 메모 입력 창을 연다
    document.getElementById('btn-open-notepad').onclick = () => {
      editingMemoId = null; 
      const charName = window.Questify.getCharacters()[targetCharIdxForMemo].name;
      document.getElementById('notepad-target-char-label').innerText = `[${charName}] 캐릭터에게 메모를 추가합니다.`;
      document.getElementById('input-notepad-content').value = '';
      openSpecificModal('notepad-modal');
    };

        // 우측 문제저장소 목록을 렌더링
    function renderStorageList() {
      const container = document.getElementById('storage-list-container');
      container.innerHTML = '';
      
      if(quizStorage.length === 0) {
         container.innerHTML = '<div style="text-align:center; color:rgba(0,0,0,0.5); font-weight:800; margin-top:30px;">저장된 AI 문제가 없습니다.<br>캐릭터에 메모를 추가해보세요!</div>';
         return;
      }

      quizStorage.forEach(quiz => {
        const charName = window.Questify.getCharacters()[quiz.charIdx]?.name || '알 수 없음';
        const card = document.createElement('div');
        card.className = 'storage-card';
        card.innerHTML = `
          <div class="storage-title">${escapeHTML(quiz.title)} <span style="font-size:10px; color:#fcd34d;">[${escapeHTML(charName)}]</span></div>
          <div class="storage-bottom">
            <span class="storage-tag">AI 자동 생성 문제</span>
            <div class="storage-actions">
              <button id="Pdel" class="mini-btn" onclick="deleteQuizFromStorage(${quiz.id})">삭제</button>
              <button id="Bstorage" class="mini-btn" onclick="openSolveModalFromStorage(${quiz.id})">풀기</button>
            </div>
          </div>`;
        container.appendChild(card);
      });
    }

        // 메모 저장/수정 제출 처리
    document.getElementById('btn-submit-notepad').addEventListener('click', () => {
      const content = document.getElementById('input-notepad-content').value.trim();
      if (!content) {
        showCustomAlert('공부한 내용을 적어주세요!');
        return;
      }

      if (editingMemoId) {
        const idx = memoStorage.findIndex(m => m.id === editingMemoId);
        if(idx !== -1) {
          memoStorage[idx].content = content;
          memoStorage[idx].date = new Date().toLocaleDateString() + ' (수정됨)';
        }
        editingMemoId = null;
        saveAppData();
        showCustomAlert('메모가 수정되었습니다!', () => {
           renderCharMemos(targetCharIdxForMemo);
           openSpecificModal('char-memo-modal');
        });
      } else {
        memoStorage.push({
          id: Date.now(),
          charIdx: targetCharIdxForMemo,
          content: content,
          date: new Date().toLocaleDateString()
        });
        saveAppData();
        
        showCustomAlert('메모가 저장되었습니다!\n(문제는 시간 경과에 따라 자동으로 생성됩니다.)', () => {
           renderCharMemos(targetCharIdxForMemo);
           openSpecificModal('char-memo-modal');
           renderAll();
        });
      }
    });

        // 문제 보유 여부에 따라 캐릭터의 느낌표 표시를 동기화
    function syncExclamations() {
      const chars = window.Questify.getCharacters();
      let needsUpdate = false;
      chars.forEach((c, idx) => {
         const charQuizzes = quizStorage.filter(q => q.charIdx === idx);
         if (charQuizzes.length === 0 && c.showExclamation) {
            c.showExclamation = false;
            needsUpdate = true;
         } else if (charQuizzes.length > 0 && !c.showExclamation) {
            c.showExclamation = true;
            needsUpdate = true;
         }
      });
      if (needsUpdate) {
        window.Questify.saveState();
        if (typeof renderLobbyCharacters === 'function') renderLobbyCharacters();
      }
    }

        // 일정 간격으로 메모를 바탕으로 AI 문제를 자동 생성
    setInterval(() => {
      if (memoStorage.length === 0) return;
      
      if (Math.random() < 0.5) {
        const randomMemo = memoStorage[Math.floor(Math.random() * memoStorage.length)];
        const chars = window.Questify.getCharacters();
        const targetChar = chars[randomMemo.charIdx];
        
        const alreadyHasQuiz = quizStorage.some(q => q.charIdx === randomMemo.charIdx);
        
        if (targetChar && !targetChar.showExclamation && !alreadyHasQuiz) {
          
          // [수정 유지] 추후 API 연동을 위해 생성 텍스트 단순화 유지
          const title = "Ai생성 문제 제목";
          const aiContent = "Ai생성 문제 내용";
          const answer = "자유 응답형";

          quizStorage.push({ 
            id: Date.now(), 
            title, 
            content: aiContent, 
            answer, 
            charIdx: randomMemo.charIdx 
          });
          
          targetChar.showExclamation = true;
          
          saveAppData();
          window.Questify.saveState();
          window.Questify.updateUI(); 
          renderStorageList();
        }
      }
    }, 15000); 

        // TODO 성공 처리 / 삭제 처리
    window.handleTodoAction = function (id, action) {
      const idx = todoList.findIndex(item => item.id === id);
      if (idx === -1) return;

      if (action === 'clear') {
        todoList[idx].status = 'clear';
        const chars = window.Questify.getCharacters();
        chars.forEach((c, i) => {
          window.Questify.gainXP(20, i);
        });
      }

      if (action === 'delete') {
        todoList.splice(idx, 1);
      }
      renderAll();
    };

        // 문제저장소에서 문제를 삭제
    window.deleteQuizFromStorage = function (quizId) {
      showCustomConfirm('이 문제(AI 생성)를 삭제하시겠습니까?', () => {
        quizStorage = quizStorage.filter(q => q.id !== quizId);
        syncExclamations();
        renderAll();
      });
    };

        // 저장소 카드에서 선택한 문제를 풀이 모달로 열기
    window.openSolveModalFromStorage = function (quizId) {
      const quiz = quizStorage.find(q => q.id === quizId);
      if (quiz) setupSolveModal(quiz, false);
    };

        // 로비 캐릭터의 느낌표 클릭 시 해당 캐릭터 문제를 랜덤으로 오픈
    window.handleExclamationClick = function (e, charIdx) {
      e.stopPropagation(); 
      const charQuizzes = quizStorage.filter(q => q.charIdx === charIdx);
      if (charQuizzes.length === 0) {
        syncExclamations();
        return;
      }
      
      const randomQuiz = charQuizzes[Math.floor(Math.random() * charQuizzes.length)];
      setupSolveModal(randomQuiz, true); 
      currentActiveQuiz.isLobbySurprise = true; 
    };

        // 문제 풀이 모달의 내용을 채우고 초기 상태로 준비
    function setupSolveModal(quiz, isSurprise) {
      currentActiveQuiz = { ...quiz, isSurprise };
      document.getElementById('solve-quiz-title').innerText = quiz.title;
      document.getElementById('solve-quiz-content').innerText = quiz.content;
      document.getElementById('input-solve-answer').value = '';
      document.getElementById('solve-input-state').classList.remove('hidden');
      document.getElementById('solve-result-state').className = 'hidden';
      openSpecificModal('solve-modal');
    }

        // 채점 버튼: 정답 검증 대신 현재 구조에 맞는 보상/삭제 흐름 수행
    document.getElementById('btn-grade-problem').addEventListener('click', () => {
      if (!currentActiveQuiz) return;
      
      document.getElementById('solve-input-state').classList.add('hidden');
      const resultBox = document.getElementById('solve-result-state');
      resultBox.classList.remove('hidden');

      resultBox.className = 'result-good';
      resultBox.innerText = '문제 해결! 경험치를 획득했습니다.';
      resultBox.onclick = null;
      
      if (window.Questify) window.Questify.gainXP(currentActiveQuiz.isSurprise ? 30 : 20, currentActiveQuiz.charIdx);
      
      quizStorage = quizStorage.filter(q => q.id !== currentActiveQuiz.id);
      syncExclamations();
      
      renderAll();
    });

        // 로비 캐릭터가 렌더링되는 실제 DOM 컨테이너
    const lobbyContainer = document.getElementById('lobby-container');
        const gameScreenBox = document.getElementById('game-screen');
    let isCharDragging = false;
    let dragTargetChar = null;
    let charStartX = 0, charStartY = 0;
    let charInitialLeft = 0, charInitialTop = 0;
    let dragMoved = false; 

        // 저장된 캐릭터 상태를 바탕으로 로비 캐릭터 DOM을 다시 생성
    function renderLobbyCharacters() {
      lobbyContainer.innerHTML = '';
      const chars = window.Questify.getCharacters();
      if (!chars || chars.length === 0) return;
      
      chars.forEach((char, idx) => {
        const charWrapper = document.createElement('div');
        charWrapper.className = 'lobby-char';
        charWrapper.dataset.idx = idx;
        charWrapper.style.left = char.x + '%';
        charWrapper.style.top = char.y + '%';

        let exclamationHTML = '';
        if (char.showExclamation) {
          exclamationHTML = `<div class="char-exclamation" onclick="handleExclamationClick(event, ${idx})">!</div>`;
        }

        const color = char.level >= 40 ? '#f87171' : char.level >= 20 ? '#fcd34d' : char.level >= 10 ? '#93c5fd' : '#f3f4f6';
        
        // [복구] 캐릭터 밑 경험치 바 (HTML)
        const requiredXP = window.Questify.getXpRequired(char.level);
        const xpPercent = requiredXP === Infinity ? 100 : Math.min(100, (char.xp / requiredXP) * 100);

        charWrapper.innerHTML = `
          ${exclamationHTML}
          <div class="char-bubble hidden"></div>
          <div class="char-body">
             <img src="chrSD.png" alt="캐릭터SD">
          </div>
          <div class="char-nameplate">
            <div class="char-name-text">${escapeHTML(char.name)}</div>
            <div class="char-level-text">Lv.${char.level}</div>
            <div class="char-xp-bar-container">
              <div class="char-xp-bar-fill" style="width: ${xpPercent}%;"></div>
            </div>
          </div>
        `;
        
        charWrapper.addEventListener('mousedown', startCharDrag);
        charWrapper.addEventListener('touchstart', startCharDrag, { passive: false });
        lobbyContainer.appendChild(charWrapper);
      });
    }

        // 캐릭터 드래그 시작: 포인터 좌표와 초기 위치를 기록
    function startCharDrag(e) {
      if (gameScreenBox.classList.contains('hidden')) return;
      if (e.target.classList.contains('char-exclamation')) return; 

      isCharDragging = true;
      dragMoved = false; 
      dragTargetChar = e.currentTarget;
      const point = e.type.includes('mouse') ? e : e.touches[0];
      charStartX = point.clientX;
      charStartY = point.clientY;
      
      const parentRect = gameScreenBox.getBoundingClientRect();
      const rect = dragTargetChar.getBoundingClientRect();
      charInitialLeft = rect.left - parentRect.left;
      charInitialTop = rect.top - parentRect.top;
      
      dragTargetChar.style.left = charInitialLeft + 'px';
      dragTargetChar.style.top = charInitialTop + 'px';
      dragTargetChar.style.transform = 'none'; 
    }

        // 캐릭터 드래그 중: 좌표를 실시간 갱신하고 화면 밖 이동을 방지
    function dragChar(e) {
      if (!isCharDragging || !dragTargetChar) return;
      const point = e.type.includes('mouse') ? e : e.touches[0];
      if (Math.abs(point.clientX - charStartX) > 5 || Math.abs(point.clientY - charStartY) > 5) {
        dragMoved = true;
      }

      if(dragMoved) {
        e.preventDefault();
        let newLeft = charInitialLeft + (point.clientX - charStartX);
        let newTop = charInitialTop + (point.clientY - charStartY);
        const parentRect = gameScreenBox.getBoundingClientRect();
        const rect = dragTargetChar.getBoundingClientRect();
        
        if (newLeft < 0) newLeft = 0;
        if (newTop < 0) newTop = 0;
        if (newLeft + rect.width > parentRect.width) newLeft = parentRect.width - rect.width;
        if (newTop + rect.height > parentRect.height) newTop = parentRect.height - rect.height;
        
        dragTargetChar.style.left = newLeft + 'px';
        dragTargetChar.style.top = newTop + 'px';
      }
    }

        // 캐릭터 드래그 종료: 이동 완료 또는 클릭 시 메모 모달로 분기
    function endCharDrag(e) {
      if (!isCharDragging || !dragTargetChar) return;
      isCharDragging = false;
      
      if (!dragMoved) {
        const clickedIdx = parseInt(dragTargetChar.dataset.idx);
        targetCharIdxForMemo = clickedIdx;
        renderCharMemos(clickedIdx);
        openSpecificModal('char-memo-modal');
        dragTargetChar = null;
        return;
      }
      
      const parentRect = gameScreenBox.getBoundingClientRect();
      if(parentRect.width === 0 || parentRect.height === 0) {
        dragTargetChar = null;
        return;
      }

      let currentLeft = parseFloat(dragTargetChar.style.left);
      let currentTop = parseFloat(dragTargetChar.style.top);
      
      const others = Array.from(document.querySelectorAll('.lobby-char')).filter(el => el !== dragTargetChar);
      others.forEach(other => {
        const oLeft = other.offsetLeft;
        const oTop = other.offsetTop;
        const dist = Math.hypot(currentLeft - oLeft, currentTop - oTop);
        if(dist < 50) { 
           currentLeft += 50;
           currentTop += 50;
        }
      });

      let pctX = (currentLeft / parentRect.width) * 100;
      let pctY = (currentTop / parentRect.height) * 100;
      
      if(isNaN(pctX) || pctX < 0) pctX = 50;
      if(isNaN(pctY) || pctY < 0) pctY = 80;

      dragTargetChar.style.left = pctX + '%';
      dragTargetChar.style.top = pctY + '%';
      
      const idx = parseInt(dragTargetChar.dataset.idx);
      const chars = window.Questify.getCharacters();
      if(chars[idx]) {
        chars[idx].x = pctX;
        chars[idx].y = pctY;
        window.Questify.saveState();
      }
      
      dragTargetChar = null;
    }

        // 마우스/터치 입력을 공통 드래그 루틴에 연결
    document.addEventListener('mousemove', dragChar);
    document.addEventListener('mouseup', endCharDrag);
    document.addEventListener('touchmove', dragChar, { passive: false });
    document.addEventListener('touchend', endCharDrag);

        // 로비 캐릭터가 가끔 랜덤 대사를 띄우도록 하는 간단한 연출
    setInterval(() => {
      const chars = document.querySelectorAll('.lobby-char');
      if(chars.length === 0 || gameScreenBox.classList.contains('hidden')) return;
      
      const randomChar = chars[Math.floor(Math.random() * chars.length)];
      const idx = parseInt(randomChar.dataset.idx);
      const charData = window.Questify.getCharacters()[idx];
      
      if (charData && charData.showExclamation) return;

      const bubble = randomChar.querySelector('.char-bubble');
      if (!bubble) return;
      
      const lines = ["오늘도 화이팅!", "퀘스트 잊지 않았지?", "메모를 남겨볼까?", "성장하고 있어!"];
      bubble.innerText = lines[Math.floor(Math.random() * lines.length)];
      bubble.classList.remove('hidden');
      
      setTimeout(() => {
        bubble.classList.add('hidden');
      }, 3000);
    }, 6000);

    /* 타이머 로직 (Masked Input 복구 유지) */
    const timerDisplay = document.getElementById('timer-display');
    const startTimerBtn = document.getElementById('start-timer-btn');
    const resetTimerBtn = document.getElementById('reset-timer-btn');
    const presetBtns = document.querySelectorAll('.preset-btn');
    let totalSeconds = 0;
    let timerInterval = null;
    let timerRunning = false;
    let timerPaused = false;
    const DIGIT_POSITIONS = [0, 1, 3, 4, 6, 7];

    function formatTime(seconds) {
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function totalSecondsFromDigits(digits) {
      const h = Number(`${digits[0]}${digits[1]}`) || 0;
      const m = Number(`${digits[2]}${digits[3]}`) || 0;
      const s = Number(`${digits[4]}${digits[5]}`) || 0;
      return (h * 3600) + (m * 60) + s;
    }

    function updateDisplays() { timerDisplay.value = formatTime(totalSeconds); }

    timerDisplay.addEventListener('keydown', e => {
      if (timerRunning) { e.preventDefault(); return; }
      if (['ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'].includes(e.key)) return;
      e.preventDefault();
      
      let digits = timerDisplay.value.replace(/:/g, '').split('');
      const start = timerDisplay.selectionStart;

      if (/\d/.test(e.key)) {
        let digitIndex = DIGIT_POSITIONS.findIndex(pos => pos >= start);
        if (digitIndex === -1) digitIndex = 5;
        digits[digitIndex] = e.key;
        totalSeconds = totalSecondsFromDigits(digits);
        updateDisplays();
        const nextPos = digitIndex < 5 ? DIGIT_POSITIONS[digitIndex + 1] : DIGIT_POSITIONS[5] + 1;
        timerDisplay.setSelectionRange(nextPos, nextPos);
      } else if (e.key === 'Backspace') {
        let targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start) - 1;
        if (start === timerDisplay.value.length) targetIdx = 5;
        if (targetIdx >= 0) {
          digits[targetIdx] = '0';
          totalSeconds = totalSecondsFromDigits(digits);
          updateDisplays();
          timerDisplay.setSelectionRange(DIGIT_POSITIONS[targetIdx], DIGIT_POSITIONS[targetIdx]);
        }
      } else if (e.key === 'Delete') {
        const targetIdx = DIGIT_POSITIONS.findIndex(pos => pos >= start);
        if (targetIdx !== -1) {
          digits[targetIdx] = '0';
          totalSeconds = totalSecondsFromDigits(digits);
          updateDisplays();
          timerDisplay.setSelectionRange(start, start);
        }
      }
    });

    function startTimer() {
      if (totalSeconds <= 0) return;
      timerRunning = true;
      timerPaused = false;
      startTimerBtn.innerText = '일시정지';
      timerDisplay.disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timerPaused) return;
        if (totalSeconds > 0) {
          totalSeconds--;
          updateDisplays();
        }
        if (totalSeconds <= 0) {
          totalSeconds = 0;
          updateDisplays();
          stopTimer();
          onTimerEnd();
        }
      }, 1000);
    }

    // 타이머 종료 처리: XP 지급 후 결과창 표시
    function onTimerEnd() {
      const chars = window.Questify.getCharacters();
      const char = chars[timerSelectedCharIdx] || chars[0];
      const prevLevel = char.level;

      // XP 지급
      const xpGained = 50;
      window.Questify.gainXP(xpGained, timerSelectedCharIdx);
      updateTimerCharHUD();

      const newLevel = window.Questify.getCharacters()[timerSelectedCharIdx].level;
      const leveledUp = newLevel > prevLevel;

      // 결과창 표시
      document.getElementById('result-char-name').textContent = char.name;
      document.getElementById('result-xp-badge').textContent = '+' + xpGained + ' XP 획득!';
      document.getElementById('result-lv-text').textContent = leveledUp
        ? `🎉 레벨 업! Lv.${prevLevel} → Lv.${newLevel}`
        : `현재 레벨: Lv.${newLevel}`;

      timerResultOverlay.classList.remove('hidden');
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      timerPaused = false;
      startTimerBtn.innerText = '시작';
      timerDisplay.disabled = false;
    }

    // 결과창 메모 작성 버튼
    document.getElementById('result-btn-memo').addEventListener('click', () => {
      timerResultOverlay.classList.add('hidden');
      targetCharIdxForMemo = timerSelectedCharIdx;
      const charName = window.Questify.getCharacters()[timerSelectedCharIdx].name;
      document.getElementById('notepad-target-char-label').innerText = `[${charName}] 캐릭터에게 메모를 추가합니다.`;
      document.getElementById('input-notepad-content').value = '';
      // 타이머 화면을 닫고 모달 열기
      closeTimerScreen();
      totalSeconds = 0;
      updateDisplays();
      openSpecificModal('notepad-modal');
    });

    // 결과창 건너뛰기 버튼
    document.getElementById('result-btn-skip').addEventListener('click', () => {
      timerResultOverlay.classList.add('hidden');
      closeTimerScreen();
      totalSeconds = 0;
      updateDisplays();
    });

    startTimerBtn.addEventListener('click', () => {
      if (timerRunning) {
        timerPaused = !timerPaused;
        startTimerBtn.innerText = timerPaused ? '계속' : '일시정지';
      } else {
        startTimer();
      }
    });
    resetTimerBtn.addEventListener('click', () => { stopTimer(); totalSeconds = 0; updateDisplays(); });
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (timerRunning && !timerPaused) return;
        totalSeconds += parseInt(btn.dataset.time, 10);
        updateDisplays();
      });
    });

    let dragSrcEl = null;
    function handleDragStart(e) {
      dragSrcEl = this;
      this.style.opacity = '.4';
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleDragOver(e) {
      e.preventDefault();
      if (this !== dragSrcEl && this.classList.contains('draggable-todo-item') && this.dataset.status !== 'clear') {
        const children = Array.from(this.parentNode.querySelectorAll('.draggable-todo-item'));
        if (children.indexOf(dragSrcEl) < children.indexOf(this)) this.after(dragSrcEl);
        else this.before(dragSrcEl);
      }
      return false;
    }
    function handleDragEnd() {
      this.style.opacity = '1';
    }

    const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
    const appContainer = document.querySelector('.app');
    mobileToggleBtn.addEventListener('click', () => {
      appContainer.classList.toggle('mobile-menu-open');
    });

    const gameScreen = document.getElementById('game-screen');
    const timerScreen = document.getElementById('timer-screen');
    const openTimerBtn = document.getElementById('open-timer-btn');
    const closeTimerBtn = document.getElementById('close-timer-btn');
    const timerCharSelect = document.getElementById('timer-char-select');
    const timerMain = document.getElementById('timer-main');
    const timerResultOverlay = document.getElementById('timer-result-overlay');

    // 타이머용 선택된 캐릭터 인덱스
    let timerSelectedCharIdx = 0;

    // 캐릭터 선택창 렌더링 (로비와 동일 레이아웃, 이름변경/삭제 제거, 칸 자체가 선택 버튼)
    function renderTimerCharSelect() {
      const chars = window.Questify.getCharacters();
      const grid = document.getElementById('timer-char-grid');
      grid.innerHTML = '';
      chars.forEach((char, idx) => {
        const requiredXP = window.Questify.getXpRequired(char.level);
        const xpPercent = requiredXP === Infinity ? 100 : Math.min(100, (char.xp / requiredXP) * 100);
        const color = char.level >= 40 ? '#f87171' : char.level >= 20 ? '#fcd34d' : char.level >= 10 ? '#93c5fd' : '#f3f4f6';

        const card = document.createElement('div');
        card.className = 'timer-char-card';
        card.innerHTML = `
          <div class="timer-cs-char-body">
            <img src="chrSD.png" alt="캐릭터">
          </div>
          <div class="timer-cs-nameplate">
            <div class="timer-cs-name">${escapeHTML(char.name)}</div>
            <div class="timer-cs-level" style="color:${color}">Lv.${char.level}</div>
            <div class="timer-cs-xpbar-bg">
              <div class="timer-cs-xpbar-fill" style="width:${xpPercent}%"></div>
            </div>
            <div class="timer-cs-xp-text">${char.xp} / ${requiredXP === Infinity ? 'MAX' : requiredXP} XP</div>
          </div>
        `;
        card.addEventListener('click', () => {
          timerSelectedCharIdx = idx;
          // HUD 업데이트
          updateTimerCharHUD();
          // 선택창 숨기고 타이머 메인 표시
          timerCharSelect.classList.add('hidden');
          timerMain.classList.remove('hidden');
        });
        grid.appendChild(card);
      });
    }

    // 타이머 화면 내 캐릭터 HUD 업데이트
    function updateTimerCharHUD() {
      const chars = window.Questify.getCharacters();
      const char = chars[timerSelectedCharIdx] || chars[0];
      if (!char) return;
      const requiredXP = window.Questify.getXpRequired(char.level);
      const xpPercent = requiredXP === Infinity ? 100 : Math.min(100, (char.xp / requiredXP) * 100);
      document.getElementById('timer-char-hud-name').textContent = char.name;
      document.getElementById('timer-char-hud-level').textContent = 'Lv.' + char.level;
      document.getElementById('timer-char-hud-xpfill').style.width = xpPercent + '%';
    }

    function openTimerScreen() {
      gameScreen.classList.add('hidden');
      timerScreen.classList.remove('hidden');
      timerResultOverlay.classList.add('hidden');
      openTimerBtn.style.background = '#d1d5db';
      // 항상 캐릭터 선택창부터 표시
      timerMain.classList.add('hidden');
      timerCharSelect.classList.remove('hidden');
      renderTimerCharSelect();
    }

    function closeTimerScreen() {
      timerScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      timerResultOverlay.classList.add('hidden');
      openTimerBtn.style.background = '#fff';
    }

    openTimerBtn.addEventListener('click', openTimerScreen);
    closeTimerBtn.addEventListener('click', () => {
      if (timerRunning) {
        showCustomConfirm('타이머가 진행 중입니다.\n정말 닫으시겠습니까?', () => {
          stopTimer();
          totalSeconds = 0;
          updateDisplays();
          closeTimerScreen();
        });
      } else {
        closeTimerScreen();
      }
    });

    const tabQuest = document.getElementById('tab-quest');
    const panelQuest = document.getElementById('panel-quest');
    const tabStorage = document.getElementById('tab-storage');
    const panelStorage = document.getElementById('panel-storage');
    
    tabStorage.addEventListener('click', () => {
      panelQuest.classList.add('hidden');
      panelStorage.classList.remove('hidden');
      tabStorage.classList.add('active');
      tabQuest.classList.remove('active');
    });
    tabQuest.addEventListener('click', () => {
      panelStorage.classList.add('hidden');
      panelQuest.classList.remove('hidden');
      tabQuest.classList.add('active');
      tabStorage.classList.remove('active');
    });

    document.getElementById('user-profile-card').addEventListener('click', () => {
      renderSlotInventory();
      openSpecificModal('slot-modal');
    });

    function renderSlotInventory() {
      const chars = window.Questify.getCharacters();
      const container = document.getElementById('slot-manager-container');
      const unionLevelDisplay = document.getElementById('union-level-display');
      if (unionLevelDisplay) unionLevelDisplay.innerText = '전체 유니온 Lv.' + window.Questify.getUnionLevel();
      container.innerHTML = '';
      
      chars.forEach((char, index) => {
        const slotCard = document.createElement('div');
        slotCard.className = 'slot-card';
        
        // [복구] 캐릭터 관리창(슬롯) 하단 경험치 바 (HTML)
        const maxXP = window.Questify.getXpRequired(char.level);
        const xpText = maxXP === Infinity ? 'MAX' : maxXP;
        const xpPercent = maxXP === Infinity ? 100 : Math.min(100, (char.xp / maxXP) * 100);

        slotCard.innerHTML = `
          <div class="slot-head">
            <span style="font-weight:900;">${escapeHTML(char.name)}</span>
            ${char.level >= 50 ? '<span class="badge gold">졸업</span>' : ''}
          </div>
          <div style="font-size:13px; color:#374151; font-weight:800; margin-top:4px;">레벨: Lv.${char.level}</div>
          <div style="font-size:13px; color:#374151; font-weight:800; margin-top:4px;">경험치: ${char.xp} / ${xpText} XP</div>
          <div style="width: 100%; height: 8px; background: rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; margin-top: 4px; overflow: hidden;">
            <div style="width: ${xpPercent}%; height: 100%; background: #3b82f6; transition: width 0.3s;"></div>
          </div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <button class="plain-btn" style="flex:1; padding:6px; font-size:12px; border-radius:5px;" onclick="window.renameChar(${index})">이름 변경</button>
            <button class="plain-btn" style="flex:1; padding:6px; font-size:12px; border-radius:5px; background:#ef4444; color:#fff;" onclick="window.deleteChar(${index})">삭제</button>
          </div>
        `;
        container.appendChild(slotCard);
      });
      
      document.getElementById('btn-add-new-character').onclick = () => {
        showCustomPrompt('새로운 카테고리(캐릭터) 이름을 입력하세요:', '새 목표', (newName) => {
           if (!newName || !newName.trim()) newName = '캐릭터 ' + (chars.length + 1);
           const randomX = Math.floor(Math.random() * 60) + 20; 
           const randomY = Math.floor(Math.random() * 40) + 40;
           chars.push({ name: newName.trim().substring(0, 10), level: 1, xp: 0, x: randomX, y: randomY, showExclamation: false });
           window.Questify.saveState();
           window.Questify.updateUI();
           renderSlotInventory();
        });
      };
    }

    document.getElementById('btn-reset-all-data').addEventListener('click', () => {
      showCustomConfirm('경고: 모든 데이터가 삭제됩니다.\n정말 삭제하시겠습니까?', () => {
        localStorage.clear();
        location.reload();
      });
    });

    window.renameChar = function(idx) {
      const currentName = window.Questify.getCharacters()[idx].name;
      showCustomPrompt('새로운 캐릭터 이름을 입력하세요:', currentName, (newName) => {
        if (newName && newName.trim()) {
          window.Questify.getCharacters()[idx].name = newName.trim().substring(0, 10);
          window.Questify.saveState();
          window.Questify.updateUI();
          renderSlotInventory();
        }
      });
    }

    window.deleteChar = function(idx) {
      const chars = window.Questify.getCharacters();
      if (chars.length <= 1) {
        showCustomAlert('캐릭터는 반드시 1명 이상 존재해야 합니다.');
        return;
      }
      showCustomConfirm('이 캐릭터를 정말 삭제하시겠습니까? (메모와 퀘스트는 보존됩니다)', () => {
        chars.splice(idx, 1);
        quizStorage.forEach(q => { if(q.charIdx === idx) q.charIdx = 0; else if(q.charIdx > idx) q.charIdx--; });
        memoStorage.forEach(m => { if(m.charIdx === idx) m.charIdx = 0; else if(m.charIdx > idx) m.charIdx--; });
        window.Questify.saveState();
        window.Questify.updateUI();
        renderSlotInventory();
        renderAll();
      });
    }

    loadAppData();
    renderAll();
  </script>
</body>

</html>
